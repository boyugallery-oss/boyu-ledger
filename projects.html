<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <!-- 版本三・2026-10-08 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>📁 Boyu 專案管理</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F7F6F3; color: #1A1A1A; min-height: 100vh; }

    /* ── Header ── */
    .app-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 300; height: 52px;
      background: rgba(247,246,243,0.92); backdrop-filter: blur(8px);
      border-bottom: 1px solid #E8E8E4;
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .app-title { font-size: 0.95rem; font-weight: 700; }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #CCC; transition: background 0.3s; }
    .sync-dot.ok { background: #4CAF50; } .sync-dot.err { background: #F44336; }
    .sync-dot.loading { background: #FF9800; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }
    .search-box { padding: 6px 12px; font-size: 0.8rem; border: 1.5px solid #E0E0E0; border-radius: 8px; background: white; width: 150px; font-family: inherit; outline: none; }
    .search-box:focus { border-color: #AAA; }
    .btn-new { padding: 6px 14px; background: #1C1C1C; color: white; border: none; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; }
    .btn-new:hover { background: #333; }
    .btn-year { padding: 6px 14px; background: white; color: #1C1C1C; border: 1px solid #E4E4E0; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; }
    .btn-year:hover { background: #F7F6F3; }
    .year-select { flex-shrink: 0; }
    /* 原生下拉選單展開時指定黑體，避免變成明體 */
    option { font-family: 'PingFang TC', 'Heiti TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif !important; }
    .btn-year .cnt { color: #C62828; margin-left: 4px; }
    .btn-more { padding: 6px 10px; letter-spacing: 1px; position: relative; }
    .btn-more.warn::after { content: ''; position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: #E53935; border: 1.5px solid #F7F6F3; }
    .badge.dd-warn { color: #C62828; }
    .lock-hint { font-size: 0.68rem; color: #E67E00; background: #FFF3E0; padding: 2px 8px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
    /* 登入畫面 */
    #login-ov { display: none; position: fixed; inset: 0; z-index: 2000; background: #F7F6F3; align-items: center; justify-content: center; padding: 20px; }
    #login-ov.open { display: flex; }
    .login-card { background: white; border-radius: 18px; padding: 28px 24px; width: 100%; max-width: 340px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .login-ttl { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
    .login-sub { font-size: 0.74rem; color: #999; margin-bottom: 18px; }
    .login-err { font-size: 0.74rem; color: #C62828; min-height: 18px; margin: 2px 0 8px; }
    .login-cancel { display: block; width: 100%; margin-top: 10px; background: none; border: none; color: #999; font-size: 0.76rem; cursor: pointer; font-family: inherit; }
    /* Deadline 提醒 */
    .dl-over { color: #C62828 !important; font-weight: 600; }
    .dl-soon { color: #E67E00 !important; font-weight: 600; }
    .dl-note { font-size: 0.7rem; margin-left: 6px; font-weight: 500; }
    /* 缺資料檢查 */
    .filter-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #FFF8E1; border: 1px solid #FFE9A8; color: #8A6500; font-size: 0.78rem; padding: 9px 14px; border-radius: 10px; margin: 0 12px 16px; }
    .filter-bar button { background: white; border: 1px solid #E8D48A; color: #8A6500; border-radius: 7px; padding: 4px 10px; font-size: 0.74rem; cursor: pointer; font-family: inherit; white-space: nowrap; }
    .miss-tag { font-size: 0.64rem; color: #8A6500; background: #FFF3CD; padding: 1px 6px; border-radius: 8px; flex-shrink: 0; font-weight: 500; }
    /* 月曆檢視 */
    /* 視窗固定高度：切換月份或月／年時不會上下跳動；下方清單太長就在裡面捲動 */
    #cal-modal .modal-sheet { height: 92vh; display: flex; flex-direction: column; }
    @media (min-width: 601px) { #cal-modal .modal-sheet { max-width: 900px; height: min(calc(100vh - 48px), 880px); } }
    #cal-modal .modal-hd { flex-shrink: 0; }
    #cal-month-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #cal-month-wrap > .calv-wd, #cal-month-wrap > .calv-grid { flex-shrink: 0; }
    #cal-list { flex: 1; min-height: 110px; overflow-y: auto; }
    #cal-year-wrap { flex: 1; min-height: 0; overflow-y: auto; }
    .tl-nav { background: none; border: 1px solid #E4E4E0; border-radius: 8px; width: 30px; height: 30px; font-size: 1rem; line-height: 1; cursor: pointer; color: #555; font-family: inherit; }
    .tl-nav:hover { background: #F7F6F3; }
    .calv-wd { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 0.68rem; color: #AAA; text-align: center; margin-bottom: 4px; }
    .calv-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid #EEEDE9; border-left: 1px solid #EEEDE9; border-radius: 8px; overflow: hidden; }
    .calv-cell { border-right: 1px solid #EEEDE9; border-bottom: 1px solid #EEEDE9; height: 96px; overflow: visible; padding: 4px 0 3px; background: white; min-width: 0; }
    .calv-cell.out { background: #FAFAF8; }
    .calv-day { font-size: 0.68rem; color: #999; padding: 0 6px; height: 19px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: flex-start; line-height: 15px; }
    .calv-cell.out .calv-day { color: #D5D5D0; }
    .calv-cell.today .calv-day b { background: #1C1C1C; color: white; border-radius: 10px; padding: 0 6px; font-weight: 600; margin-left: -4px; }
    .calv-bar { height: 17px; margin-bottom: 2px; font-size: 0.64rem; line-height: 17px; padding: 0 5px; white-space: nowrap; overflow: hidden; text-overflow: clip; cursor: pointer; font-weight: 500; }
    .calv-bar.s { border-radius: 4px 0 0 4px; margin-left: 3px; }
    .calv-bar.e { border-radius: 0 4px 4px 0; margin-right: 3px; }
    .calv-bar.s.e { border-radius: 4px; }
    /* 月曆上的色條比標籤深一點才看得清楚；名稱可以延伸到後面幾天 */
    .calv-bar.b-接洽中 { background: #FFE2C2; } .calv-bar.b-進行中 { background: #FAEDB4; }
    .calv-bar.b-暫停 { background: #E3DAFB; }   .calv-bar.b-已完成 { background: #CFEEDA; }
    .calv-bar.lbl:not(.e) { overflow: visible; position: relative; z-index: 1; }
    .calv-bar.gap { background: none !important; cursor: default; }
    .calv-more { font-size: 0.62rem; color: #777; background: #EEEEEC; border-radius: 8px; padding: 0 5px; line-height: 14px; cursor: pointer; font-weight: 600; }
    .calv-more:hover { background: #E0E0DC; color: #1C1C1C; }
    .calv-dl { font-size: 0.62rem; line-height: 14px; height: 14px; color: #C62828; padding: 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    .cal-li { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-bottom: 1px solid #F5F5F2; cursor: pointer; border-radius: 8px; }
    .cal-li:hover { background: #FAFAF8; }
    .cal-li:last-child { border-bottom: none; }
    .cal-li-name { flex: 1; min-width: 0; font-size: 0.82rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cal-li-date { font-size: 0.7rem; color: #999; white-space: nowrap; flex-shrink: 0; }
    .cal-li .badge { font-size: 0.66rem; padding: 2px 8px; cursor: inherit; flex-shrink: 0; }
    @media (max-width: 640px) { .calv-cell { height: 66px; } .calv-bar { font-size: 0.56rem; padding: 0 2px; } .calv-day { padding: 0 3px 3px; } .calv-dl { display: none; } }
    /* 月曆：年檢視（每個專案一列，橫條橫跨 12 個月） */
    .cal-seg { display: inline-flex; background: #F0F0EE; border-radius: 8px; padding: 2px; }
    .cal-seg button { border: none; background: none; padding: 4px 12px; font-size: 0.74rem; border-radius: 6px; cursor: pointer; color: #888; font-family: inherit; }
    .cal-seg button.on { background: white; color: #1C1C1C; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
    .yv { --label: 190px; }
    .yv-row { display: grid; grid-template-columns: var(--label) minmax(0, 1fr); align-items: center; }
    .yv-months, .yv-load, .yv-track { display: flex; position: relative; }
    .yv-months span { font-size: 0.68rem; color: #999; text-align: center; padding: 4px 0; min-width: 0; }
    .yv-months span.now { color: #1C1C1C; font-weight: 700; }
    .yv-load span { font-size: 0.68rem; text-align: center; padding: 5px 0; min-width: 0; border-left: 1px solid white; color: #7A6400; }
    .yv-load span.free { background: #E6F6EC !important; color: #237843 !important; font-weight: 600; text-shadow: none !important; }
    .yv-head-label { font-size: 0.68rem; color: #AAA; padding-right: 10px; }
    .yv-body { border-top: 1px solid #EEEDE9; margin-top: 6px; }
    .yv-row.item { border-bottom: 1px solid #F5F5F2; cursor: pointer; }
    .yv-row.item:hover { background: #FAFAF8; }
    .yv-name { font-size: 0.78rem; font-weight: 500; padding: 7px 10px 7px 4px; min-width: 0; }
    .yv-name div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .yv-name small { display: block; font-size: 0.66rem; color: #AAA; font-weight: 400; margin-top: 1px; }
    .yv-track { height: 34px; align-items: center; }
    .yv-track i { position: absolute; top: 0; bottom: 0; width: 1px; background: #F0F0EC; }
    .yv-track i.today { background: #E53935; width: 1.5px; z-index: 2; }
    .yv-bar { position: absolute; height: 16px; border-radius: 4px; min-width: 4px; z-index: 1; }
    .yv-bar.b-接洽中, .yv-legend i.b-接洽中 { background: #FF9800; }
    .yv-bar.b-進行中, .yv-legend i.b-進行中 { background: #FAEDB4; } /* 跟月檢視同一個淺黃 */
    .yv-bar.b-暫停,   .yv-legend i.b-暫停   { background: #B79DE3; }
    .yv-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.72rem; color: #777; margin-top: 14px; }
    .yv-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .yv-legend i { width: 18px; height: 10px; border-radius: 3px; display: inline-block; }
    .yv-bar.cl { border-top-left-radius: 0; border-bottom-left-radius: 0; }
    .yv-bar.cr { border-top-right-radius: 0; border-bottom-right-radius: 0; }
    @media (max-width: 640px) {
      .yv-row { grid-template-columns: minmax(0, 1fr); }
      .yv-head-label { display: none; }
      .yv-name { padding: 7px 2px 0; }
      .yv-name small { display: inline; margin-left: 6px; }
      .yv-track { height: 26px; }
    }
    /* 待收款 */
    .rc-total { background: #F7F6F3; border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: baseline; }
    .rc-total span { font-size: 0.74rem; color: #999; }
    .rc-total b { font-size: 1.15rem; color: #C62828; }
    .rc-row { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-bottom: 1px solid #F5F5F2; cursor: pointer; border-radius: 8px; }
    .rc-row:hover { background: #FAFAF8; }
    .rc-row:last-child { border-bottom: none; }
    .rc-main { flex: 1; min-width: 0; }
    .rc-name { font-size: 0.84rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rc-sub { font-size: 0.7rem; color: #AAA; margin-top: 2px; }
    .rc-sub .late { color: #C62828; font-weight: 600; }
    .rc-amt { text-align: right; flex-shrink: 0; }
    .rc-amt b { display: block; font-size: 0.86rem; margin-bottom: 3px; }
    .rc-amt .badge { font-size: 0.66rem; padding: 2px 8px; cursor: inherit; }
    .rc-copy { background: none; border: none; color: #C4C4C0; border-radius: 8px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: color 0.12s, background 0.12s; }
    .rc-copy:hover { background: #F0F0EE; color: #777; }
    .rc-amt small { font-size: 0.66rem; color: #AAA; margin-right: 6px; }
    @media (max-width: 640px) {
      .app-header { padding: 0 12px; gap: 8px; }
      .app-header .btn-year:not(.btn-more):not(.year-select) { display: none; }
      .hide-m { display: none; }
      .search-box { width: auto; flex: 1; min-width: 0; }
      .lock-hint { display: none; }
    }
    /* 全年收入視窗（版型沿用記帳本的統計頁） */
    .yr-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .yr-card { background: #F7F6F3; border-radius: 14px; padding: 14px 8px; text-align: center; }
    .yr-label { font-size: 0.78rem; color: #999; margin-bottom: 6px; }
    .yr-value { font-size: 1.3rem; font-weight: 700; }
    @media (max-width: 640px) { .yr-value { font-size: 1.08rem; } }
    .yr-sub { font-size: 0.66rem; color: #AAA; margin-top: 4px; }
    .c-income { color: #2E7D32; }
    .c-expense { color: #C62828; }
    .yr-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .yr-head-title { font-size: 1.05rem; font-weight: 700; }
    #yr-modal .modal-ttl { font-size: 1.05rem; font-weight: 700; }
    .yr-head select { width: auto; padding: 5px 8px; font-size: 0.78rem; border-radius: 8px; border: 1.5px solid #E8E8E4; background: white; font-family: inherit; }
    .mc-legend { display: flex; gap: 12px; margin-bottom: 12px; }
    .mc-legend-item { display: flex; align-items: center; gap: 4px; font-size: 0.72rem; color: #888; }
    .mc-dot { width: 8px; height: 8px; border-radius: 2px; }
    .mc-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .mc-row.mc-dim { opacity: 0.3; }
    .mc-label { font-size: 0.75rem; color: #666; width: 32px; flex-shrink: 0; white-space: nowrap; }
    .mc-bars { flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .mc-bar-wrap { background: #F0F0F0; border-radius: 3px; height: 6px; overflow: hidden; }
    .mc-bar { height: 100%; border-radius: 3px; transition: width 0.5s; }
    .mc-bar-income { background: #4CAF50; }
    .mc-bar-expense { background: #EF5350; }
    .mc-amounts { display: flex; flex-direction: column; gap: 1px; width: 84px; text-align: right; flex-shrink: 0; }
    .mc-amounts span { font-size: 0.68rem; font-weight: 600; }
    .bd-title { font-size: 0.88rem; font-weight: 600; margin: 22px 0 12px; }
    .bd-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
    .bd-label { font-size: 0.75rem; color: #444; width: 150px; flex-shrink: 0; display: flex; align-items: baseline; gap: 4px; min-width: 0; }
    .bd-label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .bd-label small { color: #BBB; font-size: 0.66rem; flex-shrink: 0; white-space: nowrap; }
    .bd-bar-wrap { flex: 1; background: #F0F0F0; border-radius: 3px; height: 6px; overflow: hidden; }
    .bd-amt { width: 134px; text-align: right; flex-shrink: 0; font-size: 0.82rem; font-weight: 600; color: #2E7D32; white-space: nowrap; }
    .bd-amt small { color: #AAA; font-weight: 500; margin-left: 6px; font-size: 0.66rem; }
    @media (max-width: 640px) { .bd-label { width: 104px; } .bd-amt { width: 112px; } }
    /* 年度復盤：每列下方的小字、跟去年比的表格、可點的專案清單 */
    .bd-sub { font-size: 0.68rem; color: #AAA; margin: -4px 0 11px; line-height: 1.5; }
    .bd-sub b { font-weight: 600; }
    .bd-count { width: 118px; text-align: right; flex-shrink: 0; font-size: 0.72rem; font-weight: 600; color: #666; white-space: nowrap; }
    .rv-table { width: 100%; border-collapse: collapse; font-size: 0.76rem; }
    .rv-table th { font-weight: 500; color: #AAA; font-size: 0.68rem; text-align: right; padding: 0 0 6px; }
    .rv-table td { padding: 8px 0; border-top: 1px solid #F0F0F0; text-align: right; white-space: nowrap; font-weight: 600; }
    .rv-table th:first-child, .rv-table td:first-child { text-align: left; color: #444; font-weight: 400; }
    .rv-table td.rv-prev { color: #AAA; font-weight: 400; }
    .rv-table td.rv-diff { font-size: 0.7rem; width: 74px; }
    .rv-item { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-top: 1px solid #F0F0F0; font-size: 0.76rem; cursor: pointer; }
    .rv-item:hover { background: #FAFAF8; }
    .rv-item .rv-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #444; }
    .rv-item small { color: #AAA; font-size: 0.68rem; white-space: nowrap; }
    .rv-item b { font-weight: 600; white-space: nowrap; }
    .b-meta { background: #F0F0F0; color: #666; }
    /* 每個板塊一張卡片，標題放大加粗，內文行距收緊 */
    .rv-sec { border: 1px solid #E6E5E0; border-radius: 14px; padding: 16px 16px 12px; margin-top: 14px; }
    .rv-sec .bd-title { font-size: 1.05rem; font-weight: 700; margin: 0 0 12px; }
    .rv-sec .bd-row { margin-bottom: 3px; }
    .rv-sec .bd-sub { margin: 0 0 8px; line-height: 1.35; }
    .rv-sec .bd-row:last-child, .rv-sec .bd-sub:last-child { margin-bottom: 2px; }
    .rv-sec .rv-table td { padding: 5px 0; }
    .rv-sec .rv-item { padding: 5px 0; }
    .rv-sec .bd-sub.rv-lead { margin: -6px 0 10px; }
    @media (max-width: 640px) { .bd-count { width: 100px; } .rv-table td.rv-diff { width: 58px; } }
    .yr-note { font-size: 0.7rem; color: #AAA; margin-top: 14px; line-height: 1.6; }

    /* ── Layout ── */
    .app-wrap { margin-top: 52px; max-width: 1240px; margin-left: auto; margin-right: auto; padding: 0 28px; }

    /* Desktop: flex + width transition for silky slide */
    @media (min-width: 860px) {
      .app-wrap          { display: flex; align-items: flex-start; }
      .list-col          { flex: 1; min-width: 0; padding: 20px 0 80px; }
      .app-wrap.open .list-col { padding-right: 12px; }
      .panel-col         {
        flex-shrink: 0; width: 0; overflow: hidden;
        transition: width 0.38s cubic-bezier(0.4,0,0.2,1);
      }
      .app-wrap.open .panel-col {
        width: 50%; border-left: 1px solid #EEEDE9;
      }
      .panel-scroll      {
        width: 100%; height: calc(100vh - 52px); overflow-y: auto;
        padding: 28px 36px 60px; background: white;
        position: sticky; top: 52px;
      }

      /* When panel open (or closing): show name / status / 發票 / priority / category */
      .app-wrap.open .table-head,
      .app-wrap.was-open .table-head { grid-template-columns: 1fr 92px 88px 72px 70px; }
      .app-wrap.open .table-row,
      .app-wrap.was-open .table-row  { grid-template-columns: 1fr 92px 88px 72px 70px; }
      .app-wrap.open .th:nth-child(4),
      .app-wrap.open .th:nth-child(5),
      .app-wrap.open .th:nth-child(7),
      .app-wrap.was-open .th:nth-child(4),
      .app-wrap.was-open .th:nth-child(5),
      .app-wrap.was-open .th:nth-child(7)          { display: none; }
      .app-wrap.open .table-row > .td:nth-child(4),
      .app-wrap.open .table-row > .td:nth-child(5),
      .app-wrap.open .table-row > .td:nth-child(7),
      .app-wrap.was-open .table-row > .td:nth-child(4),
      .app-wrap.was-open .table-row > .td:nth-child(5),
      .app-wrap.was-open .table-row > .td:nth-child(7) { display: none; }
    }

    /* Mobile: full-screen slide */
    @media (max-width: 859px) {
      .app-wrap  { display: block; padding: 12px 12px 80px; }
      .panel-col { position: fixed; top: 52px; right: 0; bottom: 0; width: 100%; background: white; z-index: 400; transform: translateX(100%); transition: transform 0.38s cubic-bezier(0.4,0,0.2,1); overflow-y: auto; }
      .app-wrap.open .panel-col { transform: translateX(0); }
      .panel-scroll { padding: 20px 16px 60px; }

<script>
  const SB_URL = 'https://dwbxuhqhxtvsryzzqsgp.supabase.co';
  const SB_KEY = 'sb_publishable_zmCiLOJx3GxYOxda_nYKMQ_DgcR9Srb';

  const STATUS_ORDER  = ['接洽中','進行中','暫停','終止','已完成'];
  const TASK_STATUSES = ['未開始','進行中','已完成'];
  const CAT_PREFIX    = { '藝術':'A','設計':'D','空間':'S','其他':'O' };

  let db, cases = [];
  let editingId = null, viewingId = null;
  let collapsed = {};

  // ── Init ──────────────────────────────────
  // 登入狀態：session 有值＝已登入；dbOpen＝資料庫還沒上鎖（不登入也讀得到）
  let session = null, dbOpen = false, missingOnly = false;
  // 首頁年度：預設今年；'all' 代表全部。專案屬於哪一年看結束日期（沒有就看開始日期，再沒有就看建立日期）；收款日期只影響全年收入的月份
  let viewYear = String(new Date().getFullYear());
  function caseYear(c) { return (c.end_date || c.start_date || c.created_at || '').slice(0,4) || String(new Date().getFullYear()); }
  function inViewYear(c) { return viewYear === 'all' || caseYear(c) === viewYear; }
  let viewYears = [];
  function openYearMenu(anchor) {
    const mark = v => v === viewYear ? '　✓' : '';
    showInlineDD(anchor, [...viewYears.map(y=>({value:y,cls:'',label:y+'年'+mark(y)})), {sep:true}, {value:'all',cls:'',label:'全部'+mark('all')}],
      v => { viewYear = v; missingOnly = false; renderAll(); });
  }
  async function init() {
    try { if (window.supabase) db = window.supabase.createClient(SB_URL, SB_KEY); } catch(e) {}
    if (!db) { startApp(); return; }
    try { session = (await db.auth.getSession()).data.session; } catch(e) {}
    db.auth.onAuthStateChange((event, s) => {
      session = s;
      if (event === 'SIGNED_OUT' && !dbOpen) showLogin();
    });
    if (session) { startApp(); return; }
    // 沒登入：試讀一筆，讀得到代表資料庫還沒上鎖，照舊使用；讀不到就要求登入
    let probe;
    try { probe = await db.from('cases').select('id').limit(1); } catch(e) { probe = { error: e }; }
    if (!probe.error && probe.data && probe.data.length) { dbOpen = true; startApp(); return; }
    if (probe.error && (!navigator.onLine || /fetch|network/i.test(probe.error.message||''))) { startApp(); return; } // 離線：先顯示本機暫存
    showLogin();
  }
  async function startApp() {
    try { const r = localStorage.getItem('boyu_cases'); cases = r ? JSON.parse(r) : []; } catch(e) { cases = []; }
    resetUndo();
    updateLockHint();
    renderAll();
    await loadFromCloud();
  }
  function updateLockHint() { document.getElementById('lock-hint').style.display = (dbOpen && !session) ? '' : 'none'; }
  function showLogin(cancellable=false) {
    document.getElementById('lg-err').textContent = '';
    document.getElementById('lg-pass').value = '';
    document.getElementById('lg-cancel').style.display = cancellable ? '' : 'none';
    document.getElementById('login-ov').classList.add('open');
    setTimeout(() => document.getElementById('lg-email').focus(), 50);
  }
  function hideLogin() { document.getElementById('login-ov').classList.remove('open'); }
  async function doLogin() {
    const email = document.getElementById('lg-email').value.trim(), password = document.getElementById('lg-pass').value;
    const err = document.getElementById('lg-err'), btn = document.getElementById('lg-btn');
    if (!email || !password) { err.textContent = '請輸入 Email 和密碼'; return; }
    btn.disabled = true; btn.textContent = '登入中…'; err.textContent = '';
    let res;
    try { res = await db.auth.signInWithPassword({ email, password }); } catch(e) { res = { error: e }; }
    btn.disabled = false; btn.textContent = '登入';
    if (res.error) { err.textContent = /invalid/i.test(res.error.message||'') ? 'Email 或密碼不對' : '登入失敗：' + (res.error.message||'請再試一次'); return; }
    session = res.data.session;
    hideLogin(); showToast('已登入 ✓');
    startApp();
  }
  async function doLogout() {
    try { await db.auth.signOut(); } catch(e) {}
    session = null; updateLockHint();
    if (dbOpen) { showToast('已登出'); return; }
    // 資料庫已上鎖：登出就清掉這台裝置上的暫存
    try { localStorage.removeItem('boyu_cases'); } catch(e) {}
    cases = []; viewingId = null; document.getElementById('app-wrap').classList.remove('open');
    renderAll(); showLogin();
  }

  async function loadFromCloud() {
    if (!db) { setSyncDot('err'); return; }
    for (const delay of [0,3000,6000]) {
      if (delay) await new Promise(r => setTimeout(r, delay));
      setSyncDot('loading');
      try {
        const { data, error } = await db.from('cases').select('*').order('created_at',{ascending:false});
        // 沒登入又讀到空的＝資料庫已上鎖，不要用空資料蓋掉畫面，改成要求登入
        if (!error && data && !data.length && !session && !dbOpen) { setSyncDot('err'); showLogin(); return; }
        if (!error && data) { cases = data; resetUndo(); saveLocal(); renderAll(); if (viewingId) renderPanel(); setSyncDot('ok'); return; }
        if (error && delay===6000) showToast('⚠ 讀取失敗：'+error.message);
      } catch(e) { if(delay===6000) showToast('⚠ 連線錯誤：'+e.message); }
      setSyncDot('err');
    }
  }

  // 每次存檔前，把「上一個樣子」留一份，給復原用（最多留 30 步；同一個動作連續觸發的存檔併成一步）。
  // 重新從雲端讀資料時會清空，所以只能復原這次打開頁面之後做的事
  let _snap = null, _lastPush = 0;
  const undoStack = [];
  function saveLocal() {
    const now = JSON.stringify(cases);
    if (_snap !== null && now !== _snap) {
      const t = Date.now();
      if (t - _lastPush > 400) { undoStack.push(_snap); if (undoStack.length > 30) undoStack.shift(); _lastPush = t; }
    }
    _snap = now;
    localStorage.setItem('boyu_cases', now);
    updateUndoBtn();
  }
  function resetUndo() { undoStack.length = 0; _snap = JSON.stringify(cases); updateUndoBtn(); }
  function updateUndoBtn() { const b = document.getElementById('undo-btn'); if (b) b.style.display = undoStack.length ? '' : 'none'; }
  async function undoLast() {
    if (!undoStack.length) { showToast('沒有可以復原的動作'); return; }
    const prev = JSON.parse(undoStack.pop()), cur = cases;
    const prevIds = new Set(prev.map(c=>c.id)), curMap = new Map(cur.map(c=>[c.id,c]));
    // 比對前後差異，雲端只改有變的那幾筆：被改過的改回去、被刪掉的加回來、新增的刪掉
    const ops = [];
    for (const c of prev) { const now = curMap.get(c.id); if (!now) ops.push(['insert', c]); else if (JSON.stringify(now) !== JSON.stringify(c)) ops.push(['update', c]); }
    for (const c of cur) if (!prevIds.has(c.id)) ops.push(['delete', c]);
    cases = prev; _snap = JSON.stringify(cases);
    localStorage.setItem('boyu_cases', _snap);
    closeInlineDD();
    if (viewingId && !prevIds.has(viewingId)) closePanel();
    renderAll(); if (viewingId) renderPanel();
    updateUndoBtn(); showToast('已復原上一步 ✓');
    if (!db) return;
    setSyncDot('loading');
    let failed = false;
    for (const [op, c] of ops) {
      try {
        const { id, ...rest } = c;
        const { error } = await (op === 'insert' ? db.from('cases').insert(c) : op === 'update' ? db.from('cases').update(rest).eq('id', id) : db.from('cases').delete().eq('id', id));
        if (error) failed = true;
      } catch (e) { failed = true; }
    }
    setSyncDot(failed ? 'err' : 'ok');
    if (failed) showToast('⚠ 畫面已復原，但雲端同步失敗，請重新整理確認');
  }
  document.addEventListener('keydown', e => {
    if (!(e.metaKey || e.ctrlKey) || e.shiftKey || e.key.toLowerCase() !== 'z') return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return; // 正在打字時，讓瀏覽器自己復原文字
    if (document.querySelector('.modal-overlay.open')) return;
    e.preventDefault(); undoLast();
  });
  function setSyncDot(s) { document.getElementById('sync-dot').className = 'sync-dot '+s; }
  function showToast(msg) {
    const el = document.getElementById('toast'); el.textContent = msg;
    el.classList.add('show'); setTimeout(()=>el.classList.remove('show'), 2200);
  }
  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fmtDate(d) { if(!d)return''; const[y,m,day]=d.split('-'); return `${y}年${+m}月${+day}日`; }
  // 起訖同一年時，結束日期不重複寫年份（手機上才放得進一行）
  function fmtDateShort(d, ref) { if(!d)return''; const[y,m,day]=d.split('-'); return ref && ref.slice(0,4)===y ? `${+m}月${+day}日` : fmtDate(d); }
  // 日均收入：（報價 − 成本）÷ 專案天數（起訖日期含頭尾），在所有算得出來的專案中排名
  const DAILY_GOOD = 3000; // 日均收入達到這個數字才是綠字
  function caseCosts(c) { return parseTasks(c.tasks).filter(t=>t.type==='cost'); }
  function costTotal(c) { return caseCosts(c).reduce((s,t)=>s+(Number(t.amount)||0),0); }
  function caseDays(c) {
    if (!c.start_date || !c.end_date) return 0;
    const d = Math.round((new Date(c.end_date+'T00:00:00') - new Date(c.start_date+'T00:00:00'))/86400000) + 1;
    return d >= 1 ? d : 0;
  }
  // 報價存的是含稅金額；算「實際賺多少」（日均、全年營業額）一律用未稅＝含稅 ÷ 1.05。成本照填的數字，不另外換算
  function netQuote(c) { return Math.round((Number(c.quote_amount) || 0) / (1 + TAX_RATE)); }
  function caseDaily(c) { return (netQuote(c) - costTotal(c)) / caseDays(c); }
  function monthAvgHTML(c) {
    const quote = netQuote(c);
    const cost = costTotal(c);
    const days = caseDays(c);
    const money = n => `${n<0?'-':''}NT$ ${Math.abs(n).toLocaleString()}`;
    const profitLine = cost ? `未稅 ${quote.toLocaleString()} − 成本 ${cost.toLocaleString()} = <span class="${quote-cost<0?'neg':''}">${money(quote-cost)}</span><br>` : '';
    if (!quote) return '<div class="month-avg">填入報價後計算日均收入</div>';
    if (!days) return `<div class="month-avg">${profitLine}設定起訖日期後計算日均收入</div>`;
    const daily = Math.round(caseDaily(c));
    const pool = cases.filter(x => caseDays(x) && Number(x.quote_amount));
    const rank = 1 + pool.filter(x => caseDaily(x) > caseDaily(c)).length;
    const cls = daily >= DAILY_GOOD ? 'pos' : 'neg';
    const rankLine = pool.length < 2 ? '' : `${pool.length} 個專案中第 ${rank} 名`;
    return `<div class="month-avg">${profitLine}共 ${days} 天・${cost?'未稅扣成本後':'未稅'}日均收入<b class="${cls}">${money(daily)}／天</b>${rankLine}</div>`;
  }
  // 舊資料存的是「已收訂金」，一律顯示成「已收頭款」
  function payLabel(v) { return v === '已收訂金' ? '已收頭款' : v; }
  function parseTasks(raw) { try { return JSON.parse(raw||'[]'); } catch { return []; } }
  function caseNumber(c) {
    const p = CAT_PREFIX[c.category]||'P';
    const same = [...cases].filter(x=>x.category===c.category).sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''));
    return p + String(same.findIndex(x=>x.id===c.id)+1).padStart(3,'0');
  }

  // ── Inline dropdown ───────────────────────

  // ── Calendar range picker ─────────────────
  let _cal = null;

  // 只選一天（Deadline、收款日期）：跟日期範圍用同一個日曆，點一下就存，清除也在裡面
  function showSingleDatePicker(anchor, value, onPick) {

  function _calOpen(anchor) {

  function _calRender() {
    if (!_cal) return;
    const { year, month, start, end, picking, hover } = _cal;
    const MN = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    document.getElementById('cal-lbl').textContent = `${year}年${MN[month]}`;
    document.getElementById('cal-hint').textContent = _cal.single ? '點選日期' : picking==='start'?'點選開始日期':'點選結束日期';
    const first = new Date(year, month, 1).getDay();
    const total = new Date(year, month+1, 0).getDate();
    const prev  = new Date(year, month, 0).getDate();
    let html='';
    for (let i=0;i<42;i++) {
      let ds=null, lbl, cls='cal-day';
      if (i<first) { lbl=prev-first+1+i; cls+=' cal-other'; }
      else if (i-first+1>total) { lbl=i-first+1-total; cls+=' cal-other'; }
      else {
        lbl=i-first+1;
        const mm=String(month+1).padStart(2,'0'), dd2=String(lbl).padStart(2,'0');

      html+=`<div class="${cls}"${ds?` data-d="${ds}" onclick="event.stopPropagation();_calClick('${ds}')" onmouseenter="_calHover('${ds}')"`:''}>${lbl}</div>`;

  function _calHover(d) {
    if (!_cal || _cal.picking !== 'end') return;

  function updateCaseName(id, name) {
    name = name.trim(); if (!name) return;
