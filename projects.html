        <td>${r.lag == null ? (r.unpaidDays != null ? `<span class="${r.unpaidDays > 30 ? 'neg' : 'ad-est'}">未收</span>` : '<span class="ad-est">—</span>') : r.lag <= 0 ? '當天' : r.lag + ' 天'}</td>
        <td>${r.grade ? `<span class="ad-g g-${r.grade}" title="${GRADE_TEXT[r.grade]}">${r.grade}</span>` : '<span class="ad-est">—</span>'}</td>

    };
    const groups = byCat.map(g => {
      const list = g.rows.filter(shown); if (!list.length) return '';
      const s = g.s;
      return `<tr class="ad-cat"><td class="l" colspan="11">${esc(g.k)}<small>確定合作 ${s.won} 案・${money(s.wonNet)}${s.grade ? '・評等 ' + s.grade : ''}</small></td></tr>
        ${list.map(caseRow).join('')}
        <tr class="ad-sub"><td class="l" colspan="3">小計（只算確定合作）</td><td>${money(s.wonNet)}</td><td>${money(s.doneCost)}</td><td>${s.margin == null ? '—' : s.margin + '%'}</td><td>${s.avgDaily == null ? '—' : money(s.avgDaily)}</td><td>${s.lag == null ? '—' : s.lag + ' 天'}</td><td colspan="3"></td></tr>`;
    }).join('');
    const caseTable = `<div class="ad-sec"><div class="ad-sec-t">逐案檢討</div>
      <div class="ad-sec-d">評等只給已完成、有收費的案件（看日均、毛利率、收款速度）；灰字是還沒完成的預估值。${forPrint ? '' : '點案件可打開詳細資料，最右邊可以寫檢討備註。'}</div>
      ${chips}
      ${groups ? `<div class="ad-scroll"><table class="ad-table">
        <tr><th class="l">案件</th><th class="l">狀態</th><th>天數</th><th>金額（未稅）</th><th>成本</th><th>毛利率</th><th>日均</th><th>收款</th><th>評等</th><th class="l">檢討重點</th><th class="l">備註</th></tr>
        ${groups}
      </table></div>` : '<div class="ad-empty">這個篩選沒有案件</div>'}</div>`;

    const foot = `<div class="ad-foot">案件依接案日期歸年（沒填就看建立專案那天或開始日期，取比較早的），所以今年接到、明年才執行的案子也算在今年；專案收入則照實際收款日期算。金額都是未稅（報價 ÷ 1.05），成本照填的數字扣。成交＝進行中或已完成、而且有收費；互惠、沒填報價、暫停、接洽中都不算成交。收款天數＝尾款收款日期 − 結束日期。</div>`;
    return hero + metrics + catTable + findHTML + ipHTML + caseTable + foot;
  }

  // ── 發票資訊（存在 tasks 欄位裡的 type:'invoice'）──────
  const INVOICE_FIELDS = { title:'iv-title', header:'iv-header', tax_id:'iv-taxid', total:'iv-total', recipient:'iv-recipient', phone:'iv-phone', address:'iv-address' };
  function caseInvoice(c) { return parseTasks(c.tasks).find(t=>t.type==='invoice') || {}; }
  function pickInvoiceKind(btn) {
    const on = btn.classList.contains('on');
    document.querySelectorAll('#iv-kinds .inv-kind').forEach(b=>b.classList.remove('on'));

  function openInvoiceModal() {
    const c = cases.find(x=>x.id===viewingId); if (!c) return;
    const inv = caseInvoice(c);
    for (const [k,id] of Object.entries(INVOICE_FIELDS)) document.getElementById(id).value = inv[k] || '';
    // 含稅總金額還沒填過，就先放這個專案自己的報價
    const total = Number(inv.total) || Number(c.quote_amount) || 0;
    document.getElementById('iv-total').value = total ? total.toLocaleString() : '';
    document.querySelectorAll('#iv-kinds .inv-kind').forEach(b=>b.classList.toggle('on', b.dataset.v===inv.kind));
    const from = invoiceFromClient(c);
    const hint = document.getElementById('iv-hint');
    hint.style.display = from ? '' : 'none';
    if (from) hint.innerHTML = `<span>${esc(c.client.trim())} 之前填過發票資訊</span><button type="button" onclick="applyClientInvoice()">帶入</button>`;
    document.getElementById('inv-modal').classList.add('open');
  }
  // 同一個客戶在別的專案填過的發票資訊：帶固定不變的欄位，名目還空著也一併帶；含稅總金額不帶（用這個專案自己的報價），取日期最近的那個專案；
  // 跟目前這個專案已存的內容一樣就不提示
  const INVOICE_SHARED = ['header','tax_id','kind','recipient','phone','address'];
  function invoiceFromClient(c) {
    const client = (c.client||'').trim(); if (!client) return null;
    const when = x => x.end_date || x.start_date || (x.created_at||'').slice(0,10);
    const mine = caseInvoice(c);
    const hit = cases.filter(x => x.id !== c.id && (x.client||'').trim() === client)
      .map(x => ({ x, inv: caseInvoice(x) })).filter(o => INVOICE_SHARED.some(k => o.inv[k]))
      .sort((a,b) => when(b.x).localeCompare(when(a.x)))[0];
    return hit && INVOICE_SHARED.some(k => (hit.inv[k]||'') !== (mine[k]||'')) ? hit.inv : null;
  }
  function applyClientInvoice() {
    const c = cases.find(x=>x.id===viewingId); if (!c) return;
    const inv = invoiceFromClient(c); if (!inv) return;
    for (const k of INVOICE_SHARED) if (INVOICE_FIELDS[k]) document.getElementById(INVOICE_FIELDS[k]).value = inv[k] || '';
    document.querySelectorAll('#iv-kinds .inv-kind').forEach(b=>b.classList.toggle('on', b.dataset.v===inv.kind));
    const title = document.getElementById('iv-title');
    if (!title.value.trim() && inv.title) title.value = inv.title; // 名目：這裡還空著才帶上一次的
    document.getElementById('iv-hint').style.display = 'none';
    showToast('已帶入，確認後記得按儲存');
  }
  // 把目前視窗裡填的內容（不必先儲存）組成一段文字複製，方便貼到 LINE 跟客戶確認
  function invoiceText() {
    const v = id => document.getElementById(id).value.trim();

  function closeInvoiceModal() { document.getElementById('inv-modal').classList.remove('open'); }
  function saveInvoiceInfo() {

  function savePanelTitle(el) {

  // 面板內直接編輯客戶／報價：不重畫整個面板，免得點到另一格時游標跑掉
  // 報價：存的是含稅金額，未稅＝含稅 ÷ 1.05。兩個都能改，改哪一個另一個就跟著換算
  const moneyWidth = txt => `calc(${Math.max(txt.length, 4)}ch + 14px)`;
  function quoteText(c, kind) {
    const gross = Number(c.quote_amount) || 0, n = kind === 'net' ? Math.round(gross / (1 + TAX_RATE)) : gross;
    return n ? '$' + n.toLocaleString() : '';

  function saveQuote(kind, input) {

    // 沒改數字就不重算，免得未稅來回換算差 1 元
    if (typed !== shown) savePanelField('quote_amount', { value: String(kind === 'net' ? Math.round(typed * (1 + TAX_RATE)) : typed) });
    for (const k of ['gross','net']) { const el = document.getElementById('q-' + k); if (el) { el.value = quoteText(c, k); el.style.width = moneyWidth(el.value); } }
    // 報價變了，下面的頭款、尾款金額也要跟著更新
    const rec = document.querySelector('#panel-scroll .pay-col input');
    if (rec) { rec.value = receivedText(c); rec.style.width = receivedWidth(c); }
    const dep = document.getElementById('dep-hint'); if (dep) dep.textContent = depositHintHTML(c);
    const hint = document.getElementById('due-hint'); if (hint) { hint.textContent = dueHintHTML(c); hint.style.color = tailColor(c); }
  }
  async function savePanelField(field, input) {
    const c = cases.find(x=>x.id===viewingId); if (!c) return;
    let value = input.value.trim();
    if (field === 'quote_amount') {
      value = Math.round(Number(value.replace(/[^\d.]/g,''))) || 0;
      input.value = value ? '$' + value.toLocaleString() : '';
    }
    if ((c[field] || (field==='quote_amount'?0:'')) === value) return;
    c[field] = value; saveLocal(); renderAll();
    const avg = document.querySelector('#panel-scroll .month-avg'); if (avg) avg.outerHTML = monthAvgHTML(c);
    if (db) { setSyncDot('loading'); try { const{error}=await db.from('cases').update({[field]:value}).eq('id',c.id); setSyncDot(error?'err':'ok'); if(error) showToast('⚠ 雲端同步失敗：'+error.message); } catch(e){setSyncDot('err');} }
  }

  // ── 財務管理：跟專案無關的營運成本（房租、會計、網域…），以及「今年到底留下多少」──
  // 收入來自專案管理（實際入帳、未稅），這裡只往下扣營運成本；算出來的數字不會回頭影響專案管理。
  // 資料一年一份：{ items:[{id,name,amount,cycle}], vat:{'1'..'6': 金額}, acct:{'1'..'6': 請款單明細}, pend:[還沒報的進項發票] }，cycle = month（×12）/ bimonth（×6）/ year / once
  // 存在 Supabase 的 finance 資料表（year 為主鍵）；資料表還沒建立時先存在這台裝置
  let view = 'proj';
  const fin = { loaded: false, cloud: false, years: {}, drafts: {} };
  const FIN_CYCLES = [
    { key:'month',   title:'每月固定支出', times:12, hint:'每個月都要付的。填一個月的金額，會自動乘以 12。' },
    { key:'bimonth', title:'每兩個月（會計）', times:6, hint:'會計每兩個月請款一次的服務費。填一期的金額，會自動乘以 6。' },
    { key:'year',    title:'每年一次', times:1, hint:'一年只付一次的。' },
    { key:'once',    title:'單次支出', times:1, hint:'不固定的雜支。會計請款單上的郵資、發票本記在「會計每期請款」那期就好。' },
  ];
  const FIN_SEED = [
    ['房租', 12800, 'month'], ['勞健保（工會）', 2400, 'month'], ['水電雜費', 1000, 'month'], ['電信費', 599, 'month'], ['iCloud 200G', 90, 'month'], ['Google 雲端 100G', 65, 'month'],
    ['營業稅申報', 2000, 'bimonth'], ['帳務管理', 1500, 'bimonth'],
    ['主機租賃', 2412, 'year'], ['網站域名', 500, 'year'], ['扣繳申報（1 月）', 2000, 'year'], ['營所稅申報（5 月）', 3000, 'year'],
  ];
  const finId = () => 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  function finYear() { return viewYear === 'all' ? String(new Date().getFullYear()) : String(viewYear); }
  // 這一年還沒有資料：沿用最近一個有資料的年度的固定項目（單次支出和營業稅不帶），都沒有就用預設清單。要等你改了才會存
  function finData(y) {
    if (fin.years[y]) return fin.years[y];
    if (fin.drafts[y]) return fin.drafts[y]; // 同一份草稿要重複用，畫面上每一列的編號才對得起來
    const prev = Object.keys(fin.years).filter(k => k < y).sort().pop() || Object.keys(fin.years).sort()[0];
    const items = prev ? fin.years[prev].items.filter(t => t.cycle !== 'once').map(t => ({ ...t, id: finId() }))
                       : FIN_SEED.map(([name, amount, cycle]) => ({ id: finId(), name, amount, cycle }));
    return fin.drafts[y] = { items, vat: {}, draft: prev ? `沿用 ${prev} 年的項目` : '預設項目' };
  }
  // 付給會計的代辦費放在「會計代辦費」一區（不管每兩個月還是每年）。t.who = 'acct' / 'other'；
  // 舊資料沒有 who：原本「每兩個月（會計）」的、或名稱有「申報、帳務、記帳、會計」的算會計
  const finIsAcct = t => t.who ? t.who === 'acct' : t.cycle === 'bimonth' || /申報|帳務|記帳|會計/.test(t.name || '');
  // 滑鼠移到會計代辦費的項目上，顯示這筆是什麼
  const FIN_TIPS = [
    [/營業稅/, '每兩個月幫你向國稅局申報營業稅（401 申報書）：銷項稅 − 進項稅 − 留抵，算出這期要繳多少。單數月請款。'],
    [/帳務|記帳/, '每兩個月幫你整理發票、記帳，是報營業稅和年底報所得稅的基礎。單數月請款。'],
    [/扣繳/, '每年 1 月申報：去年你付錢給個人（攝影師、設計師、個人房東…）時預先扣下的稅，向國稅局回報付了誰多少。'],
    [/營所稅|所得稅/, '每年 5 月幫你算工作室一整年賺多少（收入 − 成本），申報所得稅。這是代辦費，稅金本身另外算。'],
  ];
  const finTip = name => (FIN_TIPS.find(([re]) => re.test(name || '')) || [])[1] || '';
  const FIN_CYC_LABEL = { month:'每月', bimonth:'每兩個月', year:'每年' };
  const finTimes = cycle => (FIN_CYCLES.find(g => g.key === cycle) || {}).times || 1;
  const finNum = v => Number(v) || 0;
  const finMisc = d => Object.values(d.acct || {}).reduce((s, a) => s + finNum(a.misc), 0);
  const finAnnual = d => d.items.reduce((s, t) => s + (Number(t.amount) || 0) * finTimes(t.cycle), 0) + finMisc(d);
  // 會計每期請款：照會計的請款單填 acct[p] = { sales 銷售額, out 銷項稅, inp 進項稅, carry 上期留抵, misc 雜支, bill 請款總額 }
  // 應繳營業稅 = 銷項稅 − 進項稅 − 上期留抵；不夠扣的變成留抵帶到下一期（12 月那期帶到明年 1–2 月）。上期留抵、銷項稅沒填就自動算
  // 那一期沒填明細的話，沿用之前直接填的 vat[p]
  function finAcctCalc(y, depth = 0) {
    const d = fin.years[y] || fin.drafts[y] || {}, py = String(+y - 1);
    let left = depth < 10 && fin.years[py] ? finAcctCalc(py, depth + 1)[5].left : 0;
    return [1, 2, 3, 4, 5, 6].map(p => {
      const a = d.acct?.[p] || {}, has = a.out != null || a.sales != null || a.inp != null;
      const out = a.out != null ? finNum(a.out) : Math.round(finNum(a.sales) * 0.05);
      const r = { p, a, has, out, inp: finNum(a.inp), carryIn: a.carry != null ? finNum(a.carry) : left, misc: finNum(a.misc), bill: a.bill != null ? finNum(a.bill) : null };
      if (has) { const net = r.out - r.inp - r.carryIn; r.tax = Math.max(0, net); left = Math.max(0, -net); }
      else { r.tax = finNum(d.vat?.[p]); if (r.tax) left = 0; }
      r.left = left;
      return r;
    });
  }
  async function loadFinance() {
    if (fin.loaded) return;
    try { const r = localStorage.getItem('boyu_finance'); if (r) fin.years = JSON.parse(r) || {}; } catch (e) {}
    if (!db || !session) { fin.loaded = !db; return; } // 還沒登入：先不算載入完成，登入後再讀雲端
    fin.loaded = true;
    try {
      const { data, error } = await db.from('finance').select('*');
      if (error) return; // 資料表還沒建立：先用這台裝置上的
      fin.cloud = true;
      if (data.length) { fin.years = {}; data.forEach(r => { fin.years[r.year] = r.data; }); }
      else for (const y of Object.keys(fin.years)) await db.from('finance').upsert({ year: y, data: fin.years[y], updated_at: new Date().toISOString() }); // 之前只存在這台裝置的，補傳上去
      localStorage.setItem('boyu_finance', JSON.stringify(fin.years));
    } catch (e) {}
  }
  // 匯出這一年的財務總表（Numbers 或 Excel，失敗改下載 CSV）：上面是淨收入怎麼算出來的，中間是各項營運成本，最下面是代繳營業稅
  function openFinExportMenu(anchor) {
    showInlineDD(anchor, [{value:'numbers',cls:'',label:'Numbers'},{value:'xlsx',cls:'',label:'Excel'}], exportFinance);
  }
  async function exportFinance(kind) {
    await loadFinance();
    const y = finYear(), d = finData(y);
    const ev = cashEvents().filter(e => e.date.startsWith(y));
    const rev = ev.reduce((s, e) => s + e.inc, 0), pcost = ev.reduce((s, e) => s + e.exp, 0), op = finAnnual(d);
    const rows = [[`${y} 年財務總表`], [], ['項目', '', '', '', '金額'],
      ['專案營業額（未稅）', '', '', '', rev], ['專案成本', '', '', '', pcost], ['營運成本（全年）', '', '', '', op], ['淨收入', '', '', '', rev - pcost - op],
      [], ['週期', '名稱', '每次金額', '一年次數', '全年金額']];
    for (const t of d.items.filter(finIsAcct)) rows.push(['會計代辦費', `${t.name || ''}（${FIN_CYC_LABEL[t.cycle] || '單次'}）`, Number(t.amount) || 0, finTimes(t.cycle), (Number(t.amount) || 0) * finTimes(t.cycle)]);
    for (const g of FIN_CYCLES) for (const t of d.items.filter(x => x.cycle === g.key && !finIsAcct(x))) rows.push([g.title, t.name || '', Number(t.amount) || 0, g.times, (Number(t.amount) || 0) * g.times]);
    if (finMisc(d)) rows.push(['會計雜支', '郵資、發票本等', '', '', finMisc(d)]);
    rows.push(['營運成本合計', '', '', '', op], [], ['會計每期請款', '期別', '銷售額', '銷項稅', '進項稅', '上期留抵', '應繳營業稅', '雜支', '請款總額']);
    const ac = finAcctCalc(y);
    for (const r of ac) rows.push(['', `${r.p*2-1}–${r.p*2} 月`, r.a.sales ?? '', r.has ? r.out : '', r.has ? r.inp : '', r.has ? r.carryIn : '', r.tax, r.misc || '', r.bill ?? '']);
    rows.push(['代繳營業稅合計（不算成本）', '', '', '', '', '', ac.reduce((s, r) => s + r.tax, 0)]);

    // 卡片順序配合三欄排法：每月、單次（左欄）｜會計代辦費、每年（中欄）｜會計每期請款（第三欄）｜每月收支（右欄）
    const card = g => {
      const items = d.items.filter(t => t.cycle === g.key && !finIsAcct(t)), sum = items.reduce((s, t) => s + (Number(t.amount) || 0) * g.times, 0);
      return `<div class="rv-sec sec-${g.key}" title="${g.hint}">
        <div class="fin-sec-hd"><div class="bd-title">${g.title}</div><small>全年</small><b data-live>${money(sum)}</b></div>
        <div class="fin-body">${items.map(row).join('')}<button class="fin-add" onclick="finAdd('${g.key}')">＋ 新增</button></div>
      </div>`;
    };
    // 會計代辦費：一年付給會計多少（服務費全年 ＋ 請款單上的雜支，不含代繳營業稅）
    const accItems = d.items.filter(finIsAcct), miscSum = finMisc(d);
    const accSum = accItems.reduce((s, t) => s + finNum(t.amount) * finTimes(t.cycle), 0) + miscSum;
    const accCard = `<div class="rv-sec sec-bimonth" title="付給會計的服務費，括號裡是多久付一次（點一下可以改）。全年合計含請款單上的郵資、發票本，不含代繳營業稅。">
        <div class="fin-sec-hd"><div class="bd-title">會計代辦費</div><small>全年</small><b data-live>${money(accSum)}</b></div>
        <div class="fin-body">${accItems.map(row).join('')}
          ${miscSum ? `<div class="fin-row fin-misc" title="請款單上「其他」那幾項，金額每期不一樣，算營運成本。&#10;・寄信郵資：會計寄申報資料、發票、國稅局文件給你或幫你寄出的郵資（例：28 元 × 3 封）。&#10;・手開發票本：會計幫你買的空白手開發票（三聯式），要手寫開發票給客戶時用。"><span>請款單雜支（郵資、發票本）</span><span class="fin-yearly" data-live>一年 ${money(miscSum)}</span></div>` : ''}
          <button class="fin-add" onclick="finAdd('bimonth','acct')">＋ 新增</button></div>
      </div>`;
    const G = k => FIN_CYCLES.find(g => g.key === k);
    // 會計每期請款：一期一列，點開照請款單填；請款總額會跟「會計服務費 ＋ 雜支 ＋ 營業稅」對帳
    const ac = finAcctCalc(y), vatSum = ac.reduce((s, r) => s + r.tax, 0);
    const svc = d.items.filter(t => t.cycle === 'bimonth' && finIsAcct(t)).reduce((s, t) => s + finNum(t.amount), 0);
    const amt = (p, f, ph = '') => `<input class="prop-input fin-amt" inputmode="numeric" placeholder="${ph}" value="${d.acct?.[p]?.[f] != null ? finNum(d.acct[p][f]).toLocaleString() : ''}" onfocus="this.value=this.value.replace(/,/g,'')" onblur="finAcct('${p}','${f}',this)" ${key()}>`;
    const fld = (p, label, f, ph) => `<div class="fin-row"${f === 'misc' ? ' title="請款單上「其他」那幾項，金額每期不一樣，算營運成本。&#10;・寄信郵資：會計寄申報資料、發票、國稅局文件給你或幫你寄出的郵資（例：28 元 × 3 封）。&#10;・手開發票本：會計幫你買的空白手開發票（三聯式），要手寫開發票給客戶時用。"' : ''}><label>${label}</label>${amt(p, f, ph)}</div>`;
    const accRow = r => {
      const exp = svc + r.misc + r.tax, open = finOpenP === r.p, diff = r.bill == null ? 0 : r.bill - exp;
      const chk = r.bill == null ? '' : diff ? '<span class="acc-bad">≠</span>' : '<span class="acc-ok">✓</span>';
      const sum = `<div class="acc-sum" onclick="finTogglePeriod(${r.p})"><span class="acc-lb">${r.p*2-1}–${r.p*2} 月</span>
          <span class="acc-tx" data-live>${r.has || r.tax ? `營業稅 ${money(r.tax)}` : ''}${r.has && r.left ? ` · 留抵 ${money(r.left)}` : ''}</span>
          <span class="acc-bill" data-live>${r.bill != null ? `${money(r.bill)} ${chk}` : ''}</span><span class="acc-arw">▶</span></div>`;
      if (!open) return `<div class="acc-p">${sum}</div>`;
      const legacy = !r.has && r.tax ? `之前直接填的營業稅 ${money(r.tax)}；填了銷項、進項之後改用明細算。<br>` : '';
      const calc = r.has
        ? `銷項 ${money(r.out)} − 進項 ${money(r.inp)} − 上期留抵 ${money(r.carryIn)}${r.a.carry == null ? '（自動）' : ''}<br>＝ 應繳營業稅 <b>${money(r.tax)}</b>${r.left ? `，留抵 <b>${money(r.left)}</b> 帶到下一期` : ''}<br>`
        : `${legacy}上期留抵 ${money(r.carryIn)}${r.a.carry == null ? '（自動）' : ''}<br>`;
      const bill = `會計費 ${money(svc)} ＋ 雜支 ${money(r.misc)} ＋ 營業稅 ${money(r.tax)} ＝ <b>${money(exp)}</b>`
        + (r.bill == null ? '' : diff ? `<br><span class="acc-bad">≠ 請款單 ${money(r.bill)}，差 ${money(Math.abs(diff))}${diff > 0 ? '（可能含扣繳或營所稅申報費）' : ''}</span>` : ' <span class="acc-ok">✓ 跟請款單一樣</span>');
      return `<div class="acc-p open">${sum}<div class="acc-det">
          <div class="acc-fields">${fld(r.p, '銷售額', 'sales')}${fld(r.p, '銷項稅', 'out', '自動 5%')}${fld(r.p, '進項稅', 'inp')}${fld(r.p, '上期留抵', 'carry', '自動')}${fld(r.p, '雜支', 'misc')}${fld(r.p, '請款總額', 'bill')}</div>
          <div class="acc-calc" data-live>${calc}${bill}</div>
        </div></div>`;
    };
    const pend = d.pend || [], pendSum = pend.reduce((s, t) => s + finNum(t.tax), 0);
    const pendRow = t => `<div class="fin-row" data-pend="${t.id}">
        <input class="prop-input fin-name" placeholder="哪一張發票（例：6 月紙材）" value="${esc(t.name || '').replace(/"/g,'&quot;')}" onblur="finPendEdit('${t.id}','name',this)" ${key()}>
        <input class="prop-input fin-amt" inputmode="numeric" placeholder="稅額" value="${finNum(t.tax) ? finNum(t.tax).toLocaleString() : ''}" onfocus="this.value=this.value.replace(/,/g,'')" onblur="finPendEdit('${t.id}','tax',this)" ${key()}>
        <button class="fin-done" onclick="finPendDel('${t.id}')" title="已經交給會計申報，從清單拿掉">已交</button>
      </div>`;
    const vat = `<div class="rv-sec sec-vat">
        <div class="fin-sec-hd"><div class="bd-title">會計每期請款</div><small>營業稅全年</small><b style="color:#AAA" data-live>${money(vatSum)}</b></div>
        <div class="fin-vat-note">營業稅是代收再轉交國稅局的，<b style="color:#888">不算成本</b>；雜支（郵資、發票本）會算進營運成本。</div>
        <div class="fin-body">${ac.map(accRow).join('')}
          <div class="acc-pend-hd">還沒報的進項發票<small>交給會計前先記在這</small><b data-live>${pendSum ? `可抵 ${money(pendSum)}` : ''}</b></div>
          ${pend.map(pendRow).join('')}<button class="fin-add" onclick="finPendAdd()">＋ 新增</button>
        </div>
      </div>`;
    const banner = (!db || !session) ? '' : fin.cloud ? '' : `<div class="fin-banner">財務資料的雲端資料表還沒建立，目前只存在這台裝置上，換手機或清除瀏覽器資料就看不到了。</div>`;
    const keep = document.activeElement && wrap.contains(document.activeElement) ? null : [...wrap.querySelectorAll('.fin-body')].map(b => b.scrollTop);
    const html = `${banner}
      <div class="fin-panel" data-live><div class="fin-top">
        <div class="fin-hero" title="${d.draft ? `目前顯示的是${d.draft}，改了任何一格之後才會存成 ${y} 年自己的資料。` : '專案營業額 − 專案成本 − 營運成本'}">
          <div class="fin-hero-label">${y} 年淨收入</div>
          <div class="fin-hero-value${net < 0 ? ' neg' : net > 0 ? ' pos' : ''}">${net > 0 ? '+' : ''}${money(net)}</div>
          <div class="fin-hero-sub">${monthly == null ? '&nbsp;' : `平均月薪 ${money(monthly)}`}</div>
        </div>
        ${nowCard}
        <div class="yr-card"><div class="yr-label">專案營業額</div><div class="yr-value c-income">${money(rev)}</div></div>
        <div class="yr-card"><div class="yr-label">− 專案成本</div><div class="yr-value c-expense">${money(pcost)}</div></div>
        <div class="yr-card"><div class="yr-label">− 營運成本（全年）</div><div class="yr-value c-expense">${money(op)}</div></div>
      </div>
</div>
      <div class="fin-grid">${monthsCard}${card(G('month'))}${accCard}${card(G('once'))}${card(G('year'))}${vat}</div>`;
    if (patch && wrap.firstElementChild) {
      const tmp = document.createElement('div'); tmp.innerHTML = html;
      const a = wrap.querySelectorAll('[data-live]'), b = tmp.querySelectorAll('[data-live]');
      if (a.length === b.length) { a.forEach((el, i) => { if (el.innerHTML !== b[i].innerHTML) el.innerHTML = b[i].innerHTML; }); updateFinUndo(); return; }
    }
    wrap.innerHTML = html;
    if (keep) wrap.querySelectorAll('.fin-body').forEach((b, i) => { b.scrollTop = keep[i] || 0; });
    updateFinUndo();
  }

  // ── Render all  }

  // ── Render all ────────────────────────────
  // 首頁排序：名稱開頭的編號由小到大（015-1 排在 015 後面、016 前面）；沒有編號的排最前面，依筆劃
  const strokeOrder = new Intl.Collator('zh-Hant-u-co-stroke');
  function caseNo(c) { const m = (c.name||'').trim().match(/^(\d+)(?:\s*-\s*(\d+))?/); return m ? [+m[1], m[2] ? +m[2] : 0] : null; }
  function byCaseNo(a, b) {
    const x = caseNo(a), y = caseNo(b);
    if (!x || !y) return x ? 1 : y ? -1 : strokeOrder.compare(a.name||'', b.name||'');
    return x[0] - y[0] || x[1] - y[1] || strokeOrder.compare(a.name||'', b.name||'');
  }
  function renderAll() {
    if (view === 'fin') renderFinance();
    if (view === 'ven') renderVendors();
    const q = document.getElementById('search-input').value.trim().toLowerCase();
    let list = q ? cases.filter(c=>(c.name||'').toLowerCase().includes(q)||(c.client||'').toLowerCase().includes(q)) : [...cases];
    const years = [...new Set([String(new Date().getFullYear() + 1), String(new Date().getFullYear()), ...cases.map(caseYear)])].sort((a,b)=>b.localeCompare(a)); // 明年固定列出來，先排案子用
    if (viewYear !== 'all' && !years.includes(viewYear)) years.push(viewYear);
    viewYears = years;
    document.getElementById('year-select').textContent = (viewYear === 'all' ? '全部' : viewYear + '年') + ' ▾';
    list = list.filter(inViewYear).sort(byCaseNo);
    document.getElementById('client-list').innerHTML = [...new Set(cases.map(c=>(c.client||'').trim()).filter(Boolean))].sort().map(n=>`<option value="${esc(n).replace(/"/g,'&quot;')}">`).join('');
    updateBackupWarn();
    let bar = '';
    if (missingOnly) {
      const miss = cases.filter(inViewYear).filter(isMissing);
      list = list.filter(isMissing);
      bar = `<div class="filter-bar"><span>只顯示缺資料的專案：缺日期 ${miss.filter(c=>missingWhat(c).includes('缺日期')).length} 個・缺報價 ${miss.filter(c=>missingWhat(c).includes('缺報價')).length} 個・已收頭款沒填收款日期 ${miss.filter(c=>missingWhat(c).includes('缺頭款收款日期')).length} 個</span><button onclick="missingOnly=false;renderAll()">顯示全部</button></div>`;
    }
    const con = document.getElementById('groups-container');
    if (!cases.length) { con.innerHTML='<div class="empty" style="margin-top:60px">還沒有專案<br><small>點右上角「＋ 新增專案」開始</small></div>'; return; }
    con.innerHTML = bar + STATUS_ORDER.map(s => {
      const grp = list.filter(c=>c.status===s);
      const col = collapsed[s];
      return `<div class="status-group">
        <div class="group-header" onclick="toggleGroup('${s}')">
          <span class="group-arrow${col?' collapsed':''}">▼</span>
          <span class="pill pill-${s}"><span class="pill-dot pill-dot-${s}"></span>${s}</span>
          <span class="group-count">${grp.length}</span>
        </div>
        ${col ? '' : renderGroupBody(s,grp)}
      </div>`;
    }).join('');
  }

  function renderGroupBody(status, group) {
    const rows = group.map(c => {
      const num  = caseNumber(c);
      const date = c.start_date && c.end_date ? `${fmtDate(c.start_date)} → ${fmtDate(c.end_date)}` : fmtDate(c.start_date)||'';
      const pri  = c.priority||'中';
      const sel  = viewingId===c.id ? ' selected' : '';
      return `<div class="table-row${sel}" onclick="openPanel('${c.id}')">
        <div class="td td-name">
          <span class="td-icon">📄</span>
          <span class="td-text">${esc(c.name)}</span>
          ${missingOnly ? missingWhat(c).map(m=>`<span class="miss-tag">${m}</span>`).join('') : ''}
        </div>
        <div class="td">
          <span class="badge b-${status}" onclick="event.stopPropagation();showInlineDD(this,STATUS_DD_ITEMS,v=>updateField('${c.id}','status',v))">
            <span class="b-dot bd-${status}"></span>${status}
          </span>
        </div>
        <div class="td" onclick="event.stopPropagation();showInlineDD(this,invItems('${c.id}'),v=>updateField('${c.id}','invoice',v))" style="cursor:pointer">
          ${c.invoice ? `<span class="badge b-inv-${c.invoice}">${c.invoice}</span>` : '<span style="color:#DDD;font-size:0.8rem">—</span>'}
        </div>
        <div class="td td-date" style="cursor:pointer" onclick="event.stopPropagation();showDateRangePicker(this,'${c.id}')">${date||'<span style="color:#DDD">選擇日期</span>'}</div>
        <div class="td">
          <span class="badge b-pay-${payLabel(c.payment_status)||'未收款'}" onclick="event.stopPropagation();showInlineDD(this,payItems('${c.id}'),v=>updateField('${c.id}','payment_status',v))">${payLabel(c.payment_status)||'未收款'}</span>
        </div>
        <div class="td">
          <span class="badge b-pri-${pri}" onclick="event.stopPropagation();showInlineDD(this,PRIORITY_DD_ITEMS,v=>updateField('${c.id}','priority',v))">${pri}</span>
        </div>
        <div class="td td-note" style="text-align:right;padding-right:12px">${c.quote_amount?('NT$ '+Number(c.quote_amount).toLocaleString()):''}</div>
        <div class="td">
          <span class="badge cat-tag b-cat-${c.category||'其他'}" onclick="event.stopPropagation();showInlineDD(this,CAT_DD_ITEMS,v=>updateField('${c.id}','category',v))">${c.category||'其他'}</span>
        </div>
      </div>`;
    }).join('');

    const total = group.reduce((s,c)=>s+(Number(c.quote_amount)||0),0);

    return `<div class="proj-table">
      <div class="table-head">
        <div class="th">專案名稱</div><div class="th">狀態</div>
        <div class="th">發票</div>
        <div class="th">日期</div><div class="th">付款</div>
        <div class="th">優先級</div><div class="th" style="text-align:right;padding-right:12px;white-space:nowrap">報價（含稅）</div><div class="th">類別</div>
      </div>
      ${rows||'<div class="empty" style="padding:16px 0">此分類無專案</div>'}
      <button class="btn-add-row" onclick="openModalForStatus('${status}')">＋ 新專案</button>
    </div>
    <div class="group-total">Total NT$ ${total.toLocaleString()}</div>`;
  }

  function toggleGroup(s) { collapsed[s]=!collapsed[s]; renderAll(); }

  // ── Panel ─────────────────────────────────
  function openPanel(id) {
    if (viewingId === id) { closePanel(); return; }
    warmQuote(cases.find(x=>x.id===id));
    viewingId = id; renderAll(); renderPanel();
    document.getElementById('app-wrap').classList.add('open');
  }
  function closePanel() {
    viewingId = null;
    const wrap = document.getElementById('app-wrap');
    wrap.classList.remove('open');
    wrap.classList.add('was-open');
    setTimeout(() => {
      wrap.classList.remove('was-open');
      renderAll();
    }, 400);
  }

  function renderPanel() {
    const c = cases.find(x=>x.id===viewingId); if (!c) return;
    const num = caseNumber(c);
    const tasks = parseTasks(c.tasks).filter(t=>!t.type);
    const costs = caseCosts(c);
    const costRows = costs.map((t,i) => `
      <div class="task-row cost">
        <div class="task-name-cell">
          <span class="task-icon-sm">${i+1}</span>
          <input class="task-name-input" placeholder="添加" value="${esc(t.name)}" onblur="updateCost(${i},'name',this.value)" onkeydown="if(event.key==='Enter'&&!event.isComposing)this.blur()">
        </div>
        <div class="cost-st-cell">
          <span class="badge b-cost-${costStatus(c,t)}" onclick="showInlineDD(this,COST_STATUS_ITEMS,v=>updateCost(${i},'status',v))">${costStatus(c,t)}</span>
        </div>
        <div class="cost-amt-cell">
          <input class="task-name-input" inputmode="numeric" placeholder="0" value="${Number(t.amount)?Number(t.amount).toLocaleString():''}" onfocus="this.value=this.value.replace(/,/g,'')" onblur="updateCost(${i},'amount',this.value)" onkeydown="if(event.key==='Enter'&&!event.isComposing)this.blur()">
        </div>
        <div class="cost-date-cell${t.date ? '' : ' empty-d'}" title="${t.date ? fmtDate(t.date) + '，財務算在這個月' : '沒填的話，財務算在尾款或結束日期那個月'}" onclick="showSingleDatePicker(this,'${t.date||''}',v=>updateCost(${i},'date',v||''))">
          <span class="cd-long">${t.date ? fmtDate(t.date) : '選擇日期'}</span><span class="cd-short">${t.date ? `${t.date.slice(0,4) !== String(new Date().getFullYear()) ? t.date.slice(2,4) + '/' : ''}${+t.date.slice(5,7)}/${+t.date.slice(8,10)}` : '日期'}</span>
          <button class="task-del" onclick="event.stopPropagation();deleteCost(${i})">✕</button>
        </div>
      </div>`).join('');

    const taskRows = tasks.map((t,i) => `
      <div class="task-row">
        <div class="task-name-cell">
          <span class="task-icon-sm">${i+1}</span>
          <input class="task-name-input" placeholder="添加" value="${esc(t.name)}" onblur="updateTaskName(${i},this.value)" onkeydown="if(event.key==='Enter'&&!event.isComposing)this.blur()">
        </div>
        <div class="task-st-cell">
          <span class="badge b-task-${t.status}" onclick="showInlineDD(this,TASK_STATUS_ITEMS,v=>setTaskStatus(${i},v))">${t.status}</span>
          <button class="task-del" onclick="deleteTask(${i})">✕</button>
        </div>
        <div class="task-note-cell">
          <input class="task-note-input" value="${esc(t.note||'')}" placeholder="添加" onblur="updateTaskNote(${i},this.value)" onkeydown="if(event.key==='Enter'&&!event.isComposing)this.blur()">
        </div>
        <div class="task-date-cell" onclick="event.stopPropagation();showSingleDatePicker(this,'${t.date||''}',v=>updateTaskDate(${i},v||''))">
          <span class="task-date-text" style="pointer-events:none;flex:1">${t.date ? fmtDate(t.date) : '<span style="color:#DDD">選擇日期</span>'}</span>
          ${t.date?`<button class="gcal-btn" onclick="event.stopPropagation();addTaskToGCal(${i})" title="加入 Google 日曆" style="padding:1px 2px;position:relative;z-index:2"><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><rect x="2" y="3" width="20" height="20" rx="2.5" stroke="#1a73e8" stroke-width="2"/><line x1="2" y1="9" x2="22" y2="9" stroke="#1a73e8" stroke-width="2"/><line x1="8" y1="1" x2="8" y2="5" stroke="#1a73e8" stroke-width="2" stroke-linecap="round"/><line x1="16" y1="1" x2="16" y2="5" stroke="#1a73e8" stroke-width="2" stroke-linecap="round"/></svg></button>`:''}
          <button class="task-del-mob" onclick="event.stopPropagation();deleteTask(${i})">✕</button>
        </div>
      </div>`).join('');

    document.getElementById('panel-scroll').innerHTML = `
      <div class="panel-top">
        <button class="panel-close-btn" onclick="closePanel()">← 收起</button>
        <div style="display:flex;gap:6px"><button class="panel-edit-btn" onclick="openQuoteModal()" title="${caseQuoteFile(c) ? '查看報價單' : '上傳報價單'}">報價單${caseQuoteFile(c) ? '<span class="qt-dot"></span>' : ''}</button><button class="panel-edit-btn" onclick="openInvoiceModal()">✎ 發票資訊</button></div>
      </div>
      <div class="panel-title" contenteditable="true" spellcheck="false" onblur="savePanelTitle(this)" onkeydown="if(event.key==='Enter'&&!event.isComposing){event.preventDefault();this.blur()}">${esc(c.name)}</div>
      <div class="panel-sub">

  // ── Tasks ─────────────────────────────────
  async function syncTasks(c) {
    saveLocal();
    if (!db) return;
    setSyncDot('loading');
    try { const{error}=await db.from('cases').update({tasks:c.tasks}).eq('id',c.id); setSyncDot(error?'err':'ok'); } catch(e){setSyncDot('err');}
  }
  function addTask() {
    const c=cases.find(x=>x.id===viewingId); if(!c)return;
    const t=parseTasks(c.tasks); const at=t.filter(x=>!x.type).length;
    t.splice(at,0,{id:Date.now().toString(),name:'',status:'未開始',note:'',date:''});
    c.tasks=JSON.stringify(t); renderPanel(); syncTasks(c);
  }
  // 成本明細（type:'cost'）、發票資訊（type:'invoice'）跟項目存在同一個 tasks 欄位，永遠排在項目後面
  function writeCosts(c, costs, rerender=true) {
    const all = parseTasks(c.tasks);
    c.tasks = JSON.stringify([...all.filter(x=>!x.type), ...costs, ...all.filter(x=>x.type && x.type!=='cost')]);
    if (rerender) renderPanel();
    syncTasks(c);
  }
  function addCost() {
    const c=cases.find(x=>x.id===viewingId); if(!c)return;
    writeCosts(c, [...caseCosts(c), {id:Date.now().toString(),type:'cost',name:'',amount:0,date:iso(new Date()),status:'未付款'}]); // 支出日期先帶今天
  }
  // 成本付款狀態：沒選過的舊成本，已完成的案子當作已付款，其他當作未付款
  const COST_STATUS_ITEMS = [{header:'付款'},{value:'未付款',cls:'b-cost-未付款',label:'未付款'},{value:'已付款',cls:'b-cost-已付款',label:'已付款'}];
  function costStatus(c, t) { return t.status || (c.status === '已完成' ? '已付款' : '未付款'); }
  function costTotalHTML(c) {
    const unpaid = caseCosts(c).filter(t => costStatus(c, t) === '未付款').reduce((s,t) => s + (Number(t.amount)||0), 0);
    return `<span>合計</span><b>NT$ ${costTotal(c).toLocaleString()}</b>${unpaid ? `<span class="cost-unpaid">未付 NT$ ${unpaid.toLocaleString()}</span>` : '<span></span>'}`;
  }
  function updateCost(idx, field, value) {
    const c=cases.find(x=>x.id===viewingId); if(!c)return;
    const costs=caseCosts(c); if(!costs[idx])return;
    costs[idx][field] = field==='amount' ? (Math.round(Number(String(value).replace(/[^\d.]/g,'')))||0) : value;
    if (field === 'date' || field === 'status') { writeCosts(c, costs); return; }
    // 不整個重畫，免得從「項目」點到「花費」時游標跑掉；只更新金額、合計、日均
    writeCosts(c, costs, false);
    const panel = document.getElementById('panel-scroll');
    const amt = panel.querySelectorAll('.task-row.cost .cost-amt-cell input')[idx];
    if (amt && document.activeElement !== amt) amt.value = Number(costs[idx].amount) ? Number(costs[idx].amount).toLocaleString() : '';
    const tot = panel.querySelector('.cost-total'); if (tot) tot.innerHTML = costTotalHTML(c);
    const avg = panel.querySelector('.month-avg'); if (avg) avg.outerHTML = monthAvgHTML(c);
  }
  function deleteCost(idx) {
    const c=cases.find(x=>x.id===viewingId); if(!c)return;
    const costs=caseCosts(c); costs.splice(idx,1);
    writeCosts(c, costs);
  }
  function updateTaskName(idx,name) {
    const c=cases.find(x=>x.id===viewingId); if(!c)return;
    const t=parseTasks(c.tasks); if(t[idx])t[idx].name=name;
    c.tasks=JSON.stringify(t); syncTasks(c);
  }
  function setTaskStatus(idx,status) {
    const c=cases.find(x=>x.id===viewingId); if(!c)return;
    const t=parseTasks(c.tasks); if(t[idx])t[idx].status=status;
    c.tasks=JSON.stringify(t); renderPanel(); syncTasks(c);
  }
  function updateTaskNote(idx, note) {
    const c=cases.find(x=>x.id===viewingId); if(!c)return;
    const t=parseTasks(c.tasks); if(t[idx])t[idx].note=note;
    c.tasks=JSON.stringify(t); syncTasks(c);
  }
  function deleteTask(idx) {
    const c=cases.find(x=>x.id===viewingId); if(!c)return;
    const t=parseTasks(c.tasks); t.splice(idx,1);
    c.tasks=JSON.stringify(t); renderPanel(); syncTasks(c);
  }
  async function saveProgressNote() {
    const note=document.getElementById('panel-note')?.value||'';
    const c=cases.find(x=>x.id===viewingId); if(!c)return;
    c.progress_note=note; saveLocal(); renderAll(); showToast('備注已儲存 ✓');
    if(db){setSyncDot('loading');try{const{error}=await db.from('cases').update({progress_note:note}).eq('id',viewingId);setSyncDot(error?'err':'ok');}catch(e){setSyncDot('err');}}
  }
  function addDeadlineToGCal(caseId) {
    const c = cases.find(x=>x.id===caseId); if(!c||!c.deadline) return;
    const d = c.deadline.replace(/-/g,'');
    const dNext = gcalNextDay(c.deadline);
    const title = encodeURIComponent((c.name||'專案') + ' — Deadline');
    const details = encodeURIComponent([c.client?`客戶：${c.client}`:'', c.status?`狀態：${c.status}`:''].filter(Boolean).join('\n'));
    window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${d}/${dNext}&details=${details}`, '_blank');
  }

  function showTaskDatePicker(anchor, idx) {
    if (_ddAnchor === anchor) { closeInlineDD(); return; }
    closeInlineDD();
    _ddAnchor = anchor;
    const c = cases.find(x=>x.id===viewingId); if(!c) return;
    const t = parseTasks(c.tasks); const task = t[idx];
    const dd = document.createElement('div');
    dd.className = 'inline-dd date-picker-dd'; dd.id = 'inline-dd';
    dd.innerHTML = `
      <div class="dp-title">📅 項目日期</div>
      <div class="dp-row"><input type="date" id="dp-task-date" value="${task?.date||''}"></div>
      <div class="dp-actions">
        <button class="dp-btn-clear" onclick="updateTaskDate(${idx},'');closeInlineDD()">清除</button>
        <button class="dp-btn-confirm" onclick="updateTaskDate(${idx},document.getElementById('dp-task-date').value);closeInlineDD()">確定</button>
      </div>`;
    positionDD(dd, anchor);
    document.body.appendChild(dd);
    setTimeout(() => document.addEventListener('click', onOutside), 10);
  }

  function updateTaskDate(idx, date) {
    const c = cases.find(x=>x.id===viewingId); if(!c) return;
    const t = parseTasks(c.tasks); if(t[idx]) t[idx].date = date;
    c.tasks = JSON.stringify(t); renderPanel(); syncTasks(c);
  }

  function addTaskToGCal(idx) {
    const c = cases.find(x=>x.id===viewingId); if(!c) return;
    const t = parseTasks(c.tasks); const task = t[idx]; if(!task||!task.date) return;
    const d = task.date.replace(/-/g,'');
    const title = encodeURIComponent((task.name||'項目') + (c.name?` (${c.name})`:''));
    const details = encodeURIComponent(task.note||'');
    window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${d}/${d}&details=${details}`, '_blank');
  }

  function gcalNextDay(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + 1);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}${m}${day}`;
  }

  function addToGoogleCalendar(caseId) {
    const c = cases.find(x=>x.id===caseId); if(!c) return;
    const title = encodeURIComponent(c.name||'專案');
    let dates = '';
    if (c.start_date && c.end_date) {
      dates = c.start_date.replace(/-/g,'') + '/' + gcalNextDay(c.end_date);
    } else if (c.start_date) {
      dates = c.start_date.replace(/-/g,'') + '/' + gcalNextDay(c.start_date);
    } else if (c.deadline) {
      dates = c.deadline.replace(/-/g,'') + '/' + gcalNextDay(c.deadline);
    }
    const parts = [c.client?`客戶：${c.client}`:'', c.status?`狀態：${c.status}`:'', c.note?`備註：${c.note}`:''].filter(Boolean);
    const details = encodeURIComponent(parts.join('\n'));
    window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dates}&details=${details}`, '_blank');
  }

  async function deleteCase(id) {
    if(!confirm('確定刪除這個專案？'))return;
    cases=cases.filter(c=>c.id!==id); saveLocal(); closePanel(); renderAll(); showToast('已刪除');
    if(db){setSyncDot('loading');try{const{error}=await db.from('cases').delete().eq('id',id);setSyncDot(error?'err':'ok');}catch(e){setSyncDot('err');}}
  }

  // ── Modal ─────────────────────────────────
  function openModal(id=null) {
    editingId=id;
    if(id){
      const c=cases.find(x=>x.id===id);
      document.getElementById('modal-ttl').textContent='編輯專案';
      document.getElementById('m-name').value=c.name||'';
      document.getElementById('m-client').value=c.client||'';
      document.getElementById('m-category').value=c.category||'藝術';
      document.getElementById('m-status').value=c.status||'接洽中';
      document.getElementById('m-priority').value=c.priority||'中';
      document.getElementById('m-start').value=c.start_date||'';
      document.getElementById('m-end').value=c.end_date||'';
      document.getElementById('m-deadline').value=c.deadline||'';
      document.getElementById('m-quote').value=c.quote_amount||''; syncQuoteTax('gross');
      document.getElementById('m-pay-status').value=payLabel(c.payment_status)||'未收款';
    } else {
      document.getElementById('modal-ttl').textContent='新增專案';
      ['m-name','m-client'].forEach(x=>document.getElementById(x).value='');
      document.getElementById('m-category').value='藝術';
      document.getElementById('m-status').value='接洽中';
      document.getElementById('m-priority').value='中';
      ['m-start','m-end','m-deadline','m-quote','m-quote-net'].forEach(x=>document.getElementById(x).value='');
      document.getElementById('m-pay-status').value='未收款';
    }
    document.getElementById('modal').classList.add('open');
  }
  function openModalForStatus(s){openModal();document.getElementById('m-status').value=s;}
  function closeModal(){document.getElementById('modal').classList.remove('open');editingId=null;}

  async function saveCase() {
    const name=document.getElementById('m-name').value.trim();
    if(!name){showToast('請輸入專案名稱');return;}
    const data={
      name,client:document.getElementById('m-client').value.trim(),
      category:document.getElementById('m-category').value,
      status:document.getElementById('m-status').value,
      priority:document.getElementById('m-priority').value,
      start_date:document.getElementById('m-start').value,
      end_date:document.getElementById('m-end').value,
      deadline:document.getElementById('m-deadline').value,
      quote_amount:parseFloat(document.getElementById('m-quote').value)||0,
      payment_status:document.getElementById('m-pay-status').value,
    };
    const isNew=!editingId;
    if(isNew){data.contact_name='';data.contact_info='';data.note='';data.id=Date.now().toString();data.created_at=new Date().toISOString();data.progress_note='';data.tasks='[]';cases.unshift(data);}
    else{const i=cases.findIndex(c=>c.id===editingId);if(i!==-1)cases[i]={...cases[i],...data};}
    const savedId=editingId||data.id;
    const savedCase = cases.find(c=>c.id===savedId);
    if (savedCase && !inViewYear(savedCase)) viewYear = caseYear(savedCase);
    saveLocal();renderAll();closeModal();showToast(isNew?'已新增 ✓':'已更新 ✓');
    if(viewingId===savedId)renderPanel();
    if(db){setSyncDot('loading');try{const{error}=isNew?await db.from('cases').insert(data):await db.from('cases').update(data).eq('id',savedId);if(error){setSyncDot('err');showToast('⚠ 雲端同步失敗：'+error.message);}else{setSyncDot('ok');}}catch(e){setSyncDot('err');showToast('⚠ 雲端連線錯誤：'+e.message);}}
  }

  init();

  // ── Swipe-right to close panel (mobile) ───
  (function() {
    const panel = document.getElementById('panel-col');
    let startX = 0, startY = 0, active = false;
    // Listen on document; only activate when panel is open and touch starts from left edge
    document.addEventListener('touchstart', e => {
      const wrap = document.getElementById('app-wrap');
      if (!wrap.classList.contains('open')) return;
      const touch = e.touches[0];
      if (touch.clientX > 44) return;
      startX = touch.clientX;
      startY = touch.clientY;
      active = true;
    }, { passive: true });
    document.addEventListener('touchmove', e => {
      if (!active) return;
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      if (Math.abs(dy) > Math.abs(dx) + 10) { active = false; panel.style.transform = ''; return; }
      panel.style.transition = 'none';
      if (dx > 0) panel.style.transform = `translateX(${dx}px)`;
    }, { passive: true });
    document.addEventListener('touchend', e => {
      if (!active) return;
      active = false;
      panel.style.transition = '';
      const dx = e.changedTouches[0].clientX - startX;
      if (dx > 60) {
        panel.style.transform = '';
        closePanel();
      } else {
        panel.style.transform = '';
      }
    });
  })();
</script>
