<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <!-- 版本六・2026-10-15 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>📁 Boyu 專案管理</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F7F6F3; color: #1A1A1A; min-height: 100vh; }

    /* ── Header ── */
    .app-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 300; height: 52px;
      background: rgba(247,246,243,0.92); backdrop-filter: blur(8px);
      border-bottom: 1px solid #E8E8E4;
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .app-title { font-size: 0.95rem; font-weight: 700; }
    .app-title { display: inline-flex; align-items: center; white-space: nowrap; }
    .view-tab { color: #C8C8C8; cursor: pointer; transition: color 0.15s; padding: 6px 0; }
    .view-tab:hover { color: #999; }
    .view-tab.on { color: #000; cursor: default; }
    .view-sep { display: inline-block; width: 1.5px; height: 0.95em; background: #000; margin: 0 9px; }
    /* 財務管理頁：電腦上一個畫面看完（上面一排總覽，下面三欄卡片，卡片裡項目多了自己捲）；手機照常往下滑 */
    .fin-wrap { display: none; max-width: 1400px; margin: 0 auto; padding: 68px 28px 80px; box-sizing: border-box; }
    body.fin-mode .fin-wrap { display: block; }
    body.fin-mode #app-wrap, body.fin-mode .proj-only, body.fin-mode #undo-btn { display: none !important; }
    body:not(.fin-mode) #fin-undo, body:not(.fin-mode) .fin-only { display: none !important; }
    .fin-panel { background: white; border: 1px solid #E6E5E0; border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
    .fin-top { display: grid; grid-template-columns: 1fr 1fr 1fr 1.05fr 1.3fr; gap: 10px; }
    .fin-top .fin-now { background: #F7F6F3; }
    .fin-top .fin-now .yr-sub { margin-top: 3px; }
    .fin-top .yr-card { background: none; }
    .fin-grid .rv-sec { background: white; }
    /* 每一格輸入的字一律同樣大小、同樣粗細 */
    .fin-row input.prop-input { font-size: 0.83rem !important; font-weight: 400 !important; line-height: 1.4; }
    .fin-hero { background: #1C1C1C; color: white; border-radius: 16px; padding: 16px 20px; }
    .fin-hero-label { font-size: 0.78rem; color: #AAA; }
    .fin-hero-value { font-size: 1.9rem; font-weight: 700; margin: 2px 0 1px; letter-spacing: -0.01em; line-height: 1.15; }
    .fin-hero-value.neg { color: #FF8A80; }
    .fin-hero-value.pos { color: #6FCF73; }
    .fin-hero-sub { font-size: 0.74rem; color: #AAA; }
    .fin-top .yr-card { text-align: left; padding: 16px 18px; border-radius: 16px; display: flex; flex-direction: column; justify-content: center; }
    .fin-top .yr-value { font-size: 1.3rem; }
    .fin-note { font-size: 0.7rem; color: #AAA; line-height: 1.5; margin: 8px 2px 0; }
    .fin-banner { background: #FFF4E5; color: #8A5A00; font-size: 0.76rem; padding: 8px 12px; border-radius: 10px; margin-bottom: 10px; line-height: 1.5; }
    .fin-grid { display: grid; grid-template-columns: 1.12fr 1fr 1fr 1.1fr; gap: 12px; }
    /* 每月收支表 */
    .fm-row { display: grid; grid-template-columns: 38px 1fr 1fr 1fr; align-items: center; gap: 6px; padding: 0 6px; font-size: 0.8rem; border-top: 1px solid #F0F0F0; min-height: 30px; }
    .fm-row > * { text-align: right; white-space: nowrap; }
    .fm-row > :first-child { text-align: left; color: #666; }
    .fm-head { border-top: none; font-size: 0.68rem; color: #AAA; min-height: 22px; }
    .fm-head > :first-child { color: #AAA; }
    .fm-row .fm-op { color: #AAA; }
    .fm-row .fm-zero { color: #CCC; }
    .fm-row b { font-weight: 600; }
    .fm-row.now { background: #F7F6F3; border-radius: 8px; border-top-color: transparent; }
    .fm-row.now > :first-child { color: #000; font-weight: 700; }
    .fm-row.now + .fm-row { border-top-color: transparent; }
    .fm-row.dim { opacity: 0.38; }
    .fin-grid .rv-sec { margin: 0; padding: 14px 16px 10px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    .fin-sec-hd { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; flex-shrink: 0; }
    .fin-sec-hd .bd-title { flex: 1; margin: 0 !important; font-size: 0.98rem !important; white-space: nowrap; }
    .fin-sec-hd small { font-size: 0.68rem; color: #AAA; white-space: nowrap; }
    .fin-sec-hd b { font-size: 0.92rem; font-weight: 700; white-space: nowrap; }
    .fin-body { flex: 1; min-height: 0; overflow-y: auto; margin-right: -8px; padding-right: 8px; }
    .fin-body::-webkit-scrollbar { width: 6px; }
    .fin-body::-webkit-scrollbar-thumb { background: #DDDCD7; border-radius: 3px; }
    .fin-row { display: flex; align-items: center; gap: 6px; border-top: 1px solid #F0F0F0; padding: 2px 0; min-width: 0; }
    .fin-row .fin-name { flex: 1; min-width: 0; }
    .fin-row .fin-amt { width: 62px; flex-shrink: 0; text-align: right; }
    /* 會計代辦費：名稱下面一行淺灰小字寫多久付一次，卡片再窄名稱也不會被擠掉 */
    .fin-nm { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
    .fin-nm .fin-name { flex: none; }
    .fin-sub { display: flex; align-items: center; gap: 6px; margin: -3px 0 3px; font-size: 0.64rem; color: #BBB; white-space: nowrap; }
    .fin-cyc { background: none; border: none; padding: 0 2px; margin: 0 0 0 -2px; font-size: 0.64rem; line-height: 1.3; color: #AAA; font-family: inherit; cursor: pointer; white-space: nowrap; border-radius: 4px; }
    .fin-cyc:hover { color: #1C1C1C; background: #F7F6F3; }
    .fin-misc { color: #888; font-size: 0.78rem; justify-content: space-between; min-height: 30px; }
    .fin-row .fin-yearly { width: 76px; flex-shrink: 0; text-align: right; font-size: 0.68rem; color: #AAA; white-space: nowrap; }
    .fin-x { flex-shrink: 0; background: none; border: none; cursor: pointer; color: #D9534F; font-size: 0.6rem; line-height: 1; padding: 5px 5px; border-radius: 4px; opacity: 0.8; font-family: inherit; }
    .fin-x:hover { opacity: 1; background: #FDECEA; }
    .fin-add { background: none; border: none; color: #BBB; font-size: 0.76rem; font-family: inherit; cursor: pointer; padding: 7px 0 2px; }
    .fin-add:hover { color: #1C1C1C; }
    .fin-vat-note { font-size: 0.68rem; color: #AAA; line-height: 1.45; margin-bottom: 6px; flex-shrink: 0; }
    /* 會計每期請款：每兩個月一列，點開照請款單填 */
    .acc-p { border-top: 1px solid #F0F0F0; }
    .acc-sum { display: flex; align-items: center; gap: 8px; min-height: 30px; cursor: pointer; font-size: 0.8rem; }
    .acc-sum:hover { background: #FAFAF8; }
    .acc-lb { width: 52px; flex-shrink: 0; color: #666; white-space: nowrap; }
    .acc-tx { flex: 1; min-width: 0; color: #888; font-size: 0.74rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .acc-bill { white-space: nowrap; font-weight: 600; }
    .acc-ok { color: #4CAF50; } .acc-bad { color: #D9534F; }
    .acc-arw { color: #CCC; font-size: 0.6rem; transition: transform 0.15s; }
    .acc-p.open .acc-arw { transform: rotate(90deg); }
    .acc-p.open .acc-lb { color: #000; font-weight: 700; }
    .acc-det { background: #F7F6F3; border-radius: 10px; padding: 6px 10px 8px; margin: 0 0 8px; }
    .acc-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .acc-fields .fin-row { border-top: none; border-bottom: 1px solid #E9E8E3; }
    .acc-fields label { font-size: 0.72rem; color: #888; width: 52px; flex-shrink: 0; white-space: nowrap; }
    .acc-fields .fin-amt { flex: 1; width: auto !important; min-width: 0; background: transparent; }
    .acc-calc { font-size: 0.72rem; color: #666; line-height: 1.6; margin-top: 6px; }
    .acc-calc b { color: #1C1C1C; }
    .acc-pend-hd { display: flex; align-items: baseline; gap: 8px; margin: 12px 0 2px; font-size: 0.8rem; font-weight: 600; }
    .acc-pend-hd small { font-weight: 400; font-size: 0.68rem; color: #AAA; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .acc-pend-hd b { font-size: 0.78rem; }
    .fin-done { flex-shrink: 0; background: none; border: 1px solid #E4E4E0; border-radius: 6px; color: #888; font-size: 0.66rem; font-family: inherit; cursor: pointer; padding: 3px 6px; white-space: nowrap; }
    .fin-done:hover { color: #4CAF50; border-color: #4CAF50; }
    @media (min-width: 900px) and (min-height: 600px) {
      .fin-wrap { height: 100vh; padding-bottom: 16px; flex-direction: column; overflow: hidden; }
      body.fin-mode .fin-wrap { display: flex; }
      .fin-panel, .fin-banner { flex-shrink: 0; }
      .fin-grid { flex: 1; min-height: 0; grid-template-rows: 1fr 1fr; }
      .fin-grid .sec-vat, .fin-grid .sec-months { grid-row: 1 / 3; }
      .sec-months .fin-body { display: flex; flex-direction: column; }
      .sec-months .fm-row { flex: 1; max-height: 44px; }
      .sec-months .fm-head { flex: none; }
    }
    /* 電腦：下面左欄每月固定＋單次、中欄每兩個月＋每年、第三欄整欄是會計每期請款。上面一排由左到右是「營業額 − 專案成本 − 營運成本」，本月淨收入、年淨收入放最右邊；下面每月收支也放最右欄。
       手機照原本的順序：年淨收入、本月、每月收支排在最前面 */
    @media (min-width: 900px) {
      .fin-wrap { --rw: clamp(330px, 27.8vw, 440px); }
      .fin-top { grid-template-columns: 1fr 1fr 1fr 1.05fr calc(var(--rw) - 17px); }
      .fin-grid { grid-template-columns: 1.12fr 1fr 1fr var(--rw); }
      .fin-top .fin-hero { grid-column: 5; grid-row: 1; }
      .fin-top .fin-now { grid-column: 4; grid-row: 1; }
      .fin-grid .sec-month { grid-column: 1; grid-row: 1; }
      .fin-grid .sec-once { grid-column: 1; grid-row: 2; }
      .fin-grid .sec-bimonth { grid-column: 2; grid-row: 1; }
      .fin-grid .sec-year { grid-column: 2; grid-row: 2; }
      .fin-grid .sec-vat { grid-column: 3; }
      .fin-grid .sec-months { grid-column: 4; }
    }
    @media (max-width: 899px) {
      .fin-top { grid-template-columns: 1fr 1fr 1fr; }
      .fin-hero, .fin-top .fin-now { grid-column: 1 / -1; text-align: center; align-items: center; } /* 自己佔一整行的兩格：內容置中 */
      .fin-grid { grid-template-columns: 1fr; }
      .fin-body { overflow: visible; }
    }
    @media (max-width: 640px) {
      .fin-wrap { padding: 64px 12px 80px; }
      .fin-hero-value { font-size: 1.7rem; }
      .fin-top { gap: 8px; }
      .fin-top .yr-card { padding: 12px 10px; }
      .fin-top .yr-value { font-size: 0.98rem; }
      .fin-top .yr-label { font-size: 0.66rem; }
      .fin-row .fin-amt { width: 66px; }
      .fin-row .fin-yearly { width: 72px; font-size: 0.64rem; }
      .fin-x { font-size: 0.7rem; padding: 10px 8px; margin: -4px -6px -4px 0; }
    }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #CCC; transition: background 0.3s; }
    .sync-dot.ok { background: #4CAF50; } .sync-dot.err { background: #F44336; }
    .sync-dot.loading { background: #FF9800; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }
    .search-box { padding: 6px 12px; font-size: 0.8rem; border: 1.5px solid #E0E0E0; border-radius: 8px; background: white; width: 150px; font-family: inherit; outline: none; }
    .search-box:focus { border-color: #AAA; }
    /* 標題列的年份、搜尋、按鈕都一樣高（32px） */
    .app-header .search-box { height: 32px; min-height: 32px; max-height: 32px; line-height: 30px; box-sizing: border-box; padding-top: 0; padding-bottom: 0; margin: 0; border-width: 1px; border-color: #E4E4E0; -webkit-appearance: none; appearance: none; }
    .app-header .search-box:focus { border-color: #AAA; }
    .app-header .btn-new, .app-header .btn-year { height: 32px; box-sizing: border-box; padding-top: 0; padding-bottom: 0; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
    .app-header .btn-new { gap: 4px; }
    .btn-new { padding: 6px 14px; background: #1C1C1C; color: white; border: none; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; }
    .btn-new:hover { background: #333; }
    .btn-year { padding: 6px 14px; background: white; color: #1C1C1C; border: 1px solid #E4E4E0; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; }
    .btn-year:hover { background: #F7F6F3; }
    .year-select { flex-shrink: 0; }
    /* 原生下拉選單展開時指定黑體，避免變成明體 */
    option { font-family: 'PingFang TC', 'Heiti TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif !important; }
    .btn-year .cnt { color: #C62828; margin-left: 4px; }
    .btn-more { padding: 6px 10px; letter-spacing: 1px; position: relative; }
    .btn-more.warn::after { content: ''; position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: #E53935; border: 1.5px solid #F7F6F3; }
    .badge.dd-warn { color: #C62828; }
    .lock-hint { font-size: 0.68rem; color: #E67E00; background: #FFF3E0; padding: 2px 8px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
    /* 登入畫面 */
    #login-ov { display: none; position: fixed; inset: 0; z-index: 2000; background: #F7F6F3; align-items: center; justify-content: center; padding: 20px; }
    #login-ov.open { display: flex; }
    .login-card { background: white; border-radius: 18px; padding: 28px 24px; width: 100%; max-width: 340px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .login-ttl { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
    .login-sub { font-size: 0.74rem; color: #999; margin-bottom: 18px; }
    .login-err { font-size: 0.74rem; color: #C62828; min-height: 18px; margin: 2px 0 8px; }
    .login-cancel { display: block; width: 100%; margin-top: 10px; background: none; border: none; color: #999; font-size: 0.76rem; cursor: pointer; font-family: inherit; }
    /* Deadline 提醒 */
    .dl-over { color: #C62828 !important; font-weight: 600; }
    .dl-soon { color: #E67E00 !important; font-weight: 600; }
    .dl-note { font-size: 0.7rem; margin-left: 6px; font-weight: 500; }
    /* 缺資料檢查 */
    .filter-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #FFF8E1; border: 1px solid #FFE9A8; color: #8A6500; font-size: 0.78rem; padding: 9px 14px; border-radius: 10px; margin: 0 12px 16px; }
    .filter-bar button { background: white; border: 1px solid #E8D48A; color: #8A6500; border-radius: 7px; padding: 4px 10px; font-size: 0.74rem; cursor: pointer; font-family: inherit; white-space: nowrap; }
    .miss-tag { font-size: 0.64rem; color: #8A6500; background: #FFF3CD; padding: 1px 6px; border-radius: 8px; flex-shrink: 0; font-weight: 500; }
    /* 月曆檢視 */
    /* 視窗固定高度：切換月份或月／年時不會上下跳動；下方清單太長就在裡面捲動 */
    #cal-modal .modal-sheet { height: 92vh; display: flex; flex-direction: column; }
    @media (min-width: 601px) { #cal-modal .modal-sheet { max-width: 900px; height: min(calc(100vh - 48px), 880px); } }
    #cal-modal .modal-hd { flex-shrink: 0; }
    #cal-month-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #cal-month-wrap > .calv-wd, #cal-month-wrap > .calv-grid { flex-shrink: 0; }
    #cal-list { flex: 1; min-height: 110px; overflow-y: auto; }
    #cal-year-wrap { flex: 1; min-height: 0; overflow-y: auto; }
    .tl-nav { background: none; border: 1px solid #E4E4E0; border-radius: 8px; width: 30px; height: 30px; font-size: 1rem; line-height: 1; cursor: pointer; color: #555; font-family: inherit; }
    .tl-nav:hover { background: #F7F6F3; }
    .calv-wd { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 0.68rem; color: #AAA; text-align: center; margin-bottom: 4px; }
    .calv-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid #EEEDE9; border-left: 1px solid #EEEDE9; border-radius: 8px; overflow: hidden; }
    .calv-cell { border-right: 1px solid #EEEDE9; border-bottom: 1px solid #EEEDE9; height: 96px; overflow: visible; padding: 4px 0 3px; background: white; min-width: 0; }
    .calv-cell.out { background: #FAFAF8; }
    .calv-day { font-size: 0.68rem; color: #999; padding: 0 6px; height: 19px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: flex-start; line-height: 15px; }
    .calv-cell.out .calv-day { color: #D5D5D0; }
    .calv-cell.today .calv-day b { background: #1C1C1C; color: white; border-radius: 10px; padding: 0 6px; font-weight: 600; margin-left: -4px; }
    .calv-bar { height: 17px; margin-bottom: 2px; font-size: 0.64rem; line-height: 17px; padding: 0 5px; white-space: nowrap; overflow: hidden; text-overflow: clip; cursor: pointer; font-weight: 500; }
    .calv-bar.s { border-radius: 4px 0 0 4px; margin-left: 3px; }
    .calv-bar.e { border-radius: 0 4px 4px 0; margin-right: 3px; }
    .calv-bar.s.e { border-radius: 4px; }
    /* 月曆上的色條比標籤深一點才看得清楚；名稱可以延伸到後面幾天 */
    .calv-bar.b-接洽中 { background: #FFE2C2; } .calv-bar.b-進行中 { background: #FAEDB4; }
    .calv-bar.b-暫停 { background: #E3DAFB; }   .calv-bar.b-已完成 { background: #CFEEDA; }
    .calv-bar.lbl:not(.e) { overflow: visible; position: relative; z-index: 1; }
    .calv-bar.gap { background: none !important; cursor: default; }
    .calv-more { font-size: 0.62rem; color: #777; background: #EEEEEC; border-radius: 8px; padding: 0 5px; line-height: 14px; cursor: pointer; font-weight: 600; }
    .calv-more:hover { background: #E0E0DC; color: #1C1C1C; }
    .calv-dl { font-size: 0.62rem; line-height: 14px; height: 14px; color: #C62828; padding: 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    .cal-li { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-bottom: 1px solid #F5F5F2; cursor: pointer; border-radius: 8px; }
    .cal-li:hover { background: #FAFAF8; }
    .cal-li:last-child { border-bottom: none; }
    .cal-li-name { flex: 1; min-width: 0; font-size: 0.82rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cal-li-date { font-size: 0.7rem; color: #999; white-space: nowrap; flex-shrink: 0; }
    .cal-li .badge { font-size: 0.66rem; padding: 2px 8px; cursor: inherit; flex-shrink: 0; }
    @media (max-width: 640px) { .calv-cell { height: 66px; } .calv-bar { font-size: 0.56rem; padding: 0 2px; } .calv-day { padding: 0 3px 3px; } .calv-dl { display: none; } }
    /* 月曆：年檢視（每個專案一列，橫條橫跨 12 個月） */
    .cal-seg { display: inline-flex; background: #F0F0EE; border-radius: 8px; padding: 2px; }
    .cal-seg button { border: none; background: none; padding: 4px 12px; font-size: 0.74rem; border-radius: 6px; cursor: pointer; color: #888; font-family: inherit; }
    .cal-seg button.on { background: white; color: #1C1C1C; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
    .yv { --label: 190px; }
    .yv-row { display: grid; grid-template-columns: var(--label) minmax(0, 1fr); align-items: center; }
    .yv-months, .yv-load, .yv-track { display: flex; position: relative; }
    .yv-months span { font-size: 0.68rem; color: #999; text-align: center; padding: 4px 0; min-width: 0; }
    .yv-months span.now { color: #1C1C1C; font-weight: 700; }
    .yv-load span { font-size: 0.68rem; text-align: center; padding: 5px 0; min-width: 0; border-left: 1px solid white; color: #7A6400; }
    .yv-load span.free { background: #E6F6EC !important; color: #237843 !important; font-weight: 600; text-shadow: none !important; }

    /* ── Layout ── */
    .app-wrap { margin-top: 52px; max-width: 1240px; margin-left: auto; margin-right: auto; padding: 0 28px; }

    /* Desktop: flex + width transition for silky slide */
    @media (min-width: 860px) {
      .app-wrap          { display: flex; align-items: flex-start; }
      .list-col          { flex: 1; min-width: 0; padding: 20px 0 80px; }
      .app-wrap.open .list-col { padding-right: 12px; }
      .panel-col         {
        flex-shrink: 0; width: 0; overflow: hidden;
        transition: width 0.38s cubic-bezier(0.4,0,0.2,1);
      }
      .app-wrap.open .panel-col {
        width: 50%; border-left: 1px solid #EEEDE9;
      }
      .panel-scroll      {
        width: 100%; height: calc(100vh - 52px); overflow-y: auto;
        padding: 28px 36px 60px; background: white;
        position: sticky; top: 52px;
      }

      /* When panel open (or closing): show name / status / 發票 / priority / category */
      .app-wrap.open .table-head,
      .app-wrap.was-open .table-head { grid-template-columns: 1fr 92px 88px 72px 70px; }
      .app-wrap.open .table-row,
      .app-wrap.was-open .table-row  { grid-template-columns: 1fr 92px 88px 72px 70px; }
      .app-wrap.open .th:nth-child(4),
      .app-wrap.open .th:nth-child(5),
      .app-wrap.open .th:nth-child(7),
      .app-wrap.was-open .th:nth-child(4),
      .app-wrap.was-open .th:nth-child(5),
      .app-wrap.was-open .th:nth-child(7)          { display: none; }
      .app-wrap.open .table-row > .td:nth-child(4),
      .app-wrap.open .table-row > .td:nth-child(5),
      .app-wrap.open .table-row > .td:nth-child(7),
      .app-wrap.was-open .table-row > .td:nth-child(4),
      .app-wrap.was-open .table-row > .td:nth-child(5),
      .app-wrap.was-open .table-row > .td:nth-child(7) { display: none; }
    }

    /* Mobile: full-screen slide */
    @media (max-width: 859px) {
      .app-wrap  { display: block; padding: 12px 12px 80px; }
      .panel-col { position: fixed; top: 52px; right: 0; bottom: 0; width: 100%; background: white; z-index: 400; transform: translateX(100%); transition: transform 0.38s cubic-bezier(0.4,0,0.2,1); overflow-y: auto; }
      .app-wrap.open .panel-col { transform: translateX(0); }
      .panel-scroll { padding: 20px 16px 60px; }
      .mob-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.25); z-index: 399; }
      .app-wrap.open .mob-backdrop { display: block; }

<script>
  const SB_URL = 'https://dwbxuhqhxtvsryzzqsgp.supabase.co';
  const SB_KEY = 'sb_publishable_zmCiLOJx3GxYOxda_nYKMQ_DgcR9Srb';

  const STATUS_ORDER  = ['接洽中','進行中','暫停','終止','已完成'];
  const TASK_STATUSES = ['未開始','進行中','已完成'];
  const CAT_PREFIX    = { '藝術':'A','設計':'D','空間':'S','其他':'O' };

  let db, cases = [];
  let editingId = null, viewingId = null;
  let collapsed = {};

  // ── Init ──────────────────────────────────
  // 登入狀態：session 有值＝已登入；dbOpen＝資料庫還沒上鎖（不登入也讀得到）
  let session = null, dbOpen = false, missingOnly = false;
  // 首頁年度：預設今年；'all' 代表全部。專案屬於哪一年看結束日期（沒有就看開始日期，再沒有就看建立日期）；收款日期只影響全年收入的月份
  let viewYear = String(new Date().getFullYear());
  function caseYear(c) { return (c.end_date || c.start_date || c.created_at || '').slice(0,4) || String(new Date().getFullYear()); }
  // 沒填日期的接洽中、暫停案子還沒有結果：從建立那年一路顯示到明年；填了日期就只留在日期那一年
  function carriesOver(c) { return ['接洽中','暫停'].includes(c.status) && !c.start_date && !c.end_date; }
  function inViewYear(c) {
    if (viewYear === 'all' || caseYear(c) === viewYear) return true;
    return carriesOver(c) && caseYear(c) < viewYear && +viewYear <= new Date().getFullYear() + 1;
  }
  let viewYears = [];
  function openYearMenu(anchor) {
    const mark = v => v === viewYear ? '　✓' : '';
    showInlineDD(anchor, [...viewYears.map(y=>({value:y,cls:'',label:y+'年'+mark(y)})), {sep:true}, {value:'all',cls:'',label:'全部'+mark('all')}],
      v => { viewYear = v; missingOnly = false; renderAll(); });
  }
  async function init() {
    try { if (window.supabase) db = window.supabase.createClient(SB_URL, SB_KEY); } catch(e) {}
    if (!db) { startApp(); return; }
    try { session = (await db.auth.getSession()).data.session; } catch(e) {}
    db.auth.onAuthStateChange((event, s) => {
      session = s;
      if (event === 'SIGNED_OUT' && !dbOpen) showLogin();
    });
    if (session) { startApp(); return; }
    // 沒登入：試讀一筆，讀得到代表資料庫還沒上鎖，照舊使用；讀不到就要求登入
    let probe;
    try { probe = await db.from('cases').select('id').limit(1); } catch(e) { probe = { error: e }; }
    if (!probe.error && probe.data && probe.data.length) { dbOpen = true; startApp(); return; }
    if (probe.error && (!navigator.onLine || /fetch|network/i.test(probe.error.message||''))) { startApp(); return; } // 離線：先顯示本機暫存
    showLogin();
  }
  async function startApp() {
    try { const r = localStorage.getItem('boyu_cases'); cases = r ? JSON.parse(r) : []; } catch(e) { cases = []; }
    resetUndo();
    updateLockHint();
    renderAll();
    await loadFromCloud();
  }
  function updateLockHint() { document.getElementById('lock-hint').style.display = (dbOpen && !session) ? '' : 'none'; }
  function showLogin(cancellable=false) {
    document.getElementById('lg-err').textContent = '';
    document.getElementById('lg-pass').value = '';
    document.getElementById('lg-cancel').style.display = cancellable ? '' : 'none';
    document.getElementById('login-ov').classList.add('open');
    setTimeout(() => document.getElementById('lg-email').focus(), 50);
  }
  function hideLogin() { document.getElementById('login-ov').classList.remove('open'); }
  async function doLogin() {
    const email = document.getElementById('lg-email').value.trim(), password = document.getElementById('lg-pass').value;
    const err = document.getElementById('lg-err'), btn = document.getElementById('lg-btn');
    if (!email || !password) { err.textContent = '請輸入 Email 和密碼'; return; }
    btn.disabled = true; btn.textContent = '登入中…'; err.textContent = '';
    let res;
    try { res = await db.auth.signInWithPassword({ email, password }); } catch(e) { res = { error: e }; }
    btn.disabled = false; btn.textContent = '登入';
    if (res.error) { err.textContent = /invalid/i.test(res.error.message||'') ? 'Email 或密碼不對' : '登入失敗：' + (res.error.message||'請再試一次'); return; }
    session = res.data.session;
    hideLogin(); showToast('已登入 ✓');
    startApp();
  }
  async function doLogout() {
    try { await db.auth.signOut(); } catch(e) {}
    session = null; updateLockHint();
    if (dbOpen) { showToast('已登出'); return; }
    // 資料庫已上鎖：登出就清掉這台裝置上的暫存
    try { localStorage.removeItem('boyu_cases'); localStorage.removeItem('boyu_vendors'); } catch(e) {}
    ven.list = []; ven.loaded = false; ven.cloud = false;
    cases = []; viewingId = null; document.getElementById('app-wrap').classList.remove('open');
    renderAll(); showLogin();
  }

  async function loadFromCloud() {
    if (!db) { setSyncDot('err'); return; }
    for (const delay of [0,3000,6000]) {
      if (delay) await new Promise(r => setTimeout(r, delay));
      setSyncDot('loading');
      try {
        const { data, error } = await db.from('cases').select('*').order('created_at',{ascending:false});
        // 沒登入又讀到空的＝資料庫已上鎖，不要用空資料蓋掉畫面，改成要求登入
        if (!error && data && !data.length && !session && !dbOpen) { setSyncDot('err'); showLogin(); return; }
        if (!error && data) { cases = data; resetUndo(); saveLocal(); renderAll(); if (viewingId) renderPanel(); setSyncDot('ok'); return; }
        if (error && delay===6000) showToast('⚠ 讀取失敗：'+error.message);
      } catch(e) { if(delay===6000) showToast('⚠ 連線錯誤：'+e.message); }
      setSyncDot('err');
    }
  }

  // 每次存檔前，把「上一個樣子」留一份，給復原用（最多留 30 步；同一個動作連續觸發的存檔併成一步）。
  // 重新從雲端讀資料時會清空，所以只能復原這次打開頁面之後做的事
  let _snap = null, _lastPush = 0;
  const undoStack = [];
  function saveLocal() {
    const now = JSON.stringify(cases);
    if (_snap !== null && now !== _snap) {
      const t = Date.now();
      if (t - _lastPush > 400) { undoStack.push(_snap); if (undoStack.length > 30) undoStack.shift(); _lastPush = t; }
    }
    _snap = now;
    localStorage.setItem('boyu_cases', now);
    updateUndoBtn();
  }
  function resetUndo() { undoStack.length = 0; _snap = JSON.stringify(cases); updateUndoBtn(); }
  function updateUndoBtn() { const b = document.getElementById('undo-btn'); if (b) b.style.display = undoStack.length ? '' : 'none'; }
  async function undoLast() {
    if (!undoStack.length) { showToast('沒有可以復原的動作'); return; }
    const prev = JSON.parse(undoStack.pop()), cur = cases;
    const prevIds = new Set(prev.map(c=>c.id)), curMap = new Map(cur.map(c=>[c.id,c]));
    // 比對前後差異，雲端只改有變的那幾筆：被改過的改回去、被刪掉的加回來、新增的刪掉
    const ops = [];
    for (const c of prev) { const now = curMap.get(c.id); if (!now) ops.push(['insert', c]); else if (JSON.stringify(now) !== JSON.stringify(c)) ops.push(['update', c]); }
    for (const c of cur) if (!prevIds.has(c.id)) ops.push(['delete', c]);
    cases = prev; _snap = JSON.stringify(cases);
    localStorage.setItem('boyu_cases', _snap);
    closeInlineDD();
    if (viewingId && !prevIds.has(viewingId)) closePanel();
    renderAll(); if (viewingId) renderPanel();
    updateUndoBtn(); showToast('已復原上一步 ✓');
    if (!db) return;
    setSyncDot('loading');
    let failed = false;
    for (const [op, c] of ops) {
      try {
        const { id, ...rest } = c;
        const { error } = await (op === 'insert' ? db.from('cases').insert(c) : op === 'update' ? db.from('cases').update(rest).eq('id', id) : db.from('cases').delete().eq('id', id));
        if (error) failed = true;
      } catch (e) { failed = true; }
    }
    setSyncDot(failed ? 'err' : 'ok');

  // 日均收入：（報價 − 成本）÷ 專案天數（起訖日期含頭尾），在所有算得出來的專案中排名
  const DAILY_GOOD = 3000; // 日均收入達到這個數字才是綠字
  function caseCosts(c) { return parseTasks(c.tasks).filter(t=>t.type==='cost'); }

  function caseDays(c) {
    if (!c.start_date || !c.end_date) return 0;

  function netQuote(c) { return Math.round((Number(c.quote_amount) || 0) / (1 + TAX_RATE)); }
  function caseDaily(c) { return (netQuote(c) - costTotal(c)) / caseDays(c); }
  function monthAvgHTML(c) {
    const quote = netQuote(c);

    const days = caseDays(c);
    const money = n => `${n<0?'-':''}NT$ ${Math.abs(n).toLocaleString()}`;
    const profitLine = cost ? `未稅 ${quote.toLocaleString()} − 成本 ${cost.toLocaleString()} = <span class="${quote-cost<0?'neg':''}">${money(quote-cost)}</span><br>` : '';

    if (!days) return `<div class="month-avg">${profitLine}設定起訖日期後計算日均收入</div>`;
    const daily = Math.round(caseDaily(c));
    const pool = cases.filter(x => caseDays(x) && Number(x.quote_amount));
    const rank = 1 + pool.filter(x => caseDaily(x) > caseDaily(c)).length;
    const cls = daily >= DAILY_GOOD ? 'pos' : 'neg';
    const rankLine = pool.length < 2 ? '' : `${pool.length} 個專案中第 ${rank} 名`;
    return `<div class="month-avg">${profitLine}共 ${days} 天・${cost?'未稅扣成本後':'未稅'}日均收入<b class="${cls}">${money(daily)}／天</b>${rankLine}</div>`;

  async function duplicateCase(id) {
    const src = cases.find(x=>x.id===id); if (!src) return;
    const now = Date.now();

  let calYM = null; // { y, m }，m 從 0 起算

  function calActive(c) { return c.status !== '終止' && c.status !== '已完成'; }
  // 專案在時程上的起點：開始日期 → 沒有就用結束日期 → 再沒有就用 Deadline（只知道交期的接洽中案件也排得上去）
  function calStart(c) { return c.start_date || c.end_date || c.deadline || ''; }
  function calSpans() {
    return cases
      .filter(c => calActive(c) && calStart(c))
      .map(c => { const s = calStart(c), e = [c.end_date, c.start_date ? '' : c.deadline].filter(d => d && d >= s).sort().pop() || s; return { c, s, e }; });
  }
  // 同時進行的專案數：固定 7 階紅色，1 件最淺、7 件以上最深（不隨當年最忙的月份變動）
  const LOAD_COLORS = ['#E8C4C0','#DDA39E','#CF7F7A','#C55F58','#BC403D','#942B3A','#6E2147'];
  // 點「+N」：列出那一天所有進行中的專案（含格子裡放不下的），點一下打開該專案
  function showDayProjects(anchor, ds) {
    const list = calSpans().filter(p => p.s <= ds && p.e >= ds).sort((a,b) => a.s.localeCompare(b.s));
    showInlineDD(anchor, [{ header: `${+ds.slice(5,7)}月${+ds.slice(8,10)}日・${list.length} 個專案` },
      ...list.map(p => ({ value: p.c.id, cls: 'b-' + p.c.status, label: esc(p.c.name) }))], id => calOpenCase(id));
  }
  function renderYearView() {
    const y = calYM.y, today = iso(new Date());
    document.getElementById('cal-title').textContent = `${y}年`;
    const yFrom = `${y}-01-01`, yTo = `${y}-12-31`;
    const dayNo = s => Math.round((new Date(s+'T00:00:00') - new Date(y,0,1)) / 86400000); // 當年第幾天（0 起算）
    const total = dayNo(yTo) + 1;
    const mDays = Array.from({ length: 12 }, (_, i) => new Date(y, i+1, 0).getDate());
    const spans = calSpans().filter(p => p.s <= yTo && p.e >= yFrom).sort((a,b) => a.s.localeCompare(b.s) || a.e.localeCompare(b.e));
    const pad = n => String(n).padStart(2,'0');
    const load = mDays.map((d, i) => spans.filter(p => p.s <= `${y}-${pad(i+1)}-${pad(d)}` && p.e >= `${y}-${pad(i+1)}-01`).length);
    const thisM = today.startsWith(String(y)) ? +today.slice(5,7) - 1 : -1;
    const md = s => `${s.slice(0,4) !== String(y) ? s.slice(0,4) + '/' : ''}${+s.slice(5,7)}/${+s.slice(8,10)}`;
    let acc = 0; const lines = mDays.map(d => { const x = acc / total * 100; acc += d; return x; }).slice(1).map(x => `<i style="left:${x}%"></i>`).join('');
    const todayLine = thisM >= 0 ? `<i class="today" style="left:${(dayNo(today) + 0.5) / total * 100}%"></i>` : '';
    const rows = spans.map(p => {
      const a = Math.max(dayNo(p.s), 0), b = Math.min(dayNo(p.e), total - 1);
      return `<div class="yv-row item" onclick="calOpenCase('${p.c.id}')">
        <div class="yv-name"><div>${esc(p.c.name)}</div><small>${p.s === p.e ? md(p.s) : md(p.s) + ' → ' + md(p.e)}</small></div>
        <div class="yv-track">${lines}${todayLine}<div class="yv-bar calv-bar b-${p.c.status}${p.s < yFrom ? ' cl' : ''}${p.e > yTo ? ' cr' : ''}" style="left:${a/total*100}%;width:${(b-a+1)/total*100}%" title="${esc(p.c.name).replace(/"/g,'&quot;')}"></div></div>
      </div>`;
    }).join('');
    const undated = cases.filter(c => calActive(c) && !calStart(c)).length;
    const free = load.map((n, i) => n === 0 ? `${i+1}月` : '').filter(Boolean);
    document.getElementById('cal-year-wrap').innerHTML = `<div class="yv">
      <div class="yv-row"><div></div><div class="yv-months">${mDays.map((d,i)=>`<span class="${i===thisM?'now':''}" style="flex:${d}">${i+1}月</span>`).join('')}</div></div>
      <div class="yv-row"><div class="yv-head-label">同時進行的專案數</div><div class="yv-load">${load.map((n,i)=>`<span class="${n===0?'free':''}" style="flex:${mDays[i]};background:${LOAD_COLORS[Math.min(n,7)-1]||'none'};color:#FFF;font-weight:600;text-shadow:0 0 2px rgba(110,30,40,0.4)">${n===0?'空':n}</span>`).join('')}</div></div>
      <div class="yv-body">${rows || '<div class="empty" style="padding:16px 0">這一年沒有排專案</div>'}</div>
      <div class="yv-legend">${['進行中','接洽中','暫停'].map(st=>`<span><i class="b-${st}"></i>${st}</span>`).join('')}<span><i style="width:1.5px;height:12px;border-radius:0;background:#E53935"></i>今天</span></div>
      <div class="yr-note" style="margin-top:8px">${spans.length ? (free.length ? `沒有排專案的月份：${free.join('、')}。` : '每個月都有專案在進行。') : ''}${undated ? `另有 ${undated} 個專案沒有填日期，排不進時程。` : ''}</div>
    </div>`;
  }
  function renderCalendar() {
    document.getElementById('cal-seg-month').classList.toggle('on', calMode === 'month');
    document.getElementById('cal-seg-year').classList.toggle('on', calMode === 'year');
    document.getElementById('cal-month-wrap').style.display = calMode === 'month' ? '' : 'none';
    document.getElementById('cal-year-wrap').style.display = calMode === 'year' ? '' : 'none';
    if (calMode === 'year') { renderYearView(); return; }
    const { y, m } = calYM;
    document.getElementById('cal-title').textContent = `${y}年${m+1}月`;
    const first = new Date(y, m, 1), gridStart = new Date(y, m, 1 - first.getDay());
    const weeks = 6; // 固定畫 6 週，切換月份時高度才不會跳
    const days = Array.from({ length: weeks*7 }, (_, i) => new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i));
    const from = iso(days[0]), to = iso(days[days.length-1]), today = iso(new Date());
    // 這個畫面範圍內有重疊的專案
    const spans = calSpans()
      .filter(p => p.s <= to && p.e >= from)
      .sort((a,b) => a.s.localeCompare(b.s) || b.e.localeCompare(a.e));
    // 排車道：一週一週排（同一週內橫條會連起來，換週可以換列），長的專案優先佔上面的列，
    // 這樣前面幾天空出來的位置下一週就能補上，不會整個月都被擠到「+N」裡
    const weekLanes = Array.from({ length: weeks }, (_, w) => {
      const wFrom = iso(days[w*7]), wTo = iso(days[w*7+6]), laneEnd = [], map = new Map();
      spans.filter(p => p.s <= wTo && p.e >= wFrom)
        .sort((a,b) => (a.s < wFrom ? wFrom : a.s).localeCompare(b.s < wFrom ? wFrom : b.s) || b.e.localeCompare(a.e))
        .forEach(p => { const st = p.s < wFrom ? wFrom : p.s; let l = laneEnd.findIndex(e => e < st); if (l === -1) l = laneEnd.length; laneEnd[l] = p.e; map.set(p.c.id, l); });
      return map;
    });
    const MAX = window.innerWidth <= 640 ? 2 : 3;
    const deadlines = cases.filter(c => c.deadline && c.status !== '終止' && c.status !== '已完成');
    document.getElementById('tl-grid').innerHTML = days.map((d, i) => {
      const ds = iso(d), wl = weekLanes[Math.floor(i/7)];
      const act = spans.filter(p => p.s <= ds && p.e >= ds).map(p => ({ ...p, lane: wl.get(p.c.id) }));
      let bars = '';
      // 只畫到這一天實際用到的最後一列，後面不留空列，Deadline 才有位置放
      const lanes = Math.min(MAX, Math.max(-1, ...act.map(p => p.lane)) + 1);
      for (let l = 0; l < lanes; l++) {
        const p = act.find(x => x.lane === l);
        if (!p) { bars += '<div class="calv-bar gap"></div>'; continue; }
        const isS = p.s === ds, isE = p.e === ds, label = isS || d.getDay() === 0 || i === 0;
        bars += `<div class="calv-bar b-${p.c.status}${isS?' s':''}${isE?' e':''}${label?' lbl':''}" title="${esc(p.c.name).replace(/"/g,'&quot;')}" onclick="calOpenCase('${p.c.id}')">${label ? esc(p.c.name) : ''}</div>`;
      }
      const hidden = act.filter(p => p.lane >= MAX).length;
      // 格子高度固定：橫條一列約 19px、Deadline 一行約 14px，放不下的收成「另 N 個」
      // 已經用橫條標在這天的專案（只填了 Deadline 的那種）不再重複列一次
      const dls = deadlines.filter(c => c.deadline === ds && !act.some(p => p.c.id === c.id && p.s === ds && p.e === ds));
      const fit = Math.max(0, Math.floor((78 - lanes * 19) / 14));
      const shown = dls.length > fit ? dls.slice(0, Math.max(fit - 1, 0)) : dls;
      const dl = shown.map(c => `<div class="calv-dl" title="Deadline：${esc(c.name).replace(/"/g,'&quot;')}" onclick="calOpenCase('${c.id}')">⚠ ${esc(c.name)}</div>`).join('')
        + (dls.length > shown.length && fit > 0 ? `<div class="calv-dl" style="cursor:default" title="${dls.slice(shown.length).map(c=>esc(c.name).replace(/"/g,'&quot;')).join('、')}">⚠ 另 ${dls.length - shown.length} 個到期</div>` : '');
      return `<div class="calv-cell${d.getMonth()!==m?' out':''}${ds===today?' today':''}"><div class="calv-day"><b>${d.getDate()}</b>${hidden?`<span class="calv-more" title="看這一天全部的專案" onclick="event.stopPropagation();showDayProjects(this,'${ds}')">+${hidden}</span>`:''}</div>${bars}${dl}</div>`;
    }).join('');
    // 下方清單：這個月有在進行的專案
    const mFrom = iso(new Date(y, m, 1)), mTo = iso(new Date(y, m+1, 0));
    const inMonth = spans.filter(p => p.s <= mTo && p.e >= mFrom);
    const md = s => `${+s.slice(5,7)}/${+s.slice(8,10)}`;
    const undated = cases.filter(c => calActive(c) && !calStart(c)).length;
    document.getElementById('cal-list').innerHTML =
      `<div class="bd-title">這個月的專案（${inMonth.length}）</div>` +
      (inMonth.map(p => `<div class="cal-li" onclick="calOpenCase('${p.c.id}')">
          <span class="badge b-${p.c.status}">${p.c.status}</span>
          <span class="cal-li-name">${esc(p.c.name)}</span>
          <span class="cal-li-date">${p.s === p.e ? md(p.s) : md(p.s) + ' → ' + md(p.e)}</span>
        </div>`).join('') || '<div class="empty" style="padding:12px 0">這個月沒有排專案</div>') +
      (undated ? `<div class="yr-note">另有 ${undated} 個專案沒有填日期，排不進時程。</div>` : '');
  }

  // ── 更多選單 ──────────────────────────────
  function openMoreMenu(anchor) {
    const items = [];
    if (window.innerWidth <= 640) items.push({value:'rc',cls:'',label:"待收付款"},{value:'year',cls:'',label:'專案收入'},{value:'audit',cls:'',label:'年度稽核'},{value:'cal',cls:'',label:'時程'},{sep:true});
    if (view === 'ven') {
      const acts = [{value:'backup',cls:backupOverdue()?'dd-warn':'',label:backupLabel()}];
      if (db && session) acts.push({sep:true},{value:'logout',cls:'',label:'登出'});
      else if (db && dbOpen) acts.push({sep:true},{value:'login',cls:'',label:'登入'});
      showInlineDD(anchor, acts, v => ({ logout: doLogout, login: () => showLogin(true), backup: exportBackup })[v]());
      return;
    }
    if (view === 'fin') {
      const acts = [];
      if (window.innerWidth <= 640) {
        if (finUndoStack.length) acts.push({value:'undo',cls:'',label:'↩ 復原上一步'},{sep:true});
        acts.push({value:'numbers',cls:'',label:'匯出 Numbers'},{value:'xlsx',cls:'',label:'匯出 Excel'},{value:'backup',cls:backupOverdue()?'dd-warn':'',label:backupLabel()});
      }
      if (db && session) acts.push(...(acts.length ? [{sep:true}] : []), {value:'logout',cls:'',label:'登出'});
      else if (db && dbOpen) acts.push(...(acts.length ? [{sep:true}] : []), {value:'login',cls:'',label:'登入'});
      if (!acts.length) { showToast('這一頁沒有其他選項'); return; }
      showInlineDD(anchor, acts, v => ({ undo: finUndo, logout: doLogout, login: () => showLogin(true), backup: exportBackup, numbers: () => exportFinance('numbers'), xlsx: () => exportFinance('xlsx') })[v]());
      return;
    }
    if (window.innerWidth <= 640 && undoStack.length) items.push({value:'undo',cls:'',label:'↩ 復原上一步'},{sep:true});
    items.push({value:'missing',cls:'',label:`缺資料檢查（${cases.filter(inViewYear).filter(isMissing).length}）`},{value:'backup',cls:backupOverdue()?'dd-warn':'',label:backupLabel()});
    if (db && session) items.push({sep:true},{value:'logout',cls:'',label:'登出'});
    else if (db && dbOpen) items.push({sep:true},{value:'login',cls:'',label:'登入'});
    showInlineDD(anchor, items, v => ({
      rc: openReceivables, ap: openPayables, year: openYearModal, audit: openAudit, cal: openCalendar, backup: exportBackup, logout: doLogout,
      login: () => showLogin(true), undo: undoLast,
      missing: () => { missingOnly = true; renderAll(); window.scrollTo(0,0); },
    })[v]());
  }

  // ── 匯出備份：把全部專案（含項目、成本、發票資訊）下載成一個檔案 ──
  async function exportBackup() {
    await loadFinance(); await loadVendors();
    if (!cases.length && !Object.keys(fin.years).length) { showToast('目前沒有資料可以備份'); return; }
    const d = new Date(), pad = n => String(n).padStart(2,'0');
    const stamp = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const blob = new Blob([JSON.stringify({ exported_at: d.toISOString(), count: cases.length, cases, finance: fin.years, vendors: ven.list.filter(v => !v._new) }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `專案管理備份-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    try { localStorage.setItem('boyu_last_backup', String(Date.now())); } catch(e) {}
    updateBackupWarn();
    showToast(`已下載備份（${cases.length} 個專案${Object.keys(fin.years).length ? '＋財務資料' : ''}）✓`);
  }
  // 備份提醒：記在這台裝置上；超過 30 天（或從沒備份過）就在「⋯」上亮紅點
  function backupDays() {
    let t = 0; try { t = Number(localStorage.getItem('boyu_last_backup')) || 0; } catch(e) {}
    return t ? Math.floor((Date.now() - t) / 86400000) : null;
  }
  function backupOverdue() { const d = backupDays(); return cases.length > 0 && (d === null || d > 30); }
  function backupLabel() {
    const d = backupDays();
    return '匯出備份' + (d === null ? '（還沒備份過）' : d === 0 ? '（今天已備份）' : `（上次 ${d} 天前）`);
  }
  function updateBackupWarn() { document.querySelector('.btn-more')?.classList.toggle('warn', backupOverdue()); }

  // ── 缺資料檢查：缺起訖日期、缺報價、已收頭款卻沒填頭款收款日期（終止的不算）──
  function missingWhat(c) {
    if (c.status === '終止') return [];
    const noHeadDate = payLabel(c.payment_status) === '已收頭款' && Number(c.quote_amount) > 0 && !caseDepositDate(c);
    return [!caseDays(c) && '缺日期', !Number(c.quote_amount) && '缺報價', noHeadDate && '缺頭款收款日期'].filter(Boolean);
  }
  function isMissing(c) { return missingWhat(c).length > 0; }

  // ── Deadline 提醒：過期紅、7 天內橘；已完成／終止的不提醒 ──
  function daysFromToday(dateStr) {
    const t = new Date(); t.setHours(0,0,0,0);
    return Math.round((new Date(dateStr+'T00:00:00') - t) / 86400000);
  }
  function deadlineInfo(c) {
    if (!c.deadline || c.status === '已完成' || c.status === '終止') return { cls:'', note:'' };
    const d = daysFromToday(c.deadline);
    if (d < 0)  return { cls:'dl-over', note:`已過期 ${-d} 天` };
    if (d === 0) return { cls:'dl-soon', note:'今天到期' };
    if (d <= 7) return { cls:'dl-soon', note:`剩 ${d} 天` };
    return { cls:'', note:'' };
  }

  // 還沒收的金額：已收頭款的扣掉頭款（頭款固定算報價的一半），其他狀態算整筆報價
  // 有填「已收金額」就用實際數字；沒填的話，已收頭款先以報價的一半估算
  const DEPOSIT_RATE = 0.5;
  function casePayment(c) { return parseTasks(c.tasks).find(t=>t.type==='payment') || {}; }
  // 案件來源、終止原因：跟收款紀錄一樣存在 tasks 裡（type:'meta'），不動資料表
  const metaItems = (header, list) => [{header}, ...list.map(v => ({value:v, cls:'b-meta', label:v})), {sep:true}, {value:'', cls:'', label:'清除'}];
  const SOURCE_DD_ITEMS = metaItems('案件來源', ['舊客回頭','朋友介紹','IG','官網','主動提案','其他']);
  const LOST_DD_ITEMS = metaItems('終止原因', ['預算不合','檔期衝突','客戶沒下文','我推掉','其他']);
  function caseMeta(c) { return parseTasks(c.tasks).find(t=>t.type==='meta') || {}; }
  // 接案日期：確定接下這個案子的那天（存在 meta.got）。沒填就用「建立專案那天」和「開始日期」比較早的那個：
  // 很多舊案是做完才補進系統，接案不可能晚於開工
  function caseCreatedDate(c) {
    const made = c.created_at ? new Date(c.created_at).toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' }) : '';
    const start = c.start_date || c.end_date || '';
    return made && start ? (start < made ? start : made) : made || start;
  }
  function caseGotDate(c) { return caseMeta(c).got || caseCreatedDate(c); }
  // 年度稽核看「哪一年接到的」；專案收入、財務、首頁年份還是看執行和收款日期
  function auditYear(c) { return caseGotDate(c).slice(0,4) || caseYear(c); }
  // 案件備註：自由文字，存在 tasks 裡（type:'memo'）；年度稽核會讀裡面的關鍵字
  function caseMemo(c) { return (parseTasks(c.tasks).find(t=>t.type==='memo') || {}).text || ''; }
  function saveCaseMemo(el) {
    const c = cases.find(x=>x.id===viewingId); if (!c) return;
    const text = el.value.trim(); if (text === caseMemo(c)) return;
    const all = parseTasks(c.tasks).filter(t=>t.type!=='memo');
    c.tasks = JSON.stringify(text ? [...all, { type:'memo', text }] : all);
    syncTasks(c); showToast('備註已儲存 ✓');
  }
  function setMeta(key, value) {
    const c = cases.find(x=>x.id===viewingId); if (!c) return;
    const m = caseMeta(c);
    const meta = { type:'meta', source: m.source || '', lost: m.lost || '', got: m.got || '', full: m.full || '', [key]: value || '' };
    const all = parseTasks(c.tasks).filter(t=>t.type!=='meta');
    c.tasks = JSON.stringify((meta.source || meta.lost || meta.got || meta.full) ? [...all, meta] : all);
    syncTasks(c); renderAll(); renderPanel();
  }
  // 收款方式：預設分兩期（頭款＋尾款）；一次付清的存在 meta.full，只有一筆全款、一個收款日期、一張發票
  function isFull(c) { return caseMeta(c).full === '1'; }
  // 切換收款方式：改成一次付清時，頭款金額清掉、頭款日期搬到全款日期（全款沒填的話），發票、付款跟著換成對應的名稱
  function setPayMode(full) {
    const c = cases.find(x=>x.id===viewingId); if (!c || isFull(c) === full) return;
    if (full) {
      const d1 = caseDepositDate(c);
      c.tasks = paymentTasks(c, { received: 0, date1: '', ...(d1 && !casePaidDate(c) ? { date: d1 } : {}) });
    }
    setMeta('full', full ? '1' : '');
    const patch = {};
    if (full && c.invoice === '尾款已開') patch.invoice = '全款已開';
    if (full && c.invoice === '頭款已開') patch.invoice = '未開';
    if (!full && c.invoice === '全款已開') patch.invoice = '尾款已開';
    if (full && payLabel(c.payment_status) === '已收頭款') patch.payment_status = casePaidDate(c) ? '已結清' : '未收款';
    if (Object.keys(patch).length) {
      Object.assign(c, patch); saveLocal(); renderAll(); renderPanel();
      if (db) { setSyncDot('loading'); db.from('cases').update(patch).eq('id',c.id).then(({error})=>setSyncDot(error?'err':'ok')); }
    }
    showToast(full ? '改成一次付清 ✓' : '改成分兩期 ✓');
  }
  function caseReceived(c) { return isFull(c) ? 0 : Number(casePayment(c).received) || 0; }
  // 收款日期分頭款（date1）和尾款（date）；全年收入的入帳月份、客戶付款速度都看尾款那一天
  function casePaidDate(c) { return casePayment(c).date || ''; }
  function caseDepositDate(c) { return casePayment(c).date1 || ''; }
  function paymentTasks(c, patch) {
    const pay = { type:'payment', received: caseReceived(c), date: casePaidDate(c), date1: caseDepositDate(c), ...patch };
    const all = parseTasks(c.tasks).filter(t=>t.type!=='payment');
    return JSON.stringify((pay.received || pay.date || pay.date1) ? [...all, pay] : all);
  }
  function writePayment(c, patch) {
    c.tasks = paymentTasks(c, patch);
    syncTasks(c); renderAll();
  }

  // 催款訊息：帶入專案名稱（去掉前面的內部編號）與待收金額，複製後貼到 LINE

  // ── 報價單檔案：一個專案放一份 PDF 或圖片，存在 Supabase Storage 的 quotes 空間（要登入才能讀寫）。

  // 照片 2 MB 以內原樣上傳；超過才縮到長邊 3600 以內（A4 掃描 300dpi 的大小）存成高畫質 JPG，放大看字才清楚。PDF 一律原樣上傳
  function shrinkImage(file) {
    if (file.size <= 2 * 1048576) return Promise.resolve(file);
    return new Promise(resolve => {
      const img = new Image(), u = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, 3600 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(u);
        cv.toBlob(b => resolve(b && b.size < file.size ? b : file), 'image/jpeg', 0.92);
      };
      img.onerror = () => { URL.revokeObjectURL(u); resolve(file); };
      img.src = u;
    });
  }
  async function uploadQuoteFile(file) {
    const c = cases.find(x=>x.id===viewingId); if (!c || !file) return;
    const isPdf = file.type === 'application/pdf', isImg = file.type === 'image/jpeg' || file.type === 'image/png';
    if (!isPdf && !isImg) { renderQuoteModal('只能上傳 PDF 或 JPG 檔。'); return; }
    if (file.size > QUOTE_MAX_MB * 1048576 && isPdf) { renderQuoteModal(`檔案超過 ${QUOTE_MAX_MB} MB，請先壓縮再上傳。`); return; }
    document.getElementById('qt-body').innerHTML = `<div class="qt-empty">上傳中…</div>`;
    const blob = isImg ? await shrinkImage(file) : file;
    const mime = isPdf ? 'application/pdf' : (blob === file ? file.type : 'image/jpeg');
    const path = `${c.id}/${Date.now()}.${isPdf ? 'pdf' : mime === 'image/png' ? 'png' : 'jpg'}`;
    const old = caseQuoteFile(c);
    let error;
    try { ({ error } = await db.storage.from(QUOTE_BUCKET).upload(path, blob, { contentType: mime, upsert: false })); } catch (e) { error = e; }
    if (error) {
      const msg = /bucket.*not.*found/i.test(error.message||'') ? '檔案空間還沒建立，請先到 Supabase 執行設定。' : '上傳失敗：' + (error.message || '請確認網路後再試一次');
      renderQuoteModal(msg); return;
    }
    writeQuoteFile(c, { type:'quote', path, name: file.name, mime, size: blob.size, at: new Date().toISOString() });
    if (old && old.path !== path) { quoteCache.delete(old.path); try { await db.storage.from(QUOTE_BUCKET).remove([old.path]); } catch (e) {} }
    showToast('報價單已上傳 ✓');
    renderQuoteModal();
  }
  async function deleteQuoteFile() {
    const c = cases.find(x=>x.id===viewingId), f = c && caseQuoteFile(c); if (!f) return;
    if (!confirm('確定刪除這份報價單？刪掉後救不回來。')) return;
    quoteCache.delete(f.path);
    try { await db.storage.from(QUOTE_BUCKET).remove([f.path]); } catch (e) {}
    writeQuoteFile(c, null);
    showToast('報價單已刪除');
    renderQuoteModal();
  }

  // 切換待收款／待付款時視窗上緣不動：第一次打開（待收款）時記下位置，之後只讓下方伸縮
  function pinMoneySheet() {

  // ── 待付款：成本裡狀態是「未付款」的每一筆（有填支出日期的看日期歸年，沒填的跟著案子的年份）──
  function payables() {
    const out = [];
    cases.forEach(c => caseCosts(c).forEach((t, idx) => {
      if (costStatus(c, t) !== '未付款' || !(Number(t.amount) > 0)) return;
      if (t.date ? (viewYear !== 'all' && !t.date.startsWith(viewYear)) : !inViewYear(c)) return;
      out.push({ c, t, idx, amt: Number(t.amount) });
    }));
    return out.sort((a,b) => (a.t.date || '9999').localeCompare(b.t.date || '9999'));   // 越早花的越上面，沒填日期的放最後
  }
  function openPayables() {

  function markCostPaid(id, idx) {
    const c = cases.find(x => x.id === id); if (!c) return;

  // ── 全年收入 ──────────────────────────────
  // 只計入「已完成」且付款「已結清」的專案；金額算在結束日期那個月（沒有結束日就用開始日），沒有日期的不列入
  function yearEntries() {
    return cases
      .filter(c => c.status === '已完成' && c.payment_status === '已結清')
      .map(c => ({ c, date: casePaidDate(c) || c.end_date || c.start_date || '', inc: netQuote(c), gross: Number(c.quote_amount)||0, exp: costTotal(c) }))
      .filter(e => e.date);
  }
  // 實際入帳（營業額、每月長條圖、客戶頁用這個）：一個專案最多兩筆，頭款算在頭款收款日、尾款算在尾款收款日。
  // ・頭款：付款不是未收款／互惠，而且有填頭款收款日期才算（沒填日期不知道算哪個月，先不計）
  // ・尾款：付款是已結清才算；日期用尾款收款日期，沒填就用結束日期（再沒有用開始日期）。頭款沒有單獨入帳的話，整筆算在這裡
  // ・成本：跟著尾款那一筆；還沒收尾款就算在結束日期那個月（沒有就跟頭款同一天）
  // ・成本有填支出日期就算在那一天（不管案子狀態）；沒填日期的才跟著尾款，或算在結束日期那個月
  // ・互惠、沒報價、未收款、終止的案子沒有收入，但有填成本一樣要扣
  // 金額都換成未稅；專案狀態不影響（還沒結案但錢進來了也算）
  function cashEvents() {
    const out = [];
    for (const c of cases) {
      const gross = Number(c.quote_amount) || 0, pay = payLabel(c.payment_status);
      // 有填支出日期的成本：花錢那天就扣，不管案子結案、收款了沒；沒填日期的（舊資料）照下面原本的規則
      const costs = caseCosts(c), amt = t => Number(t.amount) || 0;
      costs.filter(t => t.date && amt(t)).forEach(t => out.push({ c, part:'成本', date: t.date, gross: 0, inc: 0, exp: amt(t) }));
      const cost = costs.filter(t => !t.date).reduce((s,t) => s + amt(t), 0);
      const costOnly = d => { if (cost && d) out.push({ c, part:'成本', date: d, gross: 0, inc: 0, exp: cost }); };
      if (!gross || pay === '互惠' || pay === '未收款') { costOnly(c.end_date || c.start_date || ''); continue; }
      const settled = pay === '已結清', dep = Math.min(shownReceived(c), gross), headDate = caseDepositDate(c);
      const tailDate = settled ? (casePaidDate(c) || c.end_date || c.start_date || '') : '';
      const head = headDate && dep > 0 && (!settled || dep < gross);
      const headNet = head ? Math.round(dep / (1 + TAX_RATE)) : 0;
      if (head) out.push({ c, part:'頭款', date: headDate, gross: dep, inc: headNet, exp: 0 });
      if (settled && tailDate) out.push({ c, part: head ? '尾款' : '全額', date: tailDate, gross: gross - (head ? dep : 0), inc: netQuote(c) - headNet, exp: cost });
      else costOnly(c.end_date || headDate || c.start_date || '');
    }
    return out;
  }
  function openYearModal() {

    const years = [...new Set([thisYear, new Date().getFullYear(), ...yearEntries().map(e => +e.date.slice(0,4)), ...cashEvents().map(e => +e.date.slice(0,4))])].sort((a,b)=>b-a);
    document.getElementById('yr-year').innerHTML = years.map(y => `<option value="${y}"${y===thisYear?' selected':''}>${y}年</option>`).join('');
    renderYearStats();
    document.getElementById('yr-modal').classList.add('open');

  // 匯出目前選的年份（Numbers 或 Excel）：一個專案一列，最後一列合計
  // 試算表函式庫按下去才載入；載入或產生失敗（例如離線）就改下載 CSV
  const SHEETJS = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/';
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const sc = document.createElement('script');
      sc.src = src; sc.onload = resolve; sc.onerror = () => reject(new Error('load failed: ' + src));
      document.head.appendChild(sc);
    });
  }
  async function loadXLSX(needNumbers) {
    if (!window.XLSX) await loadScript(SHEETJS + 'xlsx.full.min.js');
    if (needNumbers && !window.XLSX_ZAHL_PAYLOAD) await loadScript(SHEETJS + 'xlsx.zahl.js'); // 產生 .numbers 需要的範本
    if (!window.XLSX || (needNumbers && !window.XLSX_ZAHL_PAYLOAD)) throw new Error('XLSX missing');
    return window.XLSX;
  }
  function downloadBlob(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function openYearExportMenu(anchor) {
    showInlineDD(anchor, [{value:'numbers',cls:'',label:'Numbers'},{value:'xlsx',cls:'',label:'Excel'}], exportYear);

  async function exportYear(kind) {
    const year = document.getElementById('yr-year').value;
    const entries = cashEvents().filter(e => e.date.startsWith(year)).sort((a,b) => a.date.localeCompare(b.date));
    if (!entries.length) { showToast(`${year} 年沒有可匯出的入帳紀錄`); return; }
    const rows = [['月份','專案名稱','款項','客戶','類別','入帳日期','含稅金額','營業額（未稅）','成本支出','淨收入']];
    entries.forEach(e => rows.push([+e.date.slice(5,7)+'月', e.c.name, e.part, e.c.client||'', e.c.category||'', e.date, e.gross, e.inc, e.exp, e.inc-e.exp]));
    const inc = entries.reduce((s,e)=>s+e.inc,0), exp = entries.reduce((s,e)=>s+e.exp,0);
    rows.push(['合計','','','','','',entries.reduce((s,e)=>s+e.gross,0),inc,exp,inc-exp]);
    const isNumbers = kind === 'numbers', label = isNumbers ? 'Numbers' : 'Excel';
    showToast(`正在產生 ${label} 檔…`);
    try {
      const XLSX = await loadXLSX(isNumbers);
      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = [{wch:6},{wch:34},{wch:6},{wch:24},{wch:8},{wch:12},{wch:12},{wch:14},{wch:12},{wch:12}];
      for (let r = 1; r < rows.length; r++) for (const col of ['G','H','I','J']) { const cell = ws[col+(r+1)]; if (cell) cell.z = '#,##0'; }
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, `${year}年`);
      const buf = isNumbers
        ? XLSX.write(wb, { bookType:'numbers', type:'array', numbers: window.XLSX_ZAHL_PAYLOAD, compression:true })
        : XLSX.write(wb, { bookType:'xlsx', type:'array' });
      const mime = isNumbers ? 'application/x-iwork-numbers-sffnumbers' : 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
      downloadBlob(new Blob([buf], { type: mime }), `專案收入-${year}.${isNumbers?'numbers':'xlsx'}`);
      showToast(`已下載 ${year} 年 ${label} 檔（${entries.length} 個專案）✓`);
    } catch (e) {
      const cell = v => { const t = String(v ?? ''); return /[",\n]/.test(t) ? '"' + t.replace(/"/g,'""') + '"' : t; };
      downloadBlob(new Blob(['\uFEFF' + rows.map(r => r.map(cell).join(',')).join('\r\n')], { type:'text/csv;charset=utf-8' }), `專案收入-${year}.csv`);
      showToast(`${label} 檔產生失敗，已改下載 CSV`);
    }
  }
  // ── 客戶頁：這個客戶的所有案件（不分年度）、已入帳的營業額、日均、收款速度、最近用過的發票資訊 ──
  function openClient(name) {
    name = (name||'').trim(); if (!name) return;
    const when = c => c.end_date || c.start_date || (c.created_at||'').slice(0,10);
    const list = cases.filter(c => (c.client||'').trim() === name).sort((a,b) => when(b).localeCompare(when(a)));
    const paid = yearEntries().filter(e => (e.c.client||'').trim() === name);
    const inc = cashEvents().filter(e => (e.c.client||'').trim() === name).reduce((s,e)=>s+e.inc,0), d = dailyOf(paid), l = lagOf(paid);
    const due = list.filter(c => (c.status === '已完成' || c.status === '進行中') && Number(c.quote_amount) > 0).reduce((s,c)=>s+amountDue(c),0);
    const inv = (list.map(caseInvoice).find(v => INVOICE_SHARED.some(k => v[k])) || null);
    const money = n => '$' + n.toLocaleString();
    const invRows = inv ? [['抬頭',inv.header],['統編',inv.tax_id],['類型',inv.kind],['收件人',inv.recipient],['電話',inv.phone],['地址',inv.address]].filter(r => r[1]) : [];
    const range = c => c.start_date ? `${+c.start_date.slice(0,4)}/${+c.start_date.slice(5,7)}/${+c.start_date.slice(8,10)}` : '未排日期';
    document.getElementById('cl-title').textContent = name;
    document.getElementById('cl-body').innerHTML = `
      <div class="yr-stats">
        <div class="yr-card"><div class="yr-label">已入帳營業額（未稅）</div><div class="yr-value c-income">${money(inc)}</div></div>
        <div class="yr-card"><div class="yr-label">平均日均收入</div><div class="yr-value ${d ? (d.daily >= DAILY_GOOD ? 'c-income' : 'c-expense') : ''}">${d ? money(d.daily) : '—'}</div></div>
        <div class="yr-card"><div class="yr-label">結案後幾天收款</div><div class="yr-value">${l ? (l.avg > 0 ? l.avg + ' 天' : '當天') : '—'}</div></div>
      </div>
      <div class="bd-sub" style="margin:-4px 0 4px">共 ${list.length} 個案件，其中 ${paid.length} 個已完成並結清${due ? `；目前待收 ${money(due)}` : ''}。${d ? `平均每案做 ${d.avgDays} 天。` : ''}</div>
      ${invRows.length ? `<div class="rv-sec"><div class="bd-title">發票資訊</div><div class="cl-info">${invRows.map(r => `<div><span>${r[0]}</span>${esc(r[1])}</div>`).join('')}</div></div>` : ''}
      <div class="rv-sec"><div class="bd-title">案件（${list.length}）</div>
        ${list.map(c => `<div class="rv-item" onclick="clOpenCase('${c.id}')"><span class="rv-name">${esc(c.name)}</span><small>${c.status}・${payLabel(c.payment_status)||'—'}・${range(c)}</small><b>${Number(c.quote_amount) ? money(Number(c.quote_amount)) : '—'}</b></div>`).join('')}
      </div>`;
    document.getElementById('cl-modal').classList.add('open');
  }
  function closeClient() { document.getElementById('cl-modal').classList.remove('open'); }
  function clOpenCase(id) {
    const c = cases.find(x=>x.id===id); if (!c) return;
    closeClient(); closeYearModal();
    if (!inViewYear(c)) viewYear = caseYear(c);
    if (viewingId !== id) openPanel(id); else renderAll();
  }
  function closeYearModal() { document.getElementById('yr-modal').classList.remove('open'); }
  function yrOpenCase(id) {
    const c = cases.find(x=>x.id===id); if (!c) return;
    closeYearModal();
    if (!inViewYear(c)) viewYear = caseYear(c);
    if (viewingId !== id) openPanel(id); else renderAll();
  }
  // 日均＝淨收入合計 ÷ 天數合計（只算有填起訖日期的）；收款天數＝尾款收款日期 − 結束日期（兩個都有填才算）
  const dailyOf = list => {
    const timed = list.filter(e => caseDays(e.c)), days = timed.reduce((s,e)=>s+caseDays(e.c),0);
    return days ? { daily: Math.round(timed.reduce((s,e)=>s+e.inc-e.exp,0)/days), avgDays: Math.round(days/timed.length) } : null;
  };
  const lagOf = list => {
    const lags = list.filter(e => casePaidDate(e.c) && e.c.end_date).map(e => Math.round((new Date(casePaidDate(e.c)+'T00:00:00') - new Date(e.c.end_date+'T00:00:00'))/86400000));
    return lags.length ? { n: lags.length, avg: Math.round(lags.reduce((s,d)=>s+d,0)/lags.length) } : null;
  };
  function renderYearStats() {
    const year = document.getElementById('yr-year').value;
    // events：實際入帳（算營業額）；entries：已完成且已結清的專案（算日均、結案件數）
    const events = cashEvents().filter(e => e.date.startsWith(year));
    const entries = yearEntries().filter(e => e.date.startsWith(year));
    const months = Array.from({length:12}, (_,i) => {
      const k = `${year}-${String(i+1).padStart(2,'0')}`;
      const mE = events.filter(e => e.date.startsWith(k));
      const inc = mE.reduce((s,e)=>s+e.inc,0), exp = mE.reduce((s,e)=>s+e.exp,0);
      return { m:i+1, inc, exp, bal:inc-exp };
    });
    const inc = months.reduce((s,m)=>s+m.inc,0), exp = months.reduce((s,m)=>s+m.exp,0), bal = inc-exp;
    const money = n => (n<0?'-':'') + '$' + Math.abs(n).toLocaleString();
    document.getElementById('yr-income').textContent = money(inc);
    const gross = events.reduce((s,e)=>s+e.gross,0);
    document.getElementById('yr-gross').textContent = gross ? `含稅 ${money(gross)}` : '';
    document.getElementById('yr-expense').textContent = money(exp);
    const bEl = document.getElementById('yr-balance');
    bEl.textContent = money(bal);
    bEl.className = 'yr-value' + (bal>0?' c-income':bal<0?' c-expense':'');
    // 平均月薪＝淨收入 ÷ 月數：今年除以目前過了幾個月（10 月就除以 10），過去的年份除以 12
    const nowD = new Date(), monthsSoFar = +year < nowD.getFullYear() ? 12 : +year === nowD.getFullYear() ? nowD.getMonth() + 1 : 0;
    document.getElementById('yr-monthly').textContent = monthsSoFar && bal ? `平均月薪 ${money(Math.round(bal / monthsSoFar))}` : '';
    const maxV = Math.max(...months.map(m=>Math.max(m.inc,m.exp)), 1);
    document.getElementById('yr-chart').innerHTML =
      `<div class="mc-legend">
        <div class="mc-legend-item"><div class="mc-dot" style="background:#4CAF50"></div>營業額</div>
        <div class="mc-legend-item"><div class="mc-dot" style="background:#EF5350"></div>成本支出</div>
        <div class="mc-legend-item"><div class="mc-dot" style="background:#BBB"></div>淨收入</div>
      </div>` +
      months.map(m => {
        const dim = m.inc===0 && m.exp===0;
        const iW = Math.round(m.inc/maxV*100), eW = Math.round(m.exp/maxV*100);
        const balCol = m.bal>0?'#2E7D32':m.bal<0?'#C62828':'#BBB';
        return `<div class="mc-row${dim?' mc-dim':''}">
          <div class="mc-label">${m.m}月</div>
          <div class="mc-bars">
            <div class="mc-bar-wrap"><div class="mc-bar mc-bar-income" style="width:${iW}%"></div></div>
            <div class="mc-bar-wrap"><div class="mc-bar mc-bar-expense" style="width:${eW}%"></div></div>
          </div>
          <div class="mc-amounts">
            <span class="c-income" style="font-size:0.62rem;opacity:0.75">${m.inc>0?'$'+m.inc.toLocaleString():'—'}</span>
            <span class="c-expense" style="font-size:0.62rem;opacity:0.75">${m.exp>0?'$'+m.exp.toLocaleString():'—'}</span>
            <span style="color:${balCol};font-size:0.88rem;font-weight:700;margin-top:1px">${dim?'—':(m.bal>0?'+':'')+money(m.bal)}</span>
          </div>
        </div>`;
      }).join('');
    // ── 年度復盤 ──
    // 日均一律用「淨收入合計 ÷ 天數合計」，只算有填起訖日期的專案；收款天數＝收款日期 − 結束日期，只算兩個都有填的
    const dailyHTML = d => `<b class="${d >= DAILY_GOOD ? 'c-income' : 'c-expense'}">${money(d)}</b>`;
    const lagText = l => l.avg > 0 ? `結案後平均 ${l.avg} 天收款` : '結案當天或之前就收款';

    // 1. 跟去年比
    const prevYear = String(+year - 1);
    const prevEntries = yearEntries().filter(e => e.date.startsWith(prevYear)), prevEvents = cashEvents().filter(e => e.date.startsWith(prevYear));
    const sum = (ev, list) => { const i = ev.reduce((s,e)=>s+e.inc,0); return { n: list.length, inc: i, net: i - ev.reduce((s,e)=>s+e.exp,0), per: list.length ? Math.round(list.reduce((s,e)=>s+e.inc,0)/list.length) : null, daily: (dailyOf(list)||{}).daily }; };
    const cur = sum(events, entries), prev = sum(prevEvents, prevEntries), hasPrev = prevEvents.length > 0 || prev.n > 0;
    const diff = (a, b, isCount) => {
      if (!hasPrev || a == null || b == null) return '—';
      if (a === b) return '持平';
      const up = a > b, txt = isCount ? Math.abs(a-b) + ' 案' : (b ? Math.round(Math.abs(a-b)/Math.abs(b)*100) + '%' : '');
      return `<span class="${up?'c-income':'c-expense'}">${up?'▲':'▼'} ${txt}</span>`;
    };
    const cmpRow = (label, a, b, isCount, cls = '') => `<tr><td>${label}</td><td class="rv-prev">${!hasPrev || b == null ? '—' : isCount ? b + ' 案' : money(b)}</td><td class="${cls}">${a == null ? '—' : isCount ? a + ' 案' : money(a)}</td><td class="rv-diff">${diff(a, b, isCount)}</td></tr>`;
    const compareHTML = !events.length && !entries.length && !hasPrev ? '' :
      `<div class="bd-title">跟去年比</div>
      <table class="rv-table"><tr><th></th><th>${prevYear} 年</th><th class="rv-cur">${year} 年</th><th>變化</th></tr>
        ${cmpRow('營業額', cur.inc, prev.inc)}${cmpRow('淨收入', cur.net, prev.net, false, cur.net < 0 ? 'c-expense' : 'c-income')}${cmpRow('結案件數', cur.n, prev.n, true)}${cmpRow('平均每案金額', cur.per, prev.per)}${cmpRow('平均日均收入', cur.daily, prev.daily)}
      </table>` + (hasPrev ? '' : `<div class="bd-sub" style="margin-top:8px">${prevYear} 年沒有入帳紀錄，暫時沒得比。</div>`);

    // 2. 類別／客戶／來源：各自的營業額、佔比、專案數，下方小字是日均與平均天數（客戶多一項收款速度）
    const group = keyOf => {
      const map = new Map();
      const get = c => { const k = keyOf(c); if (!map.has(k)) map.set(k, { k, inc:0, ids:new Set(), list:[] }); return map.get(k); };
      events.forEach(e => { if (!e.inc) return; const g = get(e.c); g.inc += e.inc; g.ids.add(e.c.id); });   // 營業額：實際入帳（只有成本、沒有收入的不列）
      entries.forEach(e => { const g = get(e.c); g.list.push(e); g.ids.add(e.c.id); });  // 日均、收款速度：已結案的
      return [...map.values()].map(g => ({ ...g, n: g.ids.size })).sort((a,b) => b.inc - a.inc);
    };
    const section = (title, rows, withLag, lead = '') => {
      if (!rows.length) return '';
      const top = Math.max(...rows.map(r=>r.inc), 1);
      return `<div class="bd-title">${title}</div>${lead}` + rows.map(r => {
        const d = dailyOf(r.list), l = withLag && lagOf(r.list);
        const sub = [d && `日均 ${dailyHTML(d.daily)}`, d && `平均 ${d.avgDays} 天`, l && lagText(l)].filter(Boolean).join('・');
        // 只有頭款入帳、還沒有結案的專案：寫明原因，不要留空（不然看起來像跟下一列共用同一行小字）
        const none = !r.list.length ? '未結案' : !d ? '沒填起訖日期，算不出日均' : '';
        const link = withLag && r.k !== '未填客戶' ? ` clickable" data-client="${esc(r.k).replace(/"/g,'&quot;')}" onclick="openClient(this.dataset.client)` : '';
        return `<div class="bd-row${link}">
          <div class="bd-label" title="${esc(r.k).replace(/"/g,'&quot;')}"><span>${esc(r.k)}</span><small>${r.n} 案</small></div>
          <div class="bd-bar-wrap"><div class="mc-bar mc-bar-income" style="width:${Math.round(r.inc/top*100)}%"></div></div>
          <div class="bd-amt">$${r.inc.toLocaleString()}<small>${inc ? Math.round(r.inc/inc*100) : 0}%</small></div>
        </div><div class="bd-sub">${sub || none}</div>`;
      }).join('');
    };
    const byCat = group(c => c.category || '其他');
    const byClient = group(c => (c.client||'').trim() || '未填客戶');
    const bySource = group(c => caseMeta(c).source || '未填來源');
    const allLag = lagOf(entries);
    const lagLead = `<div class="bd-sub rv-lead">${allLag ? `有填尾款收款日期的 ${allLag.n} 案，${lagText(allLag)}。` : '專案填了尾款的收款日期後，這裡會算出每個客戶結案後幾天付款。'}</div>`;

    // 2-1. 案件支出：把這一年扣掉的成本拆回一筆一筆，同名稱的合併（例如不同案子的「攝影師」），由多到少排名
    // 有填支出日期的看日期；沒填的跟著案子的成本事件走（cashEvents 已經決定好算在哪個月）
    const costItems = [];
    new Set(events.filter(e => e.exp).map(e => e.c)).forEach(c => {
      const list = caseCosts(c).filter(t => Number(t.amount) > 0);
      const dated = list.filter(t => t.date && t.date.startsWith(year));
      const undatedExp = events.filter(e => e.c === c).reduce((s2,e) => s2 + e.exp, 0) - dated.reduce((s2,t) => s2 + Number(t.amount), 0);
      dated.concat(undatedExp > 0 ? list.filter(t => !t.date) : []).forEach(t => costItems.push({ c, t, amt: Number(t.amount) }));
    });
    const byItem = new Map();
    costItems.forEach(x => { const k = (x.t.name || '').trim() || '未命名'; if (!byItem.has(k)) byItem.set(k, { k, amt:0, list:[] }); const g = byItem.get(k); g.amt += x.amt; g.list.push(x); });
    const itemRows = [...byItem.values()].sort((a,b) => b.amt - a.amt);
    const unpaidCost = costItems.filter(x => costStatus(x.c, x.t) === '未付款').reduce((s2,x) => s2 + x.amt, 0);
    const shortName = n => n.replace(/^[\d-]+\s*/, '');
    const costHTML = !itemRows.length ? '' :
      `<div class="bd-title">案件支出</div>
      <div class="bd-sub rv-lead">${costItems.length} 筆、共 <b style="color:#444">${money(exp)}</b>${inc ? `，佔營業額 ${Math.round(exp/inc*100)}%` : ''}${unpaidCost ? `・<span class="c-expense">還沒付 ${money(unpaidCost)}</span>` : ''}</div>` +
      itemRows.map((g, i) => `<div class="bd-row${g.list.length === 1 ? ` clickable" onclick="yrOpenCase('${g.list[0].c.id}')` : ''}">
          <div class="bd-label" title="${esc(g.k).replace(/"/g,'&quot;')}"><span>${i+1}. ${esc(g.k)}</span><small>${g.list.length} 筆</small></div>
          <div class="bd-bar-wrap"><div class="mc-bar mc-bar-expense" style="width:${Math.round(g.amt/itemRows[0].amt*100)}%"></div></div>
          <div class="bd-amt" style="color:#C62828">$${g.amt.toLocaleString()}<small>${exp ? Math.round(g.amt/exp*100) : 0}%</small></div>
        </div><div class="bd-sub">${g.list.sort((a,b) => b.amt - a.amt).map(x => `${esc(shortName(x.c.name))}${g.list.length > 1 ? ` $${x.amt.toLocaleString()}` : ''}${costStatus(x.c, x.t) === '未付款' ? '<span class="c-expense">（未付）</span>' : ''}`).join('・')}</div>`).join('');

    // 3. 日均沒達標的案件
    const low = entries.filter(e => caseDays(e.c)).map(e => ({ e, d: Math.round((e.inc-e.exp)/caseDays(e.c)) })).filter(x => x.d < DAILY_GOOD).sort((a,b) => a.d - b.d);
    const lowHTML = !entries.some(e => caseDays(e.c)) ? '' :
      `<div class="bd-title">日均低於 $${DAILY_GOOD.toLocaleString()} 的案件（${low.length}）</div>` +
      (low.length ? low.map(x => `<div class="rv-item" onclick="yrOpenCase('${x.e.c.id}')"><span class="rv-name">${esc(x.e.c.name)}</span><small>${esc((x.e.c.category||'其他'))}・${caseDays(x.e.c)} 天</small><b class="c-expense">${money(x.d)}</b></div>`).join('')
                  : `<div class="bd-sub rv-lead">這一年每個案件的日均都有達到 $${DAILY_GOOD.toLocaleString()}。</div>`);

    // 4. 接洽結果：這一年的專案（不限已結清）。成交＝進行中或已完成、而且有收費（互惠、沒報價的不算，暫停的也不列入）；終止的依原因統計
    const yCases = cases.filter(c => caseYear(c) === year);
    const charged = c => (Number(c.quote_amount)||0) > 0 && c.payment_status !== '互惠';
    const won = yCases.filter(c => ['進行中','已完成'].includes(c.status) && charged(c)).length;
    const lost = yCases.filter(c => c.status === '終止'), open = yCases.filter(c => c.status === '接洽中').length;
    const reasons = new Map(); lost.forEach(c => { const k = caseMeta(c).lost || '未填原因'; reasons.set(k, (reasons.get(k)||0) + 1); });
    const reasonRows = [...reasons].sort((a,b) => b[1]-a[1]);
    const dealHTML = !(won + lost.length) ? '' :
      `<div class="bd-title">接洽結果</div>
      <div class="bd-sub rv-lead">成交 ${won} 案・終止 ${lost.length} 案${open ? `・還在談 ${open} 案` : ''}，成交率 <b style="color:#444">${Math.round(won/(won+lost.length)*100)}%</b><br>成交只算進行中或已完成、而且有收費的案件；互惠、沒填報價、暫停的不列入。</div>` +
      reasonRows.map(([k,n]) => `<div class="bd-row">
          <div class="bd-label"><span>${esc(k)}</span></div>
          <div class="bd-bar-wrap"><div class="mc-bar" style="width:${Math.round(n/reasonRows[0][1]*100)}%;background:#BBB"></div></div>
          <div class="bd-count">${n} 案</div>
        </div>`).join('');

    document.getElementById('yr-breakdown').innerHTML = [compareHTML, section('類別收入', byCat), section('客戶收入', byClient, true, lagLead), section('案件來源', bySource), costHTML, lowHTML, dealHTML]
      .filter(Boolean).map(h => `<div class="rv-sec">${h}</div>`).join('');
    document.getElementById('yr-note').textContent = `營業額照實際入帳計算：頭款算在頭款收款日那個月，尾款算在尾款收款日那個月（沒填就算結束日期那個月），案件還沒結案也算；已收頭款但沒填頭款收款日期的先不計。成本有填支出日期就算在那個月，沒填的算在尾款那個月。日均、結案件數、平均每案金額只看「已完成」且「已結清」的專案，${year} 年共 ${entries.length} 個。金額都是未稅（報價 ÷ 1.05），成本照你填的數字扣。`;
  }

  // ── 年度稽核：把這一年的專案逐案列成檢討表，依類別分組；每個指標給燈號（達標／注意／待改善）──
  // 案件歸在哪一年跟首頁年度選單一樣（結束日期 → 開始日期 → 建立日期）；金額一律未稅，成本照填的數字
  const AUDIT_RULES = {
    win:     { good: 60, warn: 40, hi: true,  target: '≥ 60%' },              // 成交率
    dailyOk: { good: 70, warn: 50, hi: true,  target: '≥ 70%' },              // 日均達標率
    margin:  { good: 70, warn: 50, hi: true,  target: '≥ 70%' },              // 毛利率
    lag:     { good: 30, warn: 60, hi: false, target: '≤ 30 天' },            // 結案後幾天收款
    repeat:  { good: 30, warn: 15, hi: true,  target: '≥ 30%' },              // 回頭客佔比
    overdue: { good: 0,  warn: 2,  hi: false, target: '0 案' },               // 完成超過 30 天還沒收齊
    data:    { good: 90, warn: 70, hi: true,  target: '≥ 90%' },              // 資料完整度
    daily:   { good: DAILY_GOOD, warn: DAILY_GOOD / 2, hi: true },           // 單案日均
  };
  const LIGHT_TEXT = { good: '達標', warn: '注意', bad: '待改善' };
  const GRADE_TEXT = { A: '優良', B: '合格', C: '待加強', D: '需檢討' };
  const AUDIT_STATUS = ['已完成','進行中','暫停','接洽中','終止'];
  function auditLight(key, v) {
    if (v == null) return '';
    const r = AUDIT_RULES[key];
    return r.hi ? (v >= r.good ? 'good' : v >= r.warn ? 'warn' : 'bad') : (v <= r.good ? 'good' : v <= r.warn ? 'warn' : 'bad');
  }
  // 燈號平均：達標 2 分、注意 1 分、待改善 0 分
  function gradeOf(lights) {
    if (!lights.length) return null;
    const s = lights.reduce((t,l) => t + (l === 'good' ? 2 : l === 'warn' ? 1 : 0), 0) / lights.length;
    return s >= 1.67 ? 'A' : s >= 1.2 ? 'B' : s >= 0.6 ? 'C' : 'D';
  }
  // 檢討備註：跟其他附加資料一樣存在 tasks 裡（type:'audit'）
  function caseAuditNote(c) { return (parseTasks(c.tasks).find(t=>t.type==='audit') || {}).note || ''; }
  function saveAuditNote(id, el) {
    const c = cases.find(x=>x.id===id); if (!c) return;
    const note = el.value.trim(); if (note === caseAuditNote(c)) return;
    const all = parseTasks(c.tasks).filter(t=>t.type!=='audit');
    c.tasks = JSON.stringify(note ? [...all, { type:'audit', note }] : all);
    syncTasks(c); showToast('檢討備註已儲存 ✓');
  }
  const caseWhen = c => c.end_date || c.start_date || (c.created_at||'').slice(0,10);
  // 回頭客：來源填「舊客回頭」，或同一個客戶在這個案子之前就有別的案件
  function isRepeatCase(c) {
    if (caseMeta(c).source === '舊客回頭') return true;
    const client = (c.client||'').trim(); if (!client) return false;
    return cases.some(x => x.id !== c.id && (x.client||'').trim() === client && caseWhen(x) < caseWhen(c));
  }
  // 備註關鍵字：年度稽核只能照規則判讀，寫到這些詞就會標出來（先檢查「不會再合作」這類否定，避免誤判成會回頭）
  const MEMO_SIGNALS = [
    { k: 'no',       l: 'bad',  t: '備註：不建議再合作', re: /不會再|不再合作|不想再|不合作|不推薦|黑名單|不接了/ },
    { k: 'again',    l: 'good', t: '備註：可能再合作',   re: /明年|續約|下一季|下次|長期|每年|再合作|再找|系列|回購/ },
    { k: 'bargain',  l: 'warn', t: '備註：議價壓力',     re: /殺價|砍價|議價|壓價|預算低|預算不足|預算很少|要求打折/ },
    { k: 'rush',     l: 'warn', t: '備註：急件',         re: /急件|很趕|趕件|臨時|時間很緊|爆肝/ },
    { k: 'revise',   l: 'warn', t: '備註：修改多',       re: /改稿|一直改|反覆|修改很多|追加|改很多次|需求一直變/ },
    { k: 'slowpay',  l: 'warn', t: '備註：付款拖延',     re: /拖款|催款|遲付|拖很久|一直沒付/ },
    { k: 'referral', l: '',     t: '備註：人脈介紹',     re: /介紹|引薦|轉介|牽線/ },
    { k: 'brand',    l: '',     t: '備註：品牌加分',     re: /曝光|作品集|代表作|加分|形象很好|媒體報導/ },
  ];
  function memoSignals(c) {
    const m = caseMemo(c); if (!m) return [];
    const hit = MEMO_SIGNALS.filter(s => s.re.test(m));
    return hit.some(s => s.k === 'no') ? hit.filter(s => s.k !== 'again') : hit;
  }
  function auditCase(c) {
    const pay = payLabel(c.payment_status), net = netQuote(c), cost = costTotal(c), days = caseDays(c);
    const alive = c.status !== '終止', charged = net > 0 && pay !== '互惠';
    const won = charged && (c.status === '進行中' || c.status === '已完成'), done = charged && c.status === '已完成';
    const profit = net - cost;
    const margin = alive && charged ? Math.round(profit / net * 100) : null;
    const daily = alive && charged && days ? Math.round(profit / days) : null;
    const paid = casePaidDate(c);
    const lag = paid && c.end_date ? Math.round((new Date(paid+'T00:00:00') - new Date(c.end_date+'T00:00:00')) / 86400000) : null;
    const unsettled = done && pay !== '已結清';
    const unpaidDays = unsettled && c.end_date ? Math.max(-daysFromToday(c.end_date), 0) : null;
    // 評等只給已完成、有收費的案件：看日均、毛利率、收款速度（還沒收齊的看拖了幾天）
    const lights = done ? [auditLight('daily', daily), auditLight('margin', margin), auditLight('lag', lag == null ? null : Math.max(lag, 0))].filter(Boolean) : [];
    if (unpaidDays != null && unpaidDays > 30) lights.push(unpaidDays > 60 ? 'bad' : 'warn');
    const tags = [];
    if (!alive) tags.push(['lost', '終止・' + (caseMeta(c).lost || '未填原因')]);
    if (pay === '互惠') tags.push(['', '互惠']);
    if (daily != null && daily < DAILY_GOOD) tags.push([auditLight('daily', daily), '日均偏低']);
    if (margin != null && margin < AUDIT_RULES.margin.good) tags.push([auditLight('margin', margin), '毛利偏低']);
    if (lag != null && lag > 30) tags.push([auditLight('lag', lag), `${lag} 天才收款`]);
    if (unsettled) tags.push([unpaidDays > 60 ? 'bad' : unpaidDays > 30 ? 'warn' : '', unpaidDays != null ? `完成 ${unpaidDays} 天未收齊` : '尚未收齊']);
    const dl = deadlineInfo(c); if (dl.cls === 'dl-over') tags.push(['bad', 'Deadline ' + dl.note]);
    missingWhat(c).forEach(m => tags.push(['', m]));
    if (won && !caseMeta(c).source) tags.push(['', '未填來源']);
    const sig = memoSignals(c);
    sig.forEach(s => tags.push([s.l === 'good' ? 'good' : s.l, s.t]));
    return { c, pay, net, gross: Number(c.quote_amount) || 0, cost, profit, days, alive, charged, won, done, margin, daily, lag, unsettled, unpaidDays,

      margin: doneNet ? Math.round((doneNet - sumBy(done, 'cost')) / doneNet * 100) : null,

  async function exportAuditForClaude(kind) {

    const text = auditMarkdown(year);
    if (kind === 'md') {
      downloadBlob(new Blob([text], { type: 'text/markdown;charset=utf-8' }), `年度稽核-${year}.md`);
      showToast('已下載，把檔案拖進 Claude 對話就可以 ✓');
      return;
    }
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
      ta.remove();
      if (!ok) { showToast('⚠ 複製失敗，改用下載檔案'); return; }
    }
    showToast('已複製，貼到 Claude 對話就可以 ✓');
  }
