  }

  // 專案狀態（接洽中／進行中…）一律手動改，付款、收款日期都不會去動它。
  // 付款狀態帶動發票狀態：未收款 → 未開、已收頭款 → 頭款已開、已結清 → 尾款已開（部分付款、互惠不動發票），並清掉對不上的收款日期
  const PAY_TO_INVOICE = { '未收款':'未開', '已收頭款':'頭款已開', '已結清':'尾款已開' };
  // 新增／編輯專案：未稅、含稅填其中一個，另一個自動換算（營業稅 5%）。專案的「報價」存的是含稅金額
  const TAX_RATE = 0.05;
  function syncQuoteTax(from) {
    const net = document.getElementById('m-quote-net'), gross = document.getElementById('m-quote');
    const v = parseFloat((from === 'net' ? net : gross).value) || 0;
    const other = from === 'net' ? Math.round(v * (1 + TAX_RATE)) : Math.round(v / (1 + TAX_RATE));
    (from === 'net' ? gross : net).value = v ? other : '';
  }
  async function updateField(id, field, value) {
    const c = cases.find(x=>x.id===id); if (!c) return;
    const patch = { [field]: value };
    if (field === 'payment_status') {
      const inv = PAY_TO_INVOICE[payLabel(value)];
      if (inv && inv !== c.invoice) { patch.invoice = inv; showToast('發票跟著改為' + inv + ' ✓'); }
      // 退回未收款：頭款、尾款的收款日期都清掉；退回已收頭款：清掉尾款的收款日期
      const lbl = payLabel(value);
      if (lbl === '未收款' && (caseDepositDate(c) || casePaidDate(c))) patch.tasks = paymentTasks(c, { date:'', date1:'' });
      else if (lbl === '已收頭款' && casePaidDate(c)) patch.tasks = paymentTasks(c, { date:'' });
    }
    Object.assign(c, patch); saveLocal(); renderAll();
    if (viewingId===id) renderPanel();
    if (db) { setSyncDot('loading'); try { const{error}=await db.from('cases').update(patch).eq('id',id); setSyncDot(error?'err':'ok'); } catch(e){setSyncDot('err');} }
  }

  // ── 複製專案：帶走客戶、類別、優先級、報價、項目（狀態重設）、成本、發票資訊；日期、付款、發票狀態、收款紀錄不帶 ──
  async function duplicateCase(id) {
    const src = cases.find(x=>x.id===id); if (!src) return;
    const now = Date.now();
    const items = parseTasks(src.tasks).filter(t => t.type !== 'payment').map((t,i) =>
      t.type ? { ...t, ...(t.id ? { id: String(now+i+1) } : {}), ...(t.type === 'meta' ? { lost: '' } : {}) }
             : { ...t, id: String(now+i+1), status: '未開始', date: '', note: '' });
    const data = {
      id: String(now), created_at: new Date().toISOString(),
      name: (src.name||'') + '（複製）', client: src.client||'', category: src.category||'其他',
      status: '接洽中', priority: src.priority||'中', start_date: '', end_date: '', deadline: '',
      quote_amount: Number(src.quote_amount)||0, payment_status: '未收款',
      contact_name: '', contact_info: '', note: '', progress_note: '', tasks: JSON.stringify(items),
    };
    cases.unshift(data);
    if (!inViewYear(data)) viewYear = caseYear(data);
    viewingId = data.id; saveLocal(); renderAll(); renderPanel();
    document.getElementById('panel-scroll').scrollTop = 0;
    showToast('已複製，記得改名稱和日期 ✓');
    if (db) { setSyncDot('loading'); try { const { error } = await db.from('cases').insert(data); setSyncDot(error?'err':'ok'); if (error) showToast('⚠ 雲端同步失敗：' + error.message); } catch(e) { setSyncDot('err'); } }
  }

  // ── 時程（月／年檢視）：只放還沒結束的專案（已完成、終止不顯示），依起訖日期畫成橫條，Deadline 以紅字標在當天 ──
  let calYM = null; // { y, m }，m 從 0 起算
  let calMode = 'month'; // 'month'＝單月格子；'year'＝整年時間軸
  function calSetMode(mode) { calMode = mode; renderCalendar(); }
  const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  function openCalendar() {
    const t = new Date();
    calYM = (viewYear === 'all' || +viewYear === t.getFullYear()) ? { y: t.getFullYear(), m: t.getMonth() } : { y: +viewYear, m: 0 };
    renderCalendar();
    document.getElementById('cal-modal').classList.add('open');
  }
  function closeCalendar() { document.getElementById('cal-modal').classList.remove('open'); }
  function calShift(n) { const d = calMode === 'year' ? new Date(calYM.y + n, calYM.m, 1) : new Date(calYM.y, calYM.m + n, 1); calYM = { y: d.getFullYear(), m: d.getMonth() }; renderCalendar(); }
  function calToday() { const t = new Date(); calYM = { y: t.getFullYear(), m: t.getMonth() }; renderCalendar(); }
  function calOpenCase(id) {
    const c = cases.find(x=>x.id===id); if (!c) return;
    closeCalendar();
    if (!inViewYear(c)) viewYear = caseYear(c);
    if (viewingId !== id) openPanel(id); else renderAll();
  }
  function calActive(c) { return c.status !== '終止' && c.status !== '已完成'; }
  // 專案在時程上的起點：開始日期 → 沒有就用結束日期 → 再沒有就用 Deadline（只知道交期的接洽中案件也排得上去）
  function calStart(c) { return c.start_date || c.end_date || c.deadline || ''; }
  function calSpans() {
    return cases
      .filter(c => calActive(c) && calStart(c))
      .map(c => { const s = calStart(c), e = [c.end_date, c.start_date ? '' : c.deadline].filter(d => d && d >= s).sort().pop() || s; return { c, s, e }; });
  }
  // 同時進行的專案數：固定 7 階紅色，1 件最淺、7 件以上最深（不隨當年最忙的月份變動）
  const LOAD_COLORS = ['#E8C4C0','#DDA39E','#CF7F7A','#C55F58','#BC403D','#942B3A','#6E2147'];
  // 點「+N」：列出那一天所有進行中的專案（含格子裡放不下的），點一下打開該專案
  function showDayProjects(anchor, ds) {
    const list = calSpans().filter(p => p.s <= ds && p.e >= ds).sort((a,b) => a.s.localeCompare(b.s));
    showInlineDD(anchor, [{ header: `${+ds.slice(5,7)}月${+ds.slice(8,10)}日・${list.length} 個專案` },
      ...list.map(p => ({ value: p.c.id, cls: 'b-' + p.c.status, label: esc(p.c.name) }))], id => calOpenCase(id));
  }
  function renderYearView() {
    const y = calYM.y, today = iso(new Date());
    document.getElementById('cal-title').textContent = `${y}年`;
    const yFrom = `${y}-01-01`, yTo = `${y}-12-31`;
    const dayNo = s => Math.round((new Date(s+'T00:00:00') - new Date(y,0,1)) / 86400000); // 當年第幾天（0 起算）
    const total = dayNo(yTo) + 1;
    const mDays = Array.from({ length: 12 }, (_, i) => new Date(y, i+1, 0).getDate());
    const spans = calSpans().filter(p => p.s <= yTo && p.e >= yFrom).sort((a,b) => a.s.localeCompare(b.s) || a.e.localeCompare(b.e));
    const pad = n => String(n).padStart(2,'0');
    const load = mDays.map((d, i) => spans.filter(p => p.s <= `${y}-${pad(i+1)}-${pad(d)}` && p.e >= `${y}-${pad(i+1)}-01`).length);
    const thisM = today.startsWith(String(y)) ? +today.slice(5,7) - 1 : -1;
    const md = s => `${s.slice(0,4) !== String(y) ? s.slice(0,4) + '/' : ''}${+s.slice(5,7)}/${+s.slice(8,10)}`;
    let acc = 0; const lines = mDays.map(d => { const x = acc / total * 100; acc += d; return x; }).slice(1).map(x => `<i style="left:${x}%"></i>`).join('');
    const todayLine = thisM >= 0 ? `<i class="today" style="left:${(dayNo(today) + 0.5) / total * 100}%"></i>` : '';
    const rows = spans.map(p => {
      const a = Math.max(dayNo(p.s), 0), b = Math.min(dayNo(p.e), total - 1);
      return `<div class="yv-row item" onclick="calOpenCase('${p.c.id}')">
        <div class="yv-name"><div>${esc(p.c.name)}</div><small>${p.s === p.e ? md(p.s) : md(p.s) + ' → ' + md(p.e)}</small></div>
        <div class="yv-track">${lines}${todayLine}<div class="yv-bar calv-bar b-${p.c.status}${p.s < yFrom ? ' cl' : ''}${p.e > yTo ? ' cr' : ''}" style="left:${a/total*100}%;width:${(b-a+1)/total*100}%" title="${esc(p.c.name).replace(/"/g,'&quot;')}"></div></div>
      </div>`;
    }).join('');
    const undated = cases.filter(c => calActive(c) && !calStart(c)).length;
    const free = load.map((n, i) => n === 0 ? `${i+1}月` : '').filter(Boolean);
    document.getElementById('cal-year-wrap').innerHTML = `<div class="yv">
      <div class="yv-row"><div></div><div class="yv-months">${mDays.map((d,i)=>`<span class="${i===thisM?'now':''}" style="flex:${d}">${i+1}月</span>`).join('')}</div></div>
      <div class="yv-row"><div class="yv-head-label">同時進行的專案數</div><div class="yv-load">${load.map((n,i)=>`<span class="${n===0?'free':''}" style="flex:${mDays[i]};background:${LOAD_COLORS[Math.min(n,7)-1]||'none'};color:#FFF;font-weight:600;text-shadow:0 0 2px rgba(110,30,40,0.4)">${n===0?'空':n}</span>`).join('')}</div></div>
      <div class="yv-body">${rows || '<div class="empty" style="padding:16px 0">這一年沒有排專案</div>'}</div>
      <div class="yv-legend">${['進行中','接洽中','暫停'].map(st=>`<span><i class="b-${st}"></i>${st}</span>`).join('')}<span><i style="width:1.5px;height:12px;border-radius:0;background:#E53935"></i>今天</span></div>
      <div class="yr-note" style="margin-top:8px">${spans.length ? (free.length ? `沒有排專案的月份：${free.join('、')}。` : '每個月都有專案在進行。') : ''}${undated ? `另有 ${undated} 個專案沒有填日期，排不進時程。` : ''}</div>
    </div>`;
  }
  function renderCalendar() {
    document.getElementById('cal-seg-month').classList.toggle('on', calMode === 'month');
    document.getElementById('cal-seg-year').classList.toggle('on', calMode === 'year');
    document.getElementById('cal-month-wrap').style.display = calMode === 'month' ? '' : 'none';
    document.getElementById('cal-year-wrap').style.display = calMode === 'year' ? '' : 'none';
    if (calMode === 'year') { renderYearView(); return; }
    const { y, m } = calYM;
    document.getElementById('cal-title').textContent = `${y}年${m+1}月`;
    const first = new Date(y, m, 1), gridStart = new Date(y, m, 1 - first.getDay());
    const weeks = 6; // 固定畫 6 週，切換月份時高度才不會跳
    const days = Array.from({ length: weeks*7 }, (_, i) => new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i));
    const from = iso(days[0]), to = iso(days[days.length-1]), today = iso(new Date());
    // 這個畫面範圍內有重疊的專案
    const spans = calSpans()
      .filter(p => p.s <= to && p.e >= from)
      .sort((a,b) => a.s.localeCompare(b.s) || b.e.localeCompare(a.e));
    // 排車道：一週一週排（同一週內橫條會連起來，換週可以換列），長的專案優先佔上面的列，
    // 這樣前面幾天空出來的位置下一週就能補上，不會整個月都被擠到「+N」裡
    const weekLanes = Array.from({ length: weeks }, (_, w) => {
      const wFrom = iso(days[w*7]), wTo = iso(days[w*7+6]), laneEnd = [], map = new Map();
      spans.filter(p => p.s <= wTo && p.e >= wFrom)
        .sort((a,b) => (a.s < wFrom ? wFrom : a.s).localeCompare(b.s < wFrom ? wFrom : b.s) || b.e.localeCompare(a.e))
        .forEach(p => { const st = p.s < wFrom ? wFrom : p.s; let l = laneEnd.findIndex(e => e < st); if (l === -1) l = laneEnd.length; laneEnd[l] = p.e; map.set(p.c.id, l); });
      return map;
    });
    const MAX = window.innerWidth <= 640 ? 2 : 3;
    const deadlines = cases.filter(c => c.deadline && c.status !== '終止' && c.status !== '已完成');
    document.getElementById('tl-grid').innerHTML = days.map((d, i) => {
      const ds = iso(d), wl = weekLanes[Math.floor(i/7)];
      const act = spans.filter(p => p.s <= ds && p.e >= ds).map(p => ({ ...p, lane: wl.get(p.c.id) }));
      let bars = '';
      // 只畫到這一天實際用到的最後一列，後面不留空列，Deadline 才有位置放
      const lanes = Math.min(MAX, Math.max(-1, ...act.map(p => p.lane)) + 1);
      for (let l = 0; l < lanes; l++) {
        const p = act.find(x => x.lane === l);
        if (!p) { bars += '<div class="calv-bar gap"></div>'; continue; }
        const isS = p.s === ds, isE = p.e === ds, label = isS || d.getDay() === 0 || i === 0;
        bars += `<div class="calv-bar b-${p.c.status}${isS?' s':''}${isE?' e':''}${label?' lbl':''}" title="${esc(p.c.name).replace(/"/g,'&quot;')}" onclick="calOpenCase('${p.c.id}')">${label ? esc(p.c.name) : ''}</div>`;
      }
      const hidden = act.filter(p => p.lane >= MAX).length;
      // 格子高度固定：橫條一列約 19px、Deadline 一行約 14px，放不下的收成「另 N 個」
      // 已經用橫條標在這天的專案（只填了 Deadline 的那種）不再重複列一次
      const dls = deadlines.filter(c => c.deadline === ds && !act.some(p => p.c.id === c.id && p.s === ds && p.e === ds));
      const fit = Math.max(0, Math.floor((78 - lanes * 19) / 14));
      const shown = dls.length > fit ? dls.slice(0, Math.max(fit - 1, 0)) : dls;
      const dl = shown.map(c => `<div class="calv-dl" title="Deadline：${esc(c.name).replace(/"/g,'&quot;')}" onclick="calOpenCase('${c.id}')">⚠ ${esc(c.name)}</div>`).join('')
        + (dls.length > shown.length && fit > 0 ? `<div class="calv-dl" style="cursor:default" title="${dls.slice(shown.length).map(c=>esc(c.name).replace(/"/g,'&quot;')).join('、')}">⚠ 另 ${dls.length - shown.length} 個到期</div>` : '');
      return `<div class="calv-cell${d.getMonth()!==m?' out':''}${ds===today?' today':''}"><div class="calv-day"><b>${d.getDate()}</b>${hidden?`<span class="calv-more" title="看這一天全部的專案" onclick="event.stopPropagation();showDayProjects(this,'${ds}')">+${hidden}</span>`:''}</div>${bars}${dl}</div>`;
    }).join('');
    // 下方清單：這個月有在進行的專案
    const mFrom = iso(new Date(y, m, 1)), mTo = iso(new Date(y, m+1, 0));
    const inMonth = spans.filter(p => p.s <= mTo && p.e >= mFrom);
    const md = s => `${+s.slice(5,7)}/${+s.slice(8,10)}`;
    const undated = cases.filter(c => calActive(c) && !calStart(c)).length;
    document.getElementById('cal-list').innerHTML =
      `<div class="bd-title">這個月的專案（${inMonth.length}）</div>` +
      (inMonth.map(p => `<div class="cal-li" onclick="calOpenCase('${p.c.id}')">
          <span class="badge b-${p.c.status}">${p.c.status}</span>
          <span class="cal-li-name">${esc(p.c.name)}</span>
          <span class="cal-li-date">${p.s === p.e ? md(p.s) : md(p.s) + ' → ' + md(p.e)}</span>
        </div>`).join('') || '<div class="empty" style="padding:12px 0">這個月沒有排專案</div>') +
      (undated ? `<div class="yr-note">另有 ${undated} 個專案沒有填日期，排不進時程。</div>` : '');
  }

  // ── 更多選單 ──────────────────────────────
  function openMoreMenu(anchor) {
    const items = [];
    if (window.innerWidth <= 640) items.push({value:'rc',cls:'',label:`待收款（${receivables().length}）`},{value:'year',cls:'',label:'全年收入'},{value:'cal',cls:'',label:'時程'},{sep:true});
    if (window.innerWidth <= 640 && undoStack.length) items.push({value:'undo',cls:'',label:'↩ 復原上一步'},{sep:true});
    items.push({value:'missing',cls:'',label:`缺資料檢查（${cases.filter(inViewYear).filter(isMissing).length}）`},{value:'backup',cls:backupOverdue()?'dd-warn':'',label:backupLabel()});
    if (db && session) items.push({sep:true},{value:'logout',cls:'',label:'登出'});
    else if (db && dbOpen) items.push({sep:true},{value:'login',cls:'',label:'登入'});
    showInlineDD(anchor, items, v => ({
      rc: openReceivables, year: openYearModal, cal: openCalendar, backup: exportBackup, logout: doLogout,
      login: () => showLogin(true), undo: undoLast,
      missing: () => { missingOnly = true; renderAll(); window.scrollTo(0,0); },
    })[v]());
  }

  // ── 匯出備份：把全部專案（含項目、成本、發票資訊）下載成一個檔案 ──
  function exportBackup() {
    if (!cases.length) { showToast('目前沒有資料可以備份'); return; }
    const d = new Date(), pad = n => String(n).padStart(2,'0');
    const stamp = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const blob = new Blob([JSON.stringify({ exported_at: d.toISOString(), count: cases.length, cases }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `專案管理備份-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    try { localStorage.setItem('boyu_last_backup', String(Date.now())); } catch(e) {}
    updateBackupWarn();
    showToast(`已下載備份（${cases.length} 個專案）✓`);
  }
  // 備份提醒：記在這台裝置上；超過 30 天（或從沒備份過）就在「⋯」上亮紅點
  function backupDays() {
    let t = 0; try { t = Number(localStorage.getItem('boyu_last_backup')) || 0; } catch(e) {}
    return t ? Math.floor((Date.now() - t) / 86400000) : null;
  }
  function backupOverdue() { const d = backupDays(); return cases.length > 0 && (d === null || d > 30); }
  function backupLabel() {
    const d = backupDays();
    return '匯出備份' + (d === null ? '（還沒備份過）' : d === 0 ? '（今天已備份）' : `（上次 ${d} 天前）`);
  }
  function updateBackupWarn() { document.querySelector('.btn-more')?.classList.toggle('warn', backupOverdue()); }

  // ── 缺資料檢查：缺起訖日期、缺報價、已收頭款卻沒填頭款收款日期（終止的不算）──
  function missingWhat(c) {
    if (c.status === '終止') return [];
    const noHeadDate = payLabel(c.payment_status) === '已收頭款' && Number(c.quote_amount) > 0 && !caseDepositDate(c);
    return [!caseDays(c) && '缺日期', !Number(c.quote_amount) && '缺報價', noHeadDate && '缺頭款收款日期'].filter(Boolean);
  }
  function isMissing(c) { return missingWhat(c).length > 0; }

  // ── Deadline 提醒：過期紅、7 天內橘；已完成／終止的不提醒 ──
  function daysFromToday(dateStr) {
    const t = new Date(); t.setHours(0,0,0,0);
    return Math.round((new Date(dateStr+'T00:00:00') - t) / 86400000);
  }
  function deadlineInfo(c) {
    if (!c.deadline || c.status === '已完成' || c.status === '終止') return { cls:'', note:'' };
    const d = daysFromToday(c.deadline);
    if (d < 0)  return { cls:'dl-over', note:`已過期 ${-d} 天` };
    if (d === 0) return { cls:'dl-soon', note:'今天到期' };
    if (d <= 7) return { cls:'dl-soon', note:`剩 ${d} 天` };
    return { cls:'', note:'' };
  }

  // 還沒收的金額：已收頭款的扣掉頭款（頭款固定算報價的一半），其他狀態算整筆報價
  // 有填「已收金額」就用實際數字；沒填的話，已收頭款先以報價的一半估算
  const DEPOSIT_RATE = 0.5;
  function casePayment(c) { return parseTasks(c.tasks).find(t=>t.type==='payment') || {}; }
  // 案件來源、終止原因：跟收款紀錄一樣存在 tasks 裡（type:'meta'），不動資料表
  const metaItems = (header, list) => [{header}, ...list.map(v => ({value:v, cls:'b-meta', label:v})), {sep:true}, {value:'', cls:'', label:'清除'}];
  const SOURCE_DD_ITEMS = metaItems('案件來源', ['舊客回頭','朋友介紹','IG','官網','主動提案','其他']);
  const LOST_DD_ITEMS = metaItems('終止原因', ['預算不合','檔期衝突','客戶沒下文','我推掉','其他']);
  function caseMeta(c) { return parseTasks(c.tasks).find(t=>t.type==='meta') || {}; }
  function setMeta(key, value) {
    const c = cases.find(x=>x.id===viewingId); if (!c) return;
    const meta = { type:'meta', source: caseMeta(c).source || '', lost: caseMeta(c).lost || '', [key]: value || '' };
    const all = parseTasks(c.tasks).filter(t=>t.type!=='meta');
    c.tasks = JSON.stringify((meta.source || meta.lost) ? [...all, meta] : all);
    syncTasks(c); renderAll(); renderPanel();
  }
  function caseReceived(c) { return Number(casePayment(c).received) || 0; }
  // 收款日期分頭款（date1）和尾款（date）；全年收入的入帳月份、客戶付款速度都看尾款那一天
  function casePaidDate(c) { return casePayment(c).date || ''; }
  function caseDepositDate(c) { return casePayment(c).date1 || ''; }
  function paymentTasks(c, patch) {
    const pay = { type:'payment', received: caseReceived(c), date: casePaidDate(c), date1: caseDepositDate(c), ...patch };
    const all = parseTasks(c.tasks).filter(t=>t.type!=='payment');
    return JSON.stringify((pay.received || pay.date || pay.date1) ? [...all, pay] : all);
  }
  function writePayment(c, patch) {
    c.tasks = paymentTasks(c, patch);
    syncTasks(c); renderAll();
  }
  // 收款日期帶動付款狀態（付款狀態再帶動發票，見 updateField）：
  // 填頭款日期 → 已收頭款；填尾款日期 → 已結清。清除日期只清日期，不動付款和發票
  function savePaidDate(value, key = 'date') {
    const c = cases.find(x=>x.id===viewingId); if (!c) return;
    writePayment(c, { [key]: value || '' });
    renderPanel();
    if (!value) return;
    const tail = casePaidDate(c), pay = payLabel(c.payment_status), inv = c.invoice;
    let toPay = null;
    if (key === 'date') toPay = '已結清';
    else if (!tail && pay !== '已結清') toPay = '已收頭款';
    if (!toPay || toPay === pay) return;
    updateField(c.id, 'payment_status', toPay);
    showToast('付款改為' + toPay + (c.invoice !== inv ? '、發票改為' + c.invoice : '') + ' ✓');
  }
  function amountDue(c) {
    const q = Number(c.quote_amount) || 0;
    if (c.payment_status === '已結清' || c.payment_status === '互惠') return 0;
    const got = caseReceived(c);
    if (got) return Math.max(q - got, 0);
    return payLabel(c.payment_status) === '已收頭款' ? q - Math.round(q * DEPOSIT_RATE) : q;
  }
  // 已收金額那一列：左邊頭款、右邊尾款（＝報價 − 頭款）。
  // 頭款有填就用填的；沒填的話，未收款／已收頭款／已結清都先顯示報價的一半
  function shownReceived(c) {
    const auto = ['未收款','已收頭款','已結清'].includes(payLabel(c.payment_status));
    return caseReceived(c) || (auto ? Math.round((Number(c.quote_amount)||0) * DEPOSIT_RATE) : 0);
  }
  // 頭款待收：付款還是未收款、也還沒填頭款收款日期
  function depositHintHTML(c) {
    return shownReceived(c) && payLabel(c.payment_status) === '未收款' && !caseDepositDate(c) ? '（待收）' : '';
  }
  // 尾款待收：付款不是已結清、也還沒填尾款收款日期
  function dueHintHTML(c) {
    const q = Number(c.quote_amount) || 0;
    if (!q || c.payment_status === '互惠') return '';
    const tail = Math.max(q - shownReceived(c), 0);
    const pending = c.payment_status !== '已結清' && !casePaidDate(c);
    return `尾款 $${tail.toLocaleString()}${pending ? '（待收）' : ''}`;
  }
  const depositColor = c => depositHintHTML(c) ? '#AAA' : '#1A1A1A'; // 頭款還沒收：整段跟尾款一樣淡灰
  const tailColor = c => dueHintHTML(c).includes('待收') ? '#AAA' : '#1A1A1A'; // 尾款收到了（已結清或填了尾款日期）就變黑
  const receivedText = c => shownReceived(c) ? '$' + shownReceived(c).toLocaleString() : '';
  const receivedWidth = c => `calc(${Math.max(receivedText(c).length, 4)}ch + 14px)`;
  function saveReceived(input) {
    const c = cases.find(x=>x.id===viewingId); if (!c) return;
    const n = Math.round(Number(input.value.replace(/[^\d.]/g,''))) || 0;
    if (n !== shownReceived(c)) writePayment(c, { received: n });
    input.value = receivedText(c); input.style.width = receivedWidth(c); input.style.color = depositColor(c);
    const lbl = document.getElementById('dep-label'); if (lbl) lbl.style.color = depositColor(c);
    const dep = document.getElementById('dep-hint'); if (dep) dep.textContent = depositHintHTML(c);
    const hint = document.getElementById('due-hint'); if (hint) { hint.textContent = dueHintHTML(c); hint.style.color = tailColor(c); }
  }
  // ── 待收款：已完成或進行中，但還沒結清 ──────
  // 已完成的排前面（拖越久越上面），進行中的排後面
  function receivables() {
    return cases
      .filter(c => inViewYear(c) && (c.status === '已完成' || c.status === '進行中') && c.payment_status !== '已結清' && c.payment_status !== '互惠' && Number(c.quote_amount) > 0)
      .map(c => { const d = c.end_date || c.start_date; return { c, due: amountDue(c), done: c.status === '已完成', days: c.status === '已完成' && d ? -daysFromToday(d) : null }; })
      .sort((a,b) => (b.done - a.done) || ((b.days ?? -1) - (a.days ?? -1)));
  }
  function openReceivables() {
    const list = receivables();
    const total = list.reduce((s,r)=>s+r.due,0);
    document.getElementById('rc-total-label').textContent = `${viewYear === 'all' ? '全部年度' : viewYear + ' 年'}・${list.length} 個專案還沒收齊`;
    document.getElementById('rc-total-amt').textContent = 'NT$ ' + total.toLocaleString();
    document.getElementById('rc-list').innerHTML = list.map(({c,due,done,days}) => {
      const pay = payLabel(c.payment_status) || '未收款';
      const when = !done ? '進行中' : days === null ? '已完成・沒有日期' : days <= 0 ? '剛完成' : `<span class="${days>=30?'late':''}">完成後 ${days} 天</span>`;
      return `<div class="rc-row" onclick="closeReceivables();if(viewingId!=='${c.id}')openPanel('${c.id}')">
        <div class="rc-main">
          <div class="rc-name">${esc(c.name)}</div>
          <div class="rc-sub">${c.client?esc(c.client)+'・':''}${when}</div>
        </div>
        <div class="rc-amt"><b>NT$ ${due.toLocaleString()}</b>${due !== Number(c.quote_amount) ? `<small>報價 ${Number(c.quote_amount).toLocaleString()}</small>` : ''}<span class="badge b-pay-${pay}">${pay}</span></div>
        <button type="button" class="rc-copy" title="複製催款訊息" aria-label="複製催款訊息" onclick="event.stopPropagation();copyReminder('${c.id}')"><svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true"><path d="M12 2a1.5 1.5 0 0 0-1.5 1.5v.6A6 6 0 0 0 6 10v4.2l-1.6 2.4A1 1 0 0 0 5.2 18h13.6a1 1 0 0 0 .8-1.4L18 14.2V10a6 6 0 0 0-4.5-5.9v-.6A1.5 1.5 0 0 0 12 2z"/><path d="M9.5 19.5a2.5 2.5 0 0 0 5 0z"/></svg></button>
      </div>`;
    }).join('') || `<div class="empty">${viewYear === 'all' ? '' : viewYear + ' 年'}沒有待收的款項</div>`;
    document.getElementById('rc-modal').classList.add('open');
  }
  // 催款訊息：帶入專案名稱（去掉前面的內部編號）與待收金額，複製後貼到 LINE
  function reminderText(c) {
    const name = (c.name||'').replace(/^\d{3}\s+/, '');
    const due = amountDue(c), partial = due !== Number(c.quote_amount);
    const d = c.end_date || c.start_date;
    const doneLine = c.status === '已完成' && d ? `專案已於 ${+d.slice(5,7)}/${+d.slice(8,10)} 完成，` : '';
    return [
      '您好，',
      '',
      `想跟您確認「${name}」的款項。`,
      `${doneLine}目前${partial ? '尾款' : '款項'} NT$ ${due.toLocaleString()} 尚未入帳，再麻煩協助確認付款時程。`,
      '',
      '謝謝！',
    ].join('\n');
  }
  async function copyText(text, okMsg) {
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
      ta.remove();
      if (!ok) { showToast('⚠ 複製失敗'); return; }
    }
    showToast(okMsg);
  }
  // 報價單文字：專案名稱（去掉內部編號）、客戶、時程、項目清單、未稅／稅額／含稅、頭款與尾款，複製後貼到 LINE
  function quoteSheetText(c) {
    const name = (c.name||'').trim().replace(/^\d+(?:\s*-\s*\d+)?\s+/, '');
    const gross = Number(c.quote_amount) || 0, net = Math.round(gross / (1 + TAX_RATE));
    const items = parseTasks(c.tasks).filter(t => !t.type && (t.name||'').trim());
    const day = d => `${+d.slice(0,4)}/${+d.slice(5,7)}/${+d.slice(8,10)}`, nt = n => 'NT$ ' + n.toLocaleString();
    const lines = ['【報價單】', '', `專案：${name}`];
    if ((c.client||'').trim()) lines.push(`客戶：${c.client.trim()}`);
    if (c.start_date) lines.push(`時程：${day(c.start_date)}${c.end_date && c.end_date !== c.start_date ? ' – ' + day(c.end_date) : ''}`);
    if (items.length) lines.push('', '項目：', ...items.map((t,i) => `${i+1}. ${t.name.trim()}`));
    if (gross) {
      lines.push('', `金額（未稅）：${nt(net)}`, `營業稅 5%：${nt(gross - net)}`, `總計（含稅）：${nt(gross)}`);
      if (c.payment_status !== '互惠') {
        const dep = Math.min(caseReceived(c) || Math.round(gross * DEPOSIT_RATE), gross);
        lines.push('', '付款方式：', `頭款 ${nt(dep)}`, `尾款 ${nt(gross - dep)}`);
      }
    }
    lines.push('', '以上內容再麻煩確認，謝謝！');
    return lines.join('\n');
  }
  function copyQuoteSheet() {
    const c = cases.find(x=>x.id===viewingId); if (!c) return;
    if (!Number(c.quote_amount)) { showToast('還沒填報價，先填報價再複製'); return; }
    copyText(quoteSheetText(c), '報價單文字已複製，可以貼到 LINE ✓');
  }
  async function copyReminder(id) {
    const c = cases.find(x=>x.id===id); if (!c) return;
    const text = reminderText(c);
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
      ta.remove();
      if (!ok) { showToast('⚠ 複製失敗'); return; }
    }
    showToast('催款訊息已複製，可以貼到 LINE ✓');
  }
  function closeReceivables() { document.getElementById('rc-modal').classList.remove('open'); }

  // ── 全年收入 ──────────────────────────────
  // 只計入「已完成」且付款「已結清」的專案；金額算在結束日期那個月（沒有結束日就用開始日），沒有日期的不列入
  function yearEntries() {
    return cases
      .filter(c => c.status === '已完成' && c.payment_status === '已結清')
      .map(c => ({ c, date: casePaidDate(c) || c.end_date || c.start_date || '', inc: netQuote(c), gross: Number(c.quote_amount)||0, exp: costTotal(c) }))
      .filter(e => e.date);
  }
  // 實際入帳（營業額、每月長條圖、客戶頁用這個）：一個專案最多兩筆，頭款算在頭款收款日、尾款算在尾款收款日。
  // ・頭款：付款不是未收款／互惠，而且有填頭款收款日期才算（沒填日期不知道算哪個月，先不計）
  // ・尾款：付款是已結清才算；日期用尾款收款日期，沒填就用結束日期（再沒有用開始日期）。頭款沒有單獨入帳的話，整筆算在這裡
  // ・成本：跟著尾款那一筆；還沒收尾款就算在結束日期那個月（沒有就跟頭款同一天）
  // 金額都換成未稅；專案狀態不影響（還沒結案但錢進來了也算）
  function cashEvents() {
    const out = [];
    for (const c of cases) {
      const gross = Number(c.quote_amount) || 0, pay = payLabel(c.payment_status);
      if (!gross || pay === '互惠' || pay === '未收款') continue;
      const settled = pay === '已結清', dep = Math.min(shownReceived(c), gross), headDate = caseDepositDate(c);
      const tailDate = settled ? (casePaidDate(c) || c.end_date || c.start_date || '') : '';
      const head = headDate && dep > 0 && (!settled || dep < gross);
      const headNet = head ? Math.round(dep / (1 + TAX_RATE)) : 0, cost = costTotal(c);
      if (head) out.push({ c, part:'頭款', date: headDate, gross: dep, inc: headNet, exp: 0 });
      if (settled && tailDate) out.push({ c, part: head ? '尾款' : '全額', date: tailDate, gross: gross - (head ? dep : 0), inc: netQuote(c) - headNet, exp: cost });
      else if (head && cost) out.push({ c, part:'成本', date: c.end_date || headDate, gross: 0, inc: 0, exp: cost });
    }
    return out;
  }
  function openYearModal() {
    const thisYear = viewYear === 'all' ? new Date().getFullYear() : +viewYear;
    const years = [...new Set([thisYear, new Date().getFullYear(), ...yearEntries().map(e => +e.date.slice(0,4)), ...cashEvents().map(e => +e.date.slice(0,4))])].sort((a,b)=>b-a);
    document.getElementById('yr-year').innerHTML = years.map(y => `<option value="${y}"${y===thisYear?' selected':''}>${y}年</option>`).join('');
    renderYearStats();
    document.getElementById('yr-modal').classList.add('open');
  }
  // 匯出目前選的年份（Numbers 或 Excel）：一個專案一列，最後一列合計
  // 試算表函式庫按下去才載入；載入或產生失敗（例如離線）就改下載 CSV
  const SHEETJS = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/';
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const sc = document.createElement('script');
      sc.src = src; sc.onload = resolve; sc.onerror = () => reject(new Error('load failed: ' + src));
      document.head.appendChild(sc);
    });
  }
  async function loadXLSX(needNumbers) {
    if (!window.XLSX) await loadScript(SHEETJS + 'xlsx.full.min.js');
    if (needNumbers && !window.XLSX_ZAHL_PAYLOAD) await loadScript(SHEETJS + 'xlsx.zahl.js'); // 產生 .numbers 需要的範本
    if (!window.XLSX || (needNumbers && !window.XLSX_ZAHL_PAYLOAD)) throw new Error('XLSX missing');
    return window.XLSX;
  }
  function downloadBlob(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function openYearExportMenu(anchor) {
    showInlineDD(anchor, [{value:'numbers',cls:'',label:'Numbers'},{value:'xlsx',cls:'',label:'Excel'}], exportYear);
  }
  async function exportYear(kind) {
    const year = document.getElementById('yr-year').value;
    const entries = cashEvents().filter(e => e.date.startsWith(year)).sort((a,b) => a.date.localeCompare(b.date));
    if (!entries.length) { showToast(`${year} 年沒有可匯出的入帳紀錄`); return; }
    const rows = [['月份','專案名稱','款項','客戶','類別','入帳日期','含稅金額','營業額（未稅）','成本支出','淨收入']];
    entries.forEach(e => rows.push([+e.date.slice(5,7)+'月', e.c.name, e.part, e.c.client||'', e.c.category||'', e.date, e.gross, e.inc, e.exp, e.inc-e.exp]));
    const inc = entries.reduce((s,e)=>s+e.inc,0), exp = entries.reduce((s,e)=>s+e.exp,0);
    rows.push(['合計','','','','','',entries.reduce((s,e)=>s+e.gross,0),inc,exp,inc-exp]);
    const isNumbers = kind === 'numbers', label = isNumbers ? 'Numbers' : 'Excel';
    showToast(`正在產生 ${label} 檔…`);
    try {
      const XLSX = await loadXLSX(isNumbers);
      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = [{wch:6},{wch:34},{wch:6},{wch:24},{wch:8},{wch:12},{wch:12},{wch:14},{wch:12},{wch:12}];
      for (let r = 1; r < rows.length; r++) for (const col of ['G','H','I','J']) { const cell = ws[col+(r+1)]; if (cell) cell.z = '#,##0'; }
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, `${year}年`);
      const buf = isNumbers
        ? XLSX.write(wb, { bookType:'numbers', type:'array', numbers: window.XLSX_ZAHL_PAYLOAD, compression:true })
        : XLSX.write(wb, { bookType:'xlsx', type:'array' });
      const mime = isNumbers ? 'application/x-iwork-numbers-sffnumbers' : 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
      downloadBlob(new Blob([buf], { type: mime }), `全年收入-${year}.${isNumbers?'numbers':'xlsx'}`);
      showToast(`已下載 ${year} 年 ${label} 檔（${entries.length} 個專案）✓`);
    } catch (e) {
      const cell = v => { const t = String(v ?? ''); return /[",\n]/.test(t) ? '"' + t.replace(/"/g,'""') + '"' : t; };
      downloadBlob(new Blob(['\uFEFF' + rows.map(r => r.map(cell).join(',')).join('\r\n')], { type:'text/csv;charset=utf-8' }), `全年收入-${year}.csv`);
      showToast(`${label} 檔產生失敗，已改下載 CSV`);
    }
  }
  // ── 客戶頁：這個客戶的所有案件（不分年度）、已入帳的營業額、日均、收款速度、最近用過的發票資訊 ──
  function openClient(name) {
    name = (name||'').trim(); if (!name) return;
    const when = c => c.end_date || c.start_date || (c.created_at||'').slice(0,10);
    const list = cases.filter(c => (c.client||'').trim() === name).sort((a,b) => when(b).localeCompare(when(a)));
    const paid = yearEntries().filter(e => (e.c.client||'').trim() === name);
    const inc = cashEvents().filter(e => (e.c.client||'').trim() === name).reduce((s,e)=>s+e.inc,0), d = dailyOf(paid), l = lagOf(paid);
    const due = list.filter(c => (c.status === '已完成' || c.status === '進行中') && Number(c.quote_amount) > 0).reduce((s,c)=>s+amountDue(c),0);
    const inv = (list.map(caseInvoice).find(v => INVOICE_SHARED.some(k => v[k])) || null);
    const money = n => '$' + n.toLocaleString();
    const invRows = inv ? [['抬頭',inv.header],['統編',inv.tax_id],['類型',inv.kind],['收件人',inv.recipient],['電話',inv.phone],['地址',inv.address]].filter(r => r[1]) : [];
    const range = c => c.start_date ? `${+c.start_date.slice(0,4)}/${+c.start_date.slice(5,7)}/${+c.start_date.slice(8,10)}` : '未排日期';
    document.getElementById('cl-title').textContent = name;
    document.getElementById('cl-body').innerHTML = `
      <div class="yr-stats">
        <div class="yr-card"><div class="yr-label">已入帳營業額（未稅）</div><div class="yr-value c-income">${money(inc)}</div></div>
        <div class="yr-card"><div class="yr-label">平均日均收入</div><div class="yr-value ${d ? (d.daily >= DAILY_GOOD ? 'c-income' : 'c-expense') : ''}">${d ? money(d.daily) : '—'}</div></div>
        <div class="yr-card"><div class="yr-label">結案後幾天收款</div><div class="yr-value">${l ? (l.avg > 0 ? l.avg + ' 天' : '當天') : '—'}</div></div>
      </div>
      <div class="bd-sub" style="margin:-4px 0 4px">共 ${list.length} 個案件，其中 ${paid.length} 個已完成並結清${due ? `；目前待收 ${money(due)}` : ''}。${d ? `平均每案做 ${d.avgDays} 天。` : ''}</div>
      ${invRows.length ? `<div class="rv-sec"><div class="bd-title">發票資訊</div><div class="cl-info">${invRows.map(r => `<div><span>${r[0]}</span>${esc(r[1])}</div>`).join('')}</div></div>` : ''}
      <div class="rv-sec"><div class="bd-title">案件（${list.length}）</div>
        ${list.map(c => `<div class="rv-item" onclick="clOpenCase('${c.id}')"><span class="rv-name">${esc(c.name)}</span><small>${c.status}・${payLabel(c.payment_status)||'—'}・${range(c)}</small><b>${Number(c.quote_amount) ? money(Number(c.quote_amount)) : '—'}</b></div>`).join('')}
      </div>`;
    document.getElementById('cl-modal').classList.add('open');
  }
  function closeClient() { document.getElementById('cl-modal').classList.remove('open'); }
  function clOpenCase(id) {
    const c = cases.find(x=>x.id===id); if (!c) return;
    closeClient(); closeYearModal();
    if (!inViewYear(c)) viewYear = caseYear(c);
    if (viewingId !== id) openPanel(id); else renderAll();
  }
  function closeYearModal() { document.getElementById('yr-modal').classList.remove('open'); }
  function yrOpenCase(id) {
    const c = cases.find(x=>x.id===id); if (!c) return;
    closeYearModal();
    if (!inViewYear(c)) viewYear = caseYear(c);
    if (viewingId !== id) openPanel(id); else renderAll();
  }
  // 日均＝淨收入合計 ÷ 天數合計（只算有填起訖日期的）；收款天數＝尾款收款日期 − 結束日期（兩個都有填才算）
  const dailyOf = list => {
    const timed = list.filter(e => caseDays(e.c)), days = timed.reduce((s,e)=>s+caseDays(e.c),0);
    return days ? { daily: Math.round(timed.reduce((s,e)=>s+e.inc-e.exp,0)/days), avgDays: Math.round(days/timed.length) } : null;
  };
  const lagOf = list => {
    const lags = list.filter(e => casePaidDate(e.c) && e.c.end_date).map(e => Math.round((new Date(casePaidDate(e.c)+'T00:00:00') - new Date(e.c.end_date+'T00:00:00'))/86400000));
    return lags.length ? { n: lags.length, avg: Math.round(lags.reduce((s,d)=>s+d,0)/lags.length) } : null;
  };
  function renderYearStats() {
    const year = document.getElementById('yr-year').value;
    // events：實際入帳（算營業額）；entries：已完成且已結清的專案（算日均、結案件數）
    const events = cashEvents().filter(e => e.date.startsWith(year));
    const entries = yearEntries().filter(e => e.date.startsWith(year));
    const months = Array.from({length:12}, (_,i) => {
      const k = `${year}-${String(i+1).padStart(2,'0')}`;
      const mE = events.filter(e => e.date.startsWith(k));
      const inc = mE.reduce((s,e)=>s+e.inc,0), exp = mE.reduce((s,e)=>s+e.exp,0);
      return { m:i+1, inc, exp, bal:inc-exp };
    });
    const inc = months.reduce((s,m)=>s+m.inc,0), exp = months.reduce((s,m)=>s+m.exp,0), bal = inc-exp;
    const money = n => (n<0?'-':'') + '$' + Math.abs(n).toLocaleString();
    document.getElementById('yr-income').textContent = money(inc);
    const gross = events.reduce((s,e)=>s+e.gross,0);
    document.getElementById('yr-gross').textContent = gross ? `含稅 ${money(gross)}` : '';
    document.getElementById('yr-expense').textContent = money(exp);
    const bEl = document.getElementById('yr-balance');
    bEl.textContent = money(bal);
    bEl.className = 'yr-value' + (bal>0?' c-income':bal<0?' c-expense':'');
    // 平均月薪＝淨收入 ÷ 月數：今年除以目前過了幾個月（10 月就除以 10），過去的年份除以 12
    const nowD = new Date(), monthsSoFar = +year < nowD.getFullYear() ? 12 : +year === nowD.getFullYear() ? nowD.getMonth() + 1 : 0;
    document.getElementById('yr-monthly').textContent = monthsSoFar && bal ? `平均月薪 ${money(Math.round(bal / monthsSoFar))}` : '';
    const maxV = Math.max(...months.map(m=>Math.max(m.inc,m.exp)), 1);
    document.getElementById('yr-chart').innerHTML =
      `<div class="mc-legend">
        <div class="mc-legend-item"><div class="mc-dot" style="background:#4CAF50"></div>營業額</div>
        <div class="mc-legend-item"><div class="mc-dot" style="background:#EF5350"></div>成本支出</div>
        <div class="mc-legend-item"><div class="mc-dot" style="background:#BBB"></div>淨收入</div>
      </div>` +
      months.map(m => {
        const dim = m.inc===0 && m.exp===0;
        const iW = Math.round(m.inc/maxV*100), eW = Math.round(m.exp/maxV*100);
        const balCol = m.bal>0?'#2E7D32':m.bal<0?'#C62828':'#BBB';
        return `<div class="mc-row${dim?' mc-dim':''}">
          <div class="mc-label">${m.m}月</div>
          <div class="mc-bars">
            <div class="mc-bar-wrap"><div class="mc-bar mc-bar-income" style="width:${iW}%"></div></div>
            <div class="mc-bar-wrap"><div class="mc-bar mc-bar-expense" style="width:${eW}%"></div></div>
          </div>
          <div class="mc-amounts">
            <span class="c-income" style="font-size:0.62rem;opacity:0.75">${m.inc>0?'$'+m.inc.toLocaleString():'—'}</span>
            <span class="c-expense" style="font-size:0.62rem;opacity:0.75">${m.exp>0?'$'+m.exp.toLocaleString():'—'}</span>
            <span style="color:${balCol};font-size:0.88rem;font-weight:700;margin-top:1px">${dim?'—':(m.bal>0?'+':'')+money(m.bal)}</span>
          </div>
        </div>`;
      }).join('');
    // ── 年度復盤 ──
    // 日均一律用「淨收入合計 ÷ 天數合計」，只算有填起訖日期的專案；收款天數＝收款日期 − 結束日期，只算兩個都有填的
    const dailyHTML = d => `<b class="${d >= DAILY_GOOD ? 'c-income' : 'c-expense'}">${money(d)}</b>`;
    const lagText = l => l.avg > 0 ? `結案後平均 ${l.avg} 天收款` : '結案當天或之前就收款';

    // 1. 跟去年比
    const prevYear = String(+year - 1);
    const prevEntries = yearEntries().filter(e => e.date.startsWith(prevYear)), prevEvents = cashEvents().filter(e => e.date.startsWith(prevYear));
    const sum = (ev, list) => { const i = ev.reduce((s,e)=>s+e.inc,0); return { n: list.length, inc: i, net: i - ev.reduce((s,e)=>s+e.exp,0), per: list.length ? Math.round(list.reduce((s,e)=>s+e.inc,0)/list.length) : null, daily: (dailyOf(list)||{}).daily }; };
    const cur = sum(events, entries), prev = sum(prevEvents, prevEntries), hasPrev = prevEvents.length > 0 || prev.n > 0;
    const diff = (a, b, isCount) => {
      if (!hasPrev || a == null || b == null) return '—';
      if (a === b) return '持平';
      const up = a > b, txt = isCount ? Math.abs(a-b) + ' 案' : (b ? Math.round(Math.abs(a-b)/Math.abs(b)*100) + '%' : '');
      return `<span class="${up?'c-income':'c-expense'}">${up?'▲':'▼'} ${txt}</span>`;
    };
    const cmpRow = (label, a, b, isCount, cls = '') => `<tr><td>${label}</td><td class="${cls}">${a == null ? '—' : isCount ? a + ' 案' : money(a)}</td><td class="rv-prev">${!hasPrev || b == null ? '—' : isCount ? b + ' 案' : money(b)}</td><td class="rv-diff">${diff(a, b, isCount)}</td></tr>`;
    const compareHTML = !events.length && !entries.length && !hasPrev ? '' :
      `<div class="bd-title">跟去年比</div>
      <table class="rv-table"><tr><th></th><th>${year} 年</th><th>${prevYear} 年</th><th>變化</th></tr>
        ${cmpRow('營業額', cur.inc, prev.inc)}${cmpRow('淨收入', cur.net, prev.net, false, cur.net < 0 ? 'c-expense' : 'c-income')}${cmpRow('結案件數', cur.n, prev.n, true)}${cmpRow('平均每案金額', cur.per, prev.per)}${cmpRow('平均日均收入', cur.daily, prev.daily)}
      </table>` + (hasPrev ? '' : `<div class="bd-sub" style="margin-top:8px">${prevYear} 年沒有入帳紀錄，暫時沒得比。</div>`);

    // 2. 類別／客戶／來源：各自的營業額、佔比、專案數，下方小字是日均與平均天數（客戶多一項收款速度）
    const group = keyOf => {
      const map = new Map();
      const get = c => { const k = keyOf(c); if (!map.has(k)) map.set(k, { k, inc:0, ids:new Set(), list:[] }); return map.get(k); };
      events.forEach(e => { const g = get(e.c); g.inc += e.inc; g.ids.add(e.c.id); });   // 營業額：實際入帳
      entries.forEach(e => { const g = get(e.c); g.list.push(e); g.ids.add(e.c.id); });  // 日均、收款速度：已結案的
      return [...map.values()].map(g => ({ ...g, n: g.ids.size })).sort((a,b) => b.inc - a.inc);
    };
    const section = (title, rows, withLag, lead = '') => {
      if (!rows.length) return '';
      const top = Math.max(...rows.map(r=>r.inc), 1);
      return `<div class="bd-title">${title}</div>${lead}` + rows.map(r => {
        const d = dailyOf(r.list), l = withLag && lagOf(r.list);
        const sub = [d && `日均 ${dailyHTML(d.daily)}`, d && `平均 ${d.avgDays} 天`, l && lagText(l)].filter(Boolean).join('・');
        // 只有頭款入帳、還沒有結案的專案：寫明原因，不要留空（不然看起來像跟下一列共用同一行小字）
        const none = !r.list.length ? '未結案' : !d ? '沒填起訖日期，算不出日均' : '';
        const link = withLag && r.k !== '未填客戶' ? ` clickable" data-client="${esc(r.k).replace(/"/g,'&quot;')}" onclick="openClient(this.dataset.client)` : '';
        return `<div class="bd-row${link}">
          <div class="bd-label" title="${esc(r.k).replace(/"/g,'&quot;')}"><span>${esc(r.k)}</span><small>${r.n} 案</small></div>
          <div class="bd-bar-wrap"><div class="mc-bar mc-bar-income" style="width:${Math.round(r.inc/top*100)}%"></div></div>
          <div class="bd-amt">$${r.inc.toLocaleString()}<small>${inc ? Math.round(r.inc/inc*100) : 0}%</small></div>
        </div><div class="bd-sub">${sub || none}</div>`;
      }).join('');
    };
    const byCat = group(c => c.category || '其他');
    const byClient = group(c => (c.client||'').trim() || '未填客戶');
    const bySource = group(c => caseMeta(c).source || '未填來源');
    const allLag = lagOf(entries);
    const lagLead = `<div class="bd-sub rv-lead">${allLag ? `有填尾款收款日期的 ${allLag.n} 案，${lagText(allLag)}。` : '專案填了尾款的收款日期後，這裡會算出每個客戶結案後幾天付款。'}</div>`;

    // 3. 日均沒達標的案件
    const low = entries.filter(e => caseDays(e.c)).map(e => ({ e, d: Math.round((e.inc-e.exp)/caseDays(e.c)) })).filter(x => x.d < DAILY_GOOD).sort((a,b) => a.d - b.d);
    const lowHTML = !entries.some(e => caseDays(e.c)) ? '' :
      `<div class="bd-title">日均低於 $${DAILY_GOOD.toLocaleString()} 的案件（${low.length}）</div>` +
      (low.length ? low.map(x => `<div class="rv-item" onclick="yrOpenCase('${x.e.c.id}')"><span class="rv-name">${esc(x.e.c.name)}</span><small>${esc((x.e.c.category||'其他'))}・${caseDays(x.e.c)} 天</small><b class="c-expense">${money(x.d)}</b></div>`).join('')
                  : `<div class="bd-sub rv-lead">這一年每個案件的日均都有達到 $${DAILY_GOOD.toLocaleString()}。</div>`);

    // 4. 接洽結果：這一年的專案（不限已結清）。成交＝進行中或已完成、而且有收費（互惠、沒報價的不算，暫停的也不列入）；終止的依原因統計
    const yCases = cases.filter(c => caseYear(c) === year);
    const charged = c => (Number(c.quote_amount)||0) > 0 && c.payment_status !== '互惠';
    const won = yCases.filter(c => ['進行中','已完成'].includes(c.status) && charged(c)).length;
    const lost = yCases.filter(c => c.status === '終止'), open = yCases.filter(c => c.status === '接洽中').length;
    const reasons = new Map(); lost.forEach(c => { const k = caseMeta(c).lost || '未填原因'; reasons.set(k, (reasons.get(k)||0) + 1); });
    const reasonRows = [...reasons].sort((a,b) => b[1]-a[1]);
    const dealHTML = !(won + lost.length) ? '' :
      `<div class="bd-title">接洽結果</div>
      <div class="bd-sub rv-lead">成交 ${won} 案・終止 ${lost.length} 案${open ? `・還在談 ${open} 案` : ''}，成交率 <b style="color:#444">${Math.round(won/(won+lost.length)*100)}%</b><br>成交只算進行中或已完成、而且有收費的案件；互惠、沒填報價、暫停的不列入。</div>` +
      reasonRows.map(([k,n]) => `<div class="bd-row">
          <div class="bd-label"><span>${esc(k)}</span></div>
          <div class="bd-bar-wrap"><div class="mc-bar" style="width:${Math.round(n/reasonRows[0][1]*100)}%;background:#BBB"></div></div>
          <div class="bd-count">${n} 案</div>
        </div>`).join('');

    document.getElementById('yr-breakdown').innerHTML = [compareHTML, section('類別收入', byCat), section('客戶收入', byClient, true, lagLead), section('案件來源', bySource), lowHTML, dealHTML]
      .filter(Boolean).map(h => `<div class="rv-sec">${h}</div>`).join('');
    document.getElementById('yr-note').textContent = `營業額照實際入帳計算：頭款算在頭款收款日那個月，尾款算在尾款收款日那個月（沒填就算結束日期那個月），案件還沒結案也算；已收頭款但沒填頭款收款日期的先不計。成本算在尾款那個月。日均、結案件數、平均每案金額只看「已完成」且「已結清」的專案，${year} 年共 ${entries.length} 個。金額都是未稅（報價 ÷ 1.05），成本照你填的數字扣。`;
  }

  // ── 發票資訊（存在 tasks 欄位裡的 type:'invoice'）──────
  const INVOICE_FIELDS = { title:'iv-title', header:'iv-header', tax_id:'iv-taxid', total:'iv-total', recipient:'iv-recipient', phone:'iv-phone', address:'iv-address' };
  function caseInvoice(c) { return parseTasks(c.tasks).find(t=>t.type==='invoice') || {}; }
  function pickInvoiceKind(btn) {
    const on = btn.classList.contains('on');
    document.querySelectorAll('#iv-kinds .inv-kind').forEach(b=>b.classList.remove('on'));
    if (!on) btn.classList.add('on');
  }
  function openInvoiceModal() {
    const c = cases.find(x=>x.id===viewingId); if (!c) return;
    const inv = caseInvoice(c);
    for (const [k,id] of Object.entries(INVOICE_FIELDS)) document.getElementById(id).value = inv[k] || '';
    // 含稅總金額還沒填過，就先放這個專案自己的報價
    const total = Number(inv.total) || Number(c.quote_amount) || 0;
    document.getElementById('iv-total').value = total ? total.toLocaleString() : '';
    document.querySelectorAll('#iv-kinds .inv-kind').forEach(b=>b.classList.toggle('on', b.dataset.v===inv.kind));
    const from = invoiceFromClient(c);
    const hint = document.getElementById('iv-hint');
    hint.style.display = from ? '' : 'none';
    if (from) hint.innerHTML = `<span>${esc(c.client.trim())} 之前填過發票資訊</span><button type="button" onclick="applyClientInvoice()">帶入</button>`;
    document.getElementById('inv-modal').classList.add('open');
  }
  // 同一個客戶在別的專案填過的發票資訊：帶固定不變的欄位，名目還空著也一併帶；含稅總金額不帶（用這個專案自己的報價），取日期最近的那個專案；
  // 跟目前這個專案已存的內容一樣就不提示
  const INVOICE_SHARED = ['header','tax_id','kind','recipient','phone','address'];
  function invoiceFromClient(c) {
    const client = (c.client||'').trim(); if (!client) return null;
    const when = x => x.end_date || x.start_date || (x.created_at||'').slice(0,10);
    const mine = caseInvoice(c);
    const hit = cases.filter(x => x.id !== c.id && (x.client||'').trim() === client)
      .map(x => ({ x, inv: caseInvoice(x) })).filter(o => INVOICE_SHARED.some(k => o.inv[k]))
      .sort((a,b) => when(b.x).localeCompare(when(a.x)))[0];
    return hit && INVOICE_SHARED.some(k => (hit.inv[k]||'') !== (mine[k]||'')) ? hit.inv : null;
  }
  function applyClientInvoice() {
    const c = cases.find(x=>x.id===viewingId); if (!c) return;
    const inv = invoiceFromClient(c); if (!inv) return;
    for (const k of INVOICE_SHARED) if (INVOICE_FIELDS[k]) document.getElementById(INVOICE_FIELDS[k]).value = inv[k] || '';
    document.querySelectorAll('#iv-kinds .inv-kind').forEach(b=>b.classList.toggle('on', b.dataset.v===inv.kind));
    const title = document.getElementById('iv-title');
    if (!title.value.trim() && inv.title) title.value = inv.title; // 名目：這裡還空著才帶上一次的
    document.getElementById('iv-hint').style.display = 'none';
    showToast('已帶入，確認後記得按儲存');
  }
  // 把目前視窗裡填的內容（不必先儲存）組成一段文字複製，方便貼到 LINE 跟客戶確認
  function invoiceText() {
    const v = id => document.getElementById(id).value.trim();
    const total = Math.round(Number(v('iv-total').replace(/[^\d.]/g,''))) || 0;
    const kind = document.querySelector('#iv-kinds .inv-kind.on')?.dataset.v || '';
    return [
      `名目：${v('iv-title')}`,
      `抬頭：${v('iv-header')}`,
      `含稅總金額 ${total ? total.toLocaleString()+'元' : ''}`,
      `統編：${v('iv-taxid')}`,
      '',
      `類型：${kind}`,
      `收件人：${v('iv-recipient')}`,
      `電話：${v('iv-phone')}`,
      `發票寄送地址：${v('iv-address')}`,
    ].join('\n');
  }
  async function exportInvoiceText() {
    const text = invoiceText();
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
      ta.remove();
      if (!ok) { showToast('⚠ 複製失敗，請手動選取文字'); return; }
    }
    showToast('已複製，可以貼到 LINE ✓');
  }
  function closeInvoiceModal() { document.getElementById('inv-modal').classList.remove('open'); }
  function saveInvoiceInfo() {
    const c = cases.find(x=>x.id===viewingId); if (!c) return;
    const inv = { type:'invoice' };
    for (const [k,id] of Object.entries(INVOICE_FIELDS)) inv[k] = document.getElementById(id).value.trim();
    inv.total = Math.round(Number(inv.total.replace(/[^\d.]/g,''))) || 0;
    inv.kind = document.querySelector('#iv-kinds .inv-kind.on')?.dataset.v || '';
    const all = parseTasks(c.tasks).filter(t=>t.type!=='invoice');
    c.tasks = JSON.stringify([...all, inv]);
    closeInvoiceModal(); showToast('發票資訊已儲存 ✓'); syncTasks(c);
  }
  function savePanelTitle(el) {
    const c = cases.find(x=>x.id===viewingId); if (!c) return;
    const name = el.innerText.replace(/\s+/g,' ').trim();
    if (!name) { el.textContent = c.name; return; }
    el.textContent = name;
    if (name !== c.name) savePanelField('name', { value: name });
  }

  // 面板內直接編輯客戶／報價：不重畫整個面板，免得點到另一格時游標跑掉
  // 報價：存的是含稅金額，未稅＝含稅 ÷ 1.05。兩個都能改，改哪一個另一個就跟著換算
  const moneyWidth = txt => `calc(${Math.max(txt.length, 4)}ch + 14px)`;
  function quoteText(c, kind) {
    const gross = Number(c.quote_amount) || 0, n = kind === 'net' ? Math.round(gross / (1 + TAX_RATE)) : gross;
    return n ? '$' + n.toLocaleString() : '';
  }
  function saveQuote(kind, input) {
    const c = cases.find(x=>x.id===viewingId); if (!c) return;
    const typed = Math.round(Number(input.value.replace(/[^\d.]/g,''))) || 0;
    const shown = Math.round(Number(quoteText(c, kind).replace(/[^\d.]/g,''))) || 0;
    // 沒改數字就不重算，免得未稅來回換算差 1 元
    if (typed !== shown) savePanelField('quote_amount', { value: String(kind === 'net' ? Math.round(typed * (1 + TAX_RATE)) : typed) });
    for (const k of ['gross','net']) { const el = document.getElementById('q-' + k); if (el) { el.value = quoteText(c, k); el.style.width = moneyWidth(el.value); } }
    // 報價變了，下面的頭款、尾款金額也要跟著更新
    const rec = document.querySelector('#panel-scroll .pay-col input');
    if (rec) { rec.value = receivedText(c); rec.style.width = receivedWidth(c); }
    const dep = document.getElementById('dep-hint'); if (dep) dep.textContent = depositHintHTML(c);
    const hint = document.getElementById('due-hint'); if (hint) { hint.textContent = dueHintHTML(c); hint.style.color = tailColor(c); }
  }
  async function savePanelField(field, input) {
    const c = cases.find(x=>x.id===viewingId); if (!c) return;
    let value = input.value.trim();
    if (field === 'quote_amount') {
      value = Math.round(Number(value.replace(/[^\d.]/g,''))) || 0;
      input.value = value ? '$' + value.toLocaleString() : '';
    }
    if ((c[field] || (field==='quote_amount'?0:'')) === value) return;
    c[field] = value; saveLocal(); renderAll();
    const avg = document.querySelector('#panel-scroll .month-avg'); if (avg) avg.outerHTML = monthAvgHTML(c);
    if (db) { setSyncDot('loading'); try { const{error}=await db.from('cases').update({[field]:value}).eq('id',c.id); setSyncDot(error?'err':'ok'); if(error) showToast('⚠ 雲端同步失敗：'+error.message); } catch(e){setSyncDot('err');} }
  }

  // ── Render all ────────────────────────────
  // 首頁排序：名稱開頭的編號由小到大（015-1 排在 015 後面、016 前面）；沒有編號的排最前面，依筆劃
  const strokeOrder = new Intl.Collator('zh-Hant-u-co-stroke');
  function caseNo(c) { const m = (c.name||'').trim().match(/^(\d+)(?:\s*-\s*(\d+))?/); return m ? [+m[1], m[2] ? +m[2] : 0] : null; }
  function byCaseNo(a, b) {
    const x = caseNo(a), y = caseNo(b);
    if (!x || !y) return x ? 1 : y ? -1 : strokeOrder.compare(a.name||'', b.name||'');
    return x[0] - y[0] || x[1] - y[1] || strokeOrder.compare(a.name||'', b.name||'');
  }
  function renderAll() {
    const q = document.getElementById('search-input').value.trim().toLowerCase();
    let list = q ? cases.filter(c=>(c.name||'').toLowerCase().includes(q)||(c.client||'').toLowerCase().includes(q)) : [...cases];
    const years = [...new Set([String(new Date().getFullYear()), ...cases.map(caseYear)])].sort((a,b)=>b.localeCompare(a));
    if (viewYear !== 'all' && !years.includes(viewYear)) years.push(viewYear);
    viewYears = years;
    document.getElementById('year-select').textContent = (viewYear === 'all' ? '全部' : viewYear + '年') + ' ▾';
    list = list.filter(inViewYear).sort(byCaseNo);
    document.getElementById('client-list').innerHTML = [...new Set(cases.map(c=>(c.client||'').trim()).filter(Boolean))].sort().map(n=>`<option value="${esc(n).replace(/"/g,'&quot;')}">`).join('');
    updateBackupWarn();
    const rcN = receivables().length;
    document.getElementById('rc-count').textContent = rcN || '';
    let bar = '';
    if (missingOnly) {
      const miss = cases.filter(inViewYear).filter(isMissing);
      list = list.filter(isMissing);
      bar = `<div class="filter-bar"><span>只顯示缺資料的專案：缺日期 ${miss.filter(c=>missingWhat(c).includes('缺日期')).length} 個・缺報價 ${miss.filter(c=>missingWhat(c).includes('缺報價')).length} 個・已收頭款沒填收款日期 ${miss.filter(c=>missingWhat(c).includes('缺頭款收款日期')).length} 個</span><button onclick="missingOnly=false;renderAll()">顯示全部</button></div>`;
    }
    const con = document.getElementById('groups-container');
    if (!cases.length) { con.innerHTML='<div class="empty" style="margin-top:60px">還沒有專案<br><small>點右上角「＋ 新增專案」開始</small></div>'; return; }
    con.innerHTML = bar + STATUS_ORDER.map(s => {
      const grp = list.filter(c=>c.status===s);
      const col = collapsed[s];
      return `<div class="status-group">
        <div class="group-header" onclick="toggleGroup('${s}')">
          <span class="group-arrow${col?' collapsed':''}">▼</span>
          <span class="pill pill-${s}"><span class="pill-dot pill-dot-${s}"></span>${s}</span>
          <span class="group-count">${grp.length}</span>
        </div>
        ${col ? '' : renderGroupBody(s,grp)}
      </div>`;
    }).join('');
  }

  function renderGroupBody(status, group) {
    const rows = group.map(c => {
      const num  = caseNumber(c);
      const date = c.start_date && c.end_date ? `${fmtDate(c.start_date)} → ${fmtDate(c.end_date)}` : fmtDate(c.start_date)||'';
      const pri  = c.priority||'中';
      const sel  = viewingId===c.id ? ' selected' : '';
      return `<div class="table-row${sel}" onclick="openPanel('${c.id}')">
        <div class="td td-name">
          <span class="td-icon">📄</span>
          <span class="td-text">${esc(c.name)}</span>
          ${missingOnly ? missingWhat(c).map(m=>`<span class="miss-tag">${m}</span>`).join('') : ''}
        </div>
        <div class="td">
          <span class="badge b-${status}" onclick="event.stopPropagation();showInlineDD(this,STATUS_DD_ITEMS,v=>updateField('${c.id}','status',v))">
            <span class="b-dot bd-${status}"></span>${status}
          </span>
        </div>
        <div class="td" onclick="event.stopPropagation();showInlineDD(this,INVOICE_DD_ITEMS,v=>updateField('${c.id}','invoice',v))" style="cursor:pointer">
          ${c.invoice ? `<span class="badge b-inv-${c.invoice}">${c.invoice}</span>` : '<span style="color:#DDD;font-size:0.8rem">—</span>'}
        </div>
        <div class="td td-date" style="cursor:pointer" onclick="event.stopPropagation();showDateRangePicker(this,'${c.id}')">${date||'<span style="color:#DDD">選擇日期</span>'}</div>
        <div class="td">
          <span class="badge b-pay-${payLabel(c.payment_status)||'未收款'}" onclick="event.stopPropagation();showInlineDD(this,PAY_DD_ITEMS,v=>updateField('${c.id}','payment_status',v))">${payLabel(c.payment_status)||'未收款'}</span>
        </div>
        <div class="td">
          <span class="badge b-pri-${pri}" onclick="event.stopPropagation();showInlineDD(this,PRIORITY_DD_ITEMS,v=>updateField('${c.id}','priority',v))">${pri}</span>
        </div>
        <div class="td td-note" style="text-align:right;padding-right:12px">${c.quote_amount?('NT$ '+Number(c.quote_amount).toLocaleString()):''}</div>
        <div class="td">
          <span class="badge cat-tag b-cat-${c.category||'其他'}" onclick="event.stopPropagation();showInlineDD(this,CAT_DD_ITEMS,v=>updateField('${c.id}','category',v))">${c.category||'其他'}</span>
        </div>
      </div>`;
    }).join('');

    const total = group.reduce((s,c)=>s+(Number(c.quote_amount)||0),0);

    return `<div class="proj-table">
      <div class="table-head">
        <div class="th">專案名稱</div><div class="th">狀態</div>
        <div class="th">發票</div>
        <div class="th">日期</div><div class="th">付款</div>
        <div class="th">優先級</div><div class="th" style="text-align:right;padding-right:12px;white-space:nowrap">報價（含稅）</div><div class="th">類別</div>
      </div>
      ${rows||'<div class="empty" style="padding:16px 0">此分類無專案</div>'}
      <button class="btn-add-row" onclick="openModalForStatus('${status}')">＋ 新專案</button>
    </div>
    <div class="group-total">Total NT$ ${total.toLocaleString()}</div>`;
  }

  function toggleGroup(s) { collapsed[s]=!collapsed[s]; renderAll(); }

  // ── Panel ─────────────────────────────────
  function openPanel(id) {
    if (viewingId === id) { closePanel(); return; }
    viewingId = id; renderAll(); renderPanel();
    document.getElementById('app-wrap').classList.add('open');
  }
  function closePanel() {
    viewingId = null;
    const wrap = document.getElementById('app-wrap');
    wrap.classList.remove('open');
    wrap.classList.add('was-open');
    setTimeout(() => {
      wrap.classList.remove('was-open');
      renderAll();
    }, 400);
  }

  function renderPanel() {
    const c = cases.find(x=>x.id===viewingId); if (!c) return;
    const num = caseNumber(c);
    const tasks = parseTasks(c.tasks).filter(t=>!t.type);
    const costs = caseCosts(c);
    const costRows = costs.map((t,i) => `
      <div class="task-row cost">
        <div class="task-name-cell">
          <span class="task-icon-sm">${i+1}</span>
          <input class="task-name-input" placeholder="添加" value="${esc(t.name)}" onblur="updateCost(${i},'name',this.value)" onkeydown="if(event.key==='Enter'&&!event.isComposing)this.blur()">
        </div>
        <div class="cost-amt-cell">
          <input class="task-name-input" inputmode="numeric" placeholder="0" value="${Number(t.amount)?Number(t.amount).toLocaleString():''}" onfocus="this.value=this.value.replace(/,/g,'')" onblur="updateCost(${i},'amount',this.value)" onkeydown="if(event.key==='Enter'&&!event.isComposing)this.blur()">
          <button class="task-del" onclick="deleteCost(${i})">✕</button>
        </div>
      </div>`).join('');

    const taskRows = tasks.map((t,i) => `
      <div class="task-row">
        <div class="task-name-cell">
          <span class="task-icon-sm">${i+1}</span>
          <input class="task-name-input" placeholder="添加" value="${esc(t.name)}" onblur="updateTaskName(${i},this.value)" onkeydown="if(event.key==='Enter'&&!event.isComposing)this.blur()">
        </div>
        <div class="task-st-cell">
          <span class="badge b-task-${t.status}" onclick="showInlineDD(this,TASK_STATUS_ITEMS,v=>setTaskStatus(${i},v))">${t.status}</span>
          <button class="task-del" onclick="deleteTask(${i})">✕</button>
        </div>
        <div class="task-note-cell">
          <input class="task-note-input" value="${esc(t.note||'')}" placeholder="添加" onblur="updateTaskNote(${i},this.value)" onkeydown="if(event.key==='Enter'&&!event.isComposing)this.blur()">
        </div>
        <div class="task-date-cell" onclick="event.stopPropagation();var inp=this.querySelector('input[type=date]');try{inp.showPicker();}catch(e){inp.focus();}">

  // ── Tasks ─────────────────────────────────
  async function syncTasks(c) {
    saveLocal();
    if (!db) return;
    setSyncDot('loading');
    try { const{error}=await db.from('cases').update({tasks:c.tasks}).eq('id',c.id); setSyncDot(error?'err':'ok'); } catch(e){setSyncDot('err');}
  }
  function addTask() {
    const c=cases.find(x=>x.id===viewingId); if(!c)return;
    const t=parseTasks(c.tasks); const at=t.filter(x=>!x.type).length;
    t.splice(at,0,{id:Date.now().toString(),name:'',status:'未開始',note:'',date:''});
    c.tasks=JSON.stringify(t); renderPanel(); syncTasks(c);
  }
  // 成本明細（type:'cost'）、發票資訊（type:'invoice'）跟項目存在同一個 tasks 欄位，永遠排在項目後面
  function writeCosts(c, costs, rerender=true) {
    const all = parseTasks(c.tasks);
    c.tasks = JSON.stringify([...all.filter(x=>!x.type), ...costs, ...all.filter(x=>x.type && x.type!=='cost')]);
    if (rerender) renderPanel();
    syncTasks(c);
  }
  function addCost() {
    const c=cases.find(x=>x.id===viewingId); if(!c)return;
    writeCosts(c, [...caseCosts(c), {id:Date.now().toString(),type:'cost',name:'',amount:0}]);
  }
  function updateCost(idx, field, value) {
    const c=cases.find(x=>x.id===viewingId); if(!c)return;
    const costs=caseCosts(c); if(!costs[idx])return;
    costs[idx][field] = field==='amount' ? (Math.round(Number(String(value).replace(/[^\d.]/g,'')))||0) : value;
    // 不整個重畫，免得從「項目」點到「花費」時游標跑掉；只更新金額、合計、日均
    writeCosts(c, costs, false);
    const panel = document.getElementById('panel-scroll');
    const amt = panel.querySelectorAll('.task-row.cost .cost-amt-cell input')[idx];
    if (amt && document.activeElement !== amt) amt.value = Number(costs[idx].amount) ? Number(costs[idx].amount).toLocaleString() : '';
    const tot = panel.querySelector('.cost-total b'); if (tot) tot.textContent = 'NT$ ' + costTotal(c).toLocaleString();
    const avg = panel.querySelector('.month-avg'); if (avg) avg.outerHTML = monthAvgHTML(c);
  }
  function deleteCost(idx) {
    const c=cases.find(x=>x.id===viewingId); if(!c)return;
    const costs=caseCosts(c); costs.splice(idx,1);
    writeCosts(c, costs);
  }
  function updateTaskName(idx,name) {
    const c=cases.find(x=>x.id===viewingId); if(!c)return;
    const t=parseTasks(c.tasks); if(t[idx])t[idx].name=name;
    c.tasks=JSON.stringify(t); syncTasks(c);
  }
  function setTaskStatus(idx,status) {
    const c=cases.find(x=>x.id===viewingId); if(!c)return;
    const t=parseTasks(c.tasks); if(t[idx])t[idx].status=status;
    c.tasks=JSON.stringify(t); renderPanel(); syncTasks(c);
  }
  function updateTaskNote(idx, note) {
    const c=cases.find(x=>x.id===viewingId); if(!c)return;
    const t=parseTasks(c.tasks); if(t[idx])t[idx].note=note;
    c.tasks=JSON.stringify(t); syncTasks(c);
  }
  function deleteTask(idx) {
    const c=cases.find(x=>x.id===viewingId); if(!c)return;
    const t=parseTasks(c.tasks); t.splice(idx,1);
    c.tasks=JSON.stringify(t); renderPanel(); syncTasks(c);
  }
  async function saveProgressNote() {
    const note=document.getElementById('panel-note')?.value||'';
    const c=cases.find(x=>x.id===viewingId); if(!c)return;
    c.progress_note=note; saveLocal(); renderAll(); showToast('備注已儲存 ✓');
    if(db){setSyncDot('loading');try{const{error}=await db.from('cases').update({progress_note:note}).eq('id',viewingId);setSyncDot(error?'err':'ok');}catch(e){setSyncDot('err');}}
  }
  function addDeadlineToGCal(caseId) {
    const c = cases.find(x=>x.id===caseId); if(!c||!c.deadline) return;
    const d = c.deadline.replace(/-/g,'');
    const dNext = gcalNextDay(c.deadline);
    const title = encodeURIComponent((c.name||'專案') + ' — Deadline');
    const details = encodeURIComponent([c.client?`客戶：${c.client}`:'', c.status?`狀態：${c.status}`:''].filter(Boolean).join('\n'));
    window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${d}/${dNext}&details=${details}`, '_blank');
  }

  function showTaskDatePicker(anchor, idx) {
    if (_ddAnchor === anchor) { closeInlineDD(); return; }
    closeInlineDD();
    _ddAnchor = anchor;
    const c = cases.find(x=>x.id===viewingId); if(!c) return;
    const t = parseTasks(c.tasks); const task = t[idx];
    const dd = document.createElement('div');
    dd.className = 'inline-dd date-picker-dd'; dd.id = 'inline-dd';
    dd.innerHTML = `
      <div class="dp-title">📅 項目日期</div>
      <div class="dp-row"><input type="date" id="dp-task-date" value="${task?.date||''}"></div>
      <div class="dp-actions">
        <button class="dp-btn-clear" onclick="updateTaskDate(${idx},'');closeInlineDD()">清除</button>
        <button class="dp-btn-confirm" onclick="updateTaskDate(${idx},document.getElementById('dp-task-date').value);closeInlineDD()">確定</button>
      </div>`;
    positionDD(dd, anchor);
    document.body.appendChild(dd);
    setTimeout(() => document.addEventListener('click', onOutside), 10);
  }

  function updateTaskDate(idx, date) {
    const c = cases.find(x=>x.id===viewingId); if(!c) return;
    const t = parseTasks(c.tasks); if(t[idx]) t[idx].date = date;
    c.tasks = JSON.stringify(t); renderPanel(); syncTasks(c);
  }

  function addTaskToGCal(idx) {
    const c = cases.find(x=>x.id===viewingId); if(!c) return;
    const t = parseTasks(c.tasks); const task = t[idx]; if(!task||!task.date) return;
    const d = task.date.replace(/-/g,'');
    const title = encodeURIComponent((task.name||'項目') + (c.name?` (${c.name})`:''));
    const details = encodeURIComponent(task.note||'');
    window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${d}/${d}&details=${details}`, '_blank');
  }

  function gcalNextDay(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + 1);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}${m}${day}`;
  }

  function addToGoogleCalendar(caseId) {
    const c = cases.find(x=>x.id===caseId); if(!c) return;
    const title = encodeURIComponent(c.name||'專案');
    let dates = '';
    if (c.start_date && c.end_date) {
      dates = c.start_date.replace(/-/g,'') + '/' + gcalNextDay(c.end_date);
    } else if (c.start_date) {
      dates = c.start_date.replace(/-/g,'') + '/' + gcalNextDay(c.start_date);
    } else if (c.deadline) {
      dates = c.deadline.replace(/-/g,'') + '/' + gcalNextDay(c.deadline);
    }
    const parts = [c.client?`客戶：${c.client}`:'', c.status?`狀態：${c.status}`:'', c.note?`備註：${c.note}`:''].filter(Boolean);
    const details = encodeURIComponent(parts.join('\n'));
    window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dates}&details=${details}`, '_blank');
  }

  async function deleteCase(id) {
    if(!confirm('確定刪除這個專案？'))return;
    cases=cases.filter(c=>c.id!==id); saveLocal(); closePanel(); renderAll(); showToast('已刪除');
    if(db){setSyncDot('loading');try{const{error}=await db.from('cases').delete().eq('id',id);setSyncDot(error?'err':'ok');}catch(e){setSyncDot('err');}}
  }

  // ── Modal ─────────────────────────────────
  function openModal(id=null) {
    editingId=id;
    if(id){
      const c=cases.find(x=>x.id===id);
      document.getElementById('modal-ttl').textContent='編輯專案';
      document.getElementById('m-name').value=c.name||'';
      document.getElementById('m-client').value=c.client||'';
      document.getElementById('m-category').value=c.category||'藝術';
      document.getElementById('m-status').value=c.status||'接洽中';
      document.getElementById('m-priority').value=c.priority||'中';
      document.getElementById('m-start').value=c.start_date||'';
      document.getElementById('m-end').value=c.end_date||'';
      document.getElementById('m-deadline').value=c.deadline||'';
      document.getElementById('m-quote').value=c.quote_amount||''; syncQuoteTax('gross');
      document.getElementById('m-pay-status').value=payLabel(c.payment_status)||'未收款';
    } else {
      document.getElementById('modal-ttl').textContent='新增專案';
      ['m-name','m-client'].forEach(x=>document.getElementById(x).value='');
      document.getElementById('m-category').value='藝術';
      document.getElementById('m-status').value='接洽中';
      document.getElementById('m-priority').value='中';
      ['m-start','m-end','m-deadline','m-quote','m-quote-net'].forEach(x=>document.getElementById(x).value='');
      document.getElementById('m-pay-status').value='未收款';
    }
    document.getElementById('modal').classList.add('open');
  }
  function openModalForStatus(s){openModal();document.getElementById('m-status').value=s;}
  function closeModal(){document.getElementById('modal').classList.remove('open');editingId=null;}

  async function saveCase() {
    const name=document.getElementById('m-name').value.trim();
    if(!name){showToast('請輸入專案名稱');return;}
    const data={
      name,client:document.getElementById('m-client').value.trim(),
      category:document.getElementById('m-category').value,
      status:document.getElementById('m-status').value,
      priority:document.getElementById('m-priority').value,
      start_date:document.getElementById('m-start').value,
      end_date:document.getElementById('m-end').value,
      deadline:document.getElementById('m-deadline').value,
      quote_amount:parseFloat(document.getElementById('m-quote').value)||0,
      payment_status:document.getElementById('m-pay-status').value,
    };
    const isNew=!editingId;
    if(isNew){data.contact_name='';data.contact_info='';data.note='';data.id=Date.now().toString();data.created_at=new Date().toISOString();data.progress_note='';data.tasks='[]';cases.unshift(data);}
    else{const i=cases.findIndex(c=>c.id===editingId);if(i!==-1)cases[i]={...cases[i],...data};}
    const savedId=editingId||data.id;
    const savedCase = cases.find(c=>c.id===savedId);
    if (savedCase && !inViewYear(savedCase)) viewYear = caseYear(savedCase);
    saveLocal();renderAll();closeModal();showToast(isNew?'已新增 ✓':'已更新 ✓');
    if(viewingId===savedId)renderPanel();
    if(db){setSyncDot('loading');try{const{error}=isNew?await db.from('cases').insert(data):await db.from('cases').update(data).eq('id',savedId);if(error){setSyncDot('err');showToast('⚠ 雲端同步失敗：'+error.message);}else{setSyncDot('ok');}}catch(e){setSyncDot('err');showToast('⚠ 雲端連線錯誤：'+e.message);}}
  }

  init();

  // ── Swipe-right to close panel (mobile) ───
  (function() {
    const panel = document.getElementById('panel-col');
    let startX = 0, startY = 0, active = false;
    // Listen on document; only activate when panel is open and touch starts from left edge
    document.addEventListener('touchstart', e => {
      const wrap = document.getElementById('app-wrap');
      if (!wrap.classList.contains('open')) return;
      const touch = e.touches[0];
      if (touch.clientX > 44) return;
      startX = touch.clientX;
      startY = touch.clientY;
      active = true;
    }, { passive: true });
    document.addEventListener('touchmove', e => {
      if (!active) return;
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      if (Math.abs(dy) > Math.abs(dx) + 10) { active = false; panel.style.transform = ''; return; }
      panel.style.transition = 'none';
      if (dx > 0) panel.style.transform = `translateX(${dx}px)`;
    }, { passive: true });
    document.addEventListener('touchend', e => {
      if (!active) return;
      active = false;
      panel.style.transition = '';
      const dx = e.changedTouches[0].clientX - startX;
      if (dx > 60) {
        panel.style.transform = '';
        closePanel();
      } else {
        panel.style.transform = '';
      }
    });
  })();
</script>
</body>
